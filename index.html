let loginBusy = false;

async function handleLogin(form) {
  if (loginBusy) return;
  const fd = new FormData(form);
  const login = String(fd.get('login') || '').trim().toLowerCase();
  const password = String(fd.get('password') || '');
  if (!login || !password) {
    showLoginError('Введіть логін і пароль');
    return;
  }
  const wait = lockRemaining(login);
  if (wait > 0) {
    showLoginError(`Забагато невдалих спроб. Спробуйте через ${formatWait(wait)}.`);
    return;
  }

  const button = form.querySelector('button[type="submit"]');
  loginBusy = true;
  button.disabled = true;
  try {
    const linked = state.ministers.filter((m) => m.login === login);
    const minister = linked[0];
    // Для неіснуючого логіна теж рахуємо хеш — відповідь займає однаковий час
    const ok = minister ? await verifyPassword(minister, password) : (await verifyPassword({ passwordHash: null }, `${password}\u0000`), false);
    if (!ok) {
      registerFailure(login);
      const locked = lockRemaining(login);
      showLoginError(locked > 0 ? `Забагато невдалих спроб. Вхід заблоковано на ${formatWait(locked)}.` : 'Невірний логін або пароль');
      form.elements.password.value = '';
      form.elements.password.focus();
      return;
    }
    clearFailures(login);
    // Оновити старий формат хешу (SHA-256 без солі) до PBKDF2
    if (minister.passwordHash && !minister.passwordHash.startsWith('pbkdf2$') && hasWebCrypto()) {
      const upgraded = await hashPassword(password);
      linked.forEach((a) => { a.passwordHash = upgraded; });
      saveState(true);
    }
    if (minister.totp) renderOtpStep(linked, fd.get('remember') === 'on');
    else finishLogin(linked, fd.get('remember') === 'on');
  } finally {
    loginBusy = false;
    if (document.contains(button)) button.disabled = false;
  }
}

async function changePassword(form) {
  if (CLOUD) { cloudChangePassword(form); return; }
  const user = currentUser();
  const fd = new FormData(form);
  const current = String(fd.get('current') || '');
  const next = String(fd.get('next') || '');
  const confirm = String(fd.get('confirm') || '');
  const button = form.querySelector('button[type="submit"]');
  button.disabled = true;
  try {
    const errors = {};
    const wait = lockRemaining(user.login);
    if (wait > 0) errors.current = `Забагато невдалих спроб. Спробуйте через ${formatWait(wait)}.`;
    else if (!(await verifyPassword(user, current))) {
      registerFailure(user.login);
      errors.current = 'Поточний пароль невірний';
    }
    const policy = passwordPolicyError(next, user);
    if (policy) errors.next = policy;
    else if (next === current) errors.next = 'Новий пароль має відрізнятися від поточного';
    if (!errors.next && next !== confirm) errors.confirm = 'Паролі не збігаються';
    setFieldErrors(form, errors);
    if (Object.keys(errors).length) return;
    clearFailures(user.login);
    const hashed = await hashPassword(next);
    linkedAccounts(user).forEach((a) => { a.passwordHash = hashed; });
    logActivity('minister', 'Змінено пароль облікового запису', user.id);
    commit('Пароль змінено. Наступного разу входьте з новим паролем.');
  } finally {
    if (document.contains(button)) button.disabled = false;
  }
}

function logout() {
  if (CLOUD) { cloudLogout(); return; }
  const user = currentUser();
  clearVoiceToken(); // наступна людина на цьому пристрої не побачить ідей учнів без ключа
  clearSession();
  session = null;
  renderAuth(user ? user.login : '');
  toast('Ви вийшли з облікового запису', 'info');
}

/* ---------- 14. Модальні вікна, підтвердження, тости ---------- */

function openModal({ title, iconName = null, body, size = 'md', danger = false, onClose = null }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const titleId = uid('mt');
  overlay.innerHTML = `
    <div class="modal modal--${size}" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
      <header class="modal__header">
        <div class="modal__title-wrap">
          ${iconName ? `<span class="modal__icon ${danger ? 'is-danger' : ''}">${icon(iconName)}</span>` : ''}
          <h2 class="modal__title" id="${titleId}">${esc(title)}</h2>
        </div>
        <button type="button" class="icon-btn" data-action="close-modal" aria-label="Закрити">${icon('x')}</button>
      </header>
      <div class="modal__body">${body}</div>
    </div>`;

  overlay.addEventListener('mousedown', (e) => {
    if (e.target === overlay) closeModal(overlay);
  });

  document.body.appendChild(overlay);
  document.body.classList.add('has-modal');
  modalStack.push({ el: overlay, onClose, lastFocus: document.activeElement });
  refreshIcons();

  requestAnimationFrame(() => overlay.classList.add('is-open'));
  setTimeout(() => {
    const focusable = overlay.querySelector('.modal__body input:not([type=hidden]):not([type=radio]), .modal__body textarea, .modal__body select, .modal__body .btn--gold, .modal__body .btn--danger');
    (focusable || overlay.querySelector('.modal__body button') || overlay.querySelector('.modal__header .icon-btn'))?.focus({ preventScroll: true });
  }, 60);

  return overlay;
}

function closeModal(target) {
  const entry = target
    ? modalStack.find((m) => m.el === target)
    : modalStack[modalStack.length - 1];
  if (!entry) return;
  modalStack.splice(modalStack.indexOf(entry), 1);
  entry.el.classList.remove('is-open');
  entry.el.classList.add('is-closing');
  setTimeout(() => entry.el.remove(), 220);
  if (!modalStack.length) document.body.classList.remove('has-modal');
  closeStatusMenu();
  if (entry.onClose) entry.onClose();
  if (entry.lastFocus && document.contains(entry.lastFocus)) entry.lastFocus.focus({ preventScroll: true });
}

function closeAllModals() {
  while (modalStack.length) closeModal();
}

/** Оновлює вміст відкритих вікон «Деталі завдання» після змін у даних. */
function refreshOpenModals() {
  [...modalStack].forEach((entry) => {
    const id = entry.el.dataset.taskView;
    if (!id) return;
    const task = getTask(id);
    if (!task) closeModal(entry.el);
    else entry.el.querySelector('.modal__body').innerHTML = taskViewBody(task);
  });
}

function confirmDialog({ title, text, confirmLabel = 'Підтвердити', danger = true }) {
  return new Promise((resolve) => {
    let settled = false;
    const finish = (value) => {
      if (!settled) { settled = true; resolve(value); }
    };
    const modal = openModal({
      title,
      iconName: danger ? 'triangle-alert' : 'circle-help',
      danger,
      size: 'sm',
      onClose: () => finish(false),
      body: `
        <p class="confirm-text">${text}</p>
        <div class="modal__footer">
          <button type="button" class="btn btn--ghost" data-action="close-modal">Скасувати</button>
          <button type="button" class="btn ${danger ? 'btn--danger' : 'btn--gold'}" data-role="confirm">${confirmLabel}</button>
        </div>`,
    });
    modal.querySelector('[data-role="confirm"]').addEventListener('click', () => {
      finish(true);
      closeModal(modal);
    });
  });
}

function toast(message, type = 'success') {
  const icons = { success: 'circle-check', error: 'circle-alert', info: 'info' };
  const el = document.createElement('div');
  el.className = `toast toast--${type}`;
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `${icon(icons[type] || 'info')}<span>${esc(message)}</span>`;
  $('#toasts').appendChild(el);
  refreshIcons();
  requestAnimationFrame(() => el.classList.add('is-visible'));
  setTimeout(() => {
    el.classList.remove('is-visible');
    setTimeout(() => el.remove(), 320);
  }, type === 'error' ? 5200 : 3200);
}

function setFieldErrors(form, errors) {
  $$('.field[data-field]', form).forEach((field) => {
    const message = errors[field.dataset.field];
    field.classList.toggle('has-error', Boolean(message));
    const box = $('.field__error', field);
    if (box) box.textContent = message || '';
  });
  const firstError = $('.field.has-error input, .field.has-error select, .field.has-error textarea', form);
  if (firstError) firstError.focus();
}

/* Поповер швидкої зміни статусу */
function openStatusMenu(anchor, id) {
  closeStatusMenu();
  const task = getTask(id);
  if (!task) return;

  const menu = document.createElement('div');
  menu.className = 'popover';
  menu.setAttribute('role', 'menu');
  menu.dataset.for = id;
  menu.innerHTML = `
    <div class="popover__label">Змінити статус</div>
    ${EDITABLE_STATUSES.map((k) => `
      <button type="button" class="popover__item ${task.status === k ? 'is-active' : ''}" role="menuitemradio"
        aria-checked="${task.status === k}" data-action="set-status" data-id="${id}" data-status="${k}">
        <span class="dot st--${k}"></span>${STATUSES[k].label}${task.status === k ? icon('check') : ''}
      </button>`).join('')}
    ${needsTz(task) ? '<p class="popover__note">Щоб позначити «Виконано», спочатку прикріпіть ТЗ — для цього завдання воно обовʼязкове.</p>' : ''}
    ${effectiveStatus(task) === 'overdue' ? '<p class="popover__note">Дедлайн минув — статус «Прострочено» встановлено автоматично. Змініть дату або позначте завдання виконаним.</p>' : ''}`;

  document.body.appendChild(menu);
  refreshIcons();

  statusMenu = { el: menu, anchor, id };
  positionStatusMenu();
  (menu.querySelector('.popover__item.is-active') || menu.querySelector('.popover__item')).focus({ preventScroll: true });
}

/** Тримає поповер біля бейджа під час прокрутки; закриває, якщо бейдж зник з екрана. */
function positionStatusMenu() {
  if (!statusMenu) return;
  const { el, anchor } = statusMenu;
  if (!document.contains(anchor)) { closeStatusMenu(); return; }
  const r = anchor.getBoundingClientRect();
  if (r.bottom < 0 || r.top > window.innerHeight) { closeStatusMenu(); return; }
  const mw = el.offsetWidth;
  const mh = el.offsetHeight;
  let top = r.bottom + 6;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  const left = Math.max(8, Math.min(r.left, window.innerWidth - mw - 8));
  el.style.top = `${top}px`;
  el.style.left = `${left}px`;
}

function closeStatusMenu() {
  if (!statusMenu) return;
  statusMenu.el.remove();
  statusMenu = null;
}

  const prevApproval = task && task.approval ? task.approval : null;

    : can('approve')
      ? 'Ви погоджуєте заходи, тож позначка одразу матиме статус «Погоджено».'
      : 'Адміністрація школи й арт-менеджери отримають запит. Без погодження захід не можна позначити виконаним.';

          ${multi ? '<p class="field__hint">«Усі міністри» — для зустрічей і подій усього кабінету: завдання зʼявиться в кожного міністра.</p>' : ''}
          <p class="field__error"></p>

            <label class="status-option st--${k}">
              <input type="radio" name="status" value="${k}" ${data.status === k ? 'checked' : ''}>
              <span>${icon(STATUSES[k].icon)}${STATUSES[k].label}</span>

      </div>

      <div class="field">
        <label for="f-plan">План організації</label>
        <textarea class="input" id="f-plan" name="plan" rows="5" maxlength="4000" placeholder="Кроки, відповідальні, ресурси, місце проведення…">${esc(data.plan)}</textarea>
      </div>

      <div class="field" data-field="docLink">

        <div class="input-icon">
          ${icon('link')}

          <span class="switch-row__text">

            <small>Статут: кожне міністерство пропонує щонайменше одну нову ініціативу за чверть. Такі завдання рахуються в «Планах і звітах».</small>

        <div class="field" data-field="approval">

          <div class="helper-picks">
            ${cabinetMembers().map((m) => `
              <label class="helper-pick">
                <input type="checkbox" name="helpers" value="${m.id}" ${(data.helpers || []).includes(m.id) ? 'checked' : ''}>
                <span>${avatar(m, 'xs')}<span>${esc(m.position)}</span></span>
              </label>`).join('')}
          </div>
          <p class="field__hint">Залучені міністерства побачать завдання у своєму списку й отримають сповіщення. Відповідальну посаду тут можна не позначати.</p>
        </fieldset>
      </div>

      ${can('require-tz') ? `
      <label class="switch-row">
        <span class="switch"><input type="checkbox" name="tzRequired" ${data.tzRequired ? 'checked' : ''}><span aria-hidden="true"></span></span>
        <span class="switch-row__text">
          <b>Потрібне ТЗ</b>
          <small>Відповідальний обовʼязково прикріплює PDF або посилання на Google Docs — без цього завдання не закрити. Після прикріплення арт-менеджери отримають сповіщення.</small>
        </span>
      </label>` : (data.tzRequired ? `
      <p class="form-note form-note--tz">${icon('file-warning')}<span><b>ТЗ обовʼязкове</b>${requester ? ` — вимагає ${esc(requester.position)} (${esc(requester.name)})` : ''}. Прикріпіть PDF або посилання на Google Docs: після збереження арт-менеджери отримають сповіщення й зможуть його прочитати.</span></p>` : '')}

      <div class="field" data-field="attachment">

        <div data-role="attach-box"></div>
        <input type="file" accept="application/pdf,.pdf" data-role="attach-input" hidden>
        <p class="field__hint">До 2 МБ. Файл зберігається разом із завданням і відкривається прямо в системі. <button type="button" class="link-btn" data-action="view-tz-example">${icon('file-search')}Приклад ТЗ</button></p>
        <p class="field__error"></p>
      </div>

      <div class="modal__footer">
        <button type="button" class="btn btn--ghost" data-action="close-modal">Скасувати</button>

      </div>
    </form>`;

  const modal = openModal({ title: task ? 'Редагування завдання' : preset.fromDraft ? 'Завдання з чернетки' : 'Нове завдання', iconName: task ? 'pencil' : 'plus', body });
  const form = $('#task-form', modal);

  /* Прикріплений PDF: змінюється лише після натискання «Зберегти» */
  let attachment = task && task.attachment ? task.attachment : null;
  let attachmentChanged = false;
  const attachBox = $('[data-role="attach-box"]', form);
  const attachInput = $('[data-role="attach-input"]', form);
  const renderAttach = () => {
    attachBox.innerHTML = attachment ? `
      <div class="attach-chip">
        <span class="attach-chip__icon">${icon('file-type')}</span>
        <span class="attach-chip__text"><b title="${esc(attachment.name)}">${esc(attachment.name)}</b><small>PDF · ${formatSize(attachment.size)}</small></span>
        <span class="attach-chip__actions">
          <button type="button" class="icon-btn icon-btn--sm" data-role="attach-view" title="Переглянути" aria-label="Переглянути PDF">${icon('eye')}</button>
          <button type="button" class="icon-btn icon-btn--sm" data-role="attach-pick" title="Замінити" aria-label="Замінити PDF">${icon('refresh-cw')}</button>
          <button type="button" class="icon-btn icon-btn--sm icon-btn--danger" data-role="attach-remove" title="Прибрати" aria-label="Прибрати PDF">${icon('trash-2')}</button>
        </span>
      </div>` : `
      <button type="button" class="attach-drop" data-role="attach-pick">
        ${icon('paperclip')}<span><b>Прикріпити PDF</b><small>Оберіть файл ТЗ з комп'ютера чи телефона</small></span>
      </button>`;
    refreshIcons();
  };
  renderAttach();
  attachBox.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-role]');
    if (!btn) return;
    if (btn.dataset.role === 'attach-pick') attachInput.click();
    else if (btn.dataset.role === 'attach-view' && attachment) openPdfViewer(attachment);
    else if (btn.dataset.role === 'attach-remove') {
      attachment = null;
      attachmentChanged = true;
      renderAttach();
    }
  });
  attachInput.addEventListener('change', async () => {
    const file = attachInput.files && attachInput.files[0];
    attachInput.value = '';
    if (!file) return;
    try {
      attachment = await readPdf(file);
      attachmentChanged = true;
      setFieldErrors(form, {});
      renderAttach();
    } catch (err) {
      setFieldErrors(form, { attachment: err.message });
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const values = {
      title: String(fd.get('title') || '').trim(),
      ministerId: String(fd.get('ministerId') || ''),
      date: String(fd.get('date') || ''),
      status: EDITABLE_STATUSES.includes(fd.get('status')) ? String(fd.get('status')) : 'planned',
      plan: String(fd.get('plan') || '').trim(),
      docLink: String(fd.get('docLink') || '').trim(),
      tzRequired: can('require-tz') ? fd.get('tzRequired') === 'on' : Boolean(task && task.tzRequired),
      initiative: fd.get('initiative') === 'on',
    };
    const memberIds = new Set(cabinetMembers().map((m) => m.id));
    values.helpers = fd.getAll('helpers').map(String)
      .filter((id, i, arr) => memberIds.has(id) && id !== values.ministerId && arr.indexOf(id) === i);
    const prevHelpers = task ? [...(task.helpers || [])] : [];

    /* Погодження масштабного заходу (статут: «Погодження») */
    const stamp = Date.now();
    let approvalRequested = false;
    values.approval = null;
    if (fd.get('approvalNeeded') === 'on') {
      const selfApprove = can('approve');
      const keyChanged = Boolean(task && (values.date !== task.date || values.title !== task.title));
      const resubmit = !prevApproval || prevApproval.status === 'returned' || (keyChanged && prevApproval.status === 'approved' && !selfApprove);
      if (resubmit) {
        values.approval = selfApprove
          ? { status: 'approved', requestedBy: user.id, requestedAt: stamp, decidedBy: user.id, decidedAt: stamp, comment: '' }
          : { status: 'pending', requestedBy: user.id, requestedAt: stamp, decidedBy: null, decidedAt: null, comment: '' };
        approvalRequested = !selfApprove;
      } else {
        values.approval = prevApproval;
      }
    }
    if (values.docLink && !/^[a-z]+:\/\//i.test(values.docLink)) values.docLink = `https://${values.docLink}`;
    const wasRequired = Boolean(task && task.tzRequired);
    if (!values.tzRequired) values.tzRequestedBy = null;
    else if (!wasRequired) values.tzRequestedBy = user.id;
    const finalAttachment = attachmentChanged ? attachment : (task ? task.attachment : null);
    const finalHasTz = Boolean(finalAttachment || values.docLink);
    const tzAdded = Boolean((attachmentChanged && attachment) || (values.docLink && values.docLink !== (task ? task.docLink : '')));

    const errors = {};
    if (!values.title) errors.title = 'Опишіть, що плануєте';
    if (values.ministerId === ALL_ID) {
      if (!multi) errors.ministerId = 'Завдання для всього кабінету створюють Президент, Премʼєр, адміністрація та арт-менеджери';
    } else if (!getMinister(values.ministerId) || isStaff(getMinister(values.ministerId))) errors.ministerId = 'Оберіть відповідального міністра';
    else if (!assignable.some((m) => m.id === values.ministerId) && !(task && task.ministerId === values.ministerId)) {
      errors.ministerId = multi ? 'Цій посаді ви не можете призначати завдання' : 'Ви можете призначати завдання лише своїй посаді';
    }
    if (values.status === 'done' && values.approval && values.approval.status !== 'approved') {
      errors.approval = 'Масштабний захід можна позначити виконаним лише після погодження адміністрацією.';
    }
    if (!isValidISO(values.date)) errors.date = 'Вкажіть коректну дату';
    if (values.docLink && !isSafeUrl(values.docLink)) errors.docLink = 'Вставте повне посилання, що починається з https://';
    if (values.status === 'done' && values.tzRequired && !finalHasTz) {
      errors.attachment = 'Це завдання не можна закрити без ТЗ — прикріпіть PDF або посилання на Google Docs.';
    }
    setFieldErrors(form, errors);
    if (Object.keys(errors).length) return;

    if (attachmentChanged) values.attachment = attachment;

    /* Сповіщення: нове ТЗ — арт-менеджерам і тому, хто його вимагав; вимога ТЗ — відповідальному */
    const sendTzNotifications = (taskObj, ministerChanged) => {
      let sent = 0;
      if (tzAdded && finalHasTz && !isManager(user)) {
        sent = notify('tz-submitted', taskObj, `Прикріплено ТЗ до «${taskObj.title}»`, [...managers().map((m) => m.id), taskObj.tzRequestedBy]);
      }
      if (values.tzRequired && !finalHasTz && (!wasRequired || ministerChanged) && taskObj.ministerId && taskObj.ministerId !== ALL_ID) {
        notify('tz-requested', taskObj, `Потрібно прикріпити ТЗ до «${taskObj.title}»`, [taskObj.ministerId]);
      }
      return sent;
    };
    const sendCharterNotifications = (taskObj) => {
      if (approvalRequested) {
        notify('approval-request', taskObj, `Потрібне погодження: «${taskObj.title}»`, [...managers(), ...schoolStaff()].map((m) => m.id));
        logActivity('approval', `«${taskObj.title}» надіслано на погодження адміністрації`, taskObj.ministerId);
      }
      const added = (taskObj.helpers || []).filter((id) => !prevHelpers.includes(id));
      if (added.length) notify('helper-added', taskObj, `Вас залучено до «${taskObj.title}»`, added);
    };

    const now = Date.now();
    if (task) {
      const snapshot = { ...task };
      const wasDone = task.status === 'done';
      Object.assign(task, values, { updatedAt: now, demo: false });
      if (!task.attachment) delete task.attachment;
      if (values.status === 'done' && !wasDone) task.completedAt = now;
      if (values.status !== 'done') task.completedAt = null;
      if (!saveState(true)) {
        Object.keys(task).forEach((key) => { delete task[key]; });
        Object.assign(task, snapshot);
        setFieldErrors(form, { attachment: 'Не вдалося зберегти: у браузері закінчилося місце. Спробуйте менший PDF або додайте посилання на Google Docs.' });
        return;
      }
      const sent = sendTzNotifications(task, snapshot.ministerId !== task.ministerId);
      sendCharterNotifications(task);
      logActivity('update', tzAdded ? `Прикріплено ТЗ до «${task.title}»` : `Оновлено завдання «${task.title}»`, task.ministerId);
      closeModal(modal);
      commit(approvalRequested ? 'Збережено — захід надіслано на погодження' : sent ? 'ТЗ прикріплено — арт-менеджери отримали сповіщення' : 'Зміни збережено');
    } else {
      const created = {
        id: uid('t'),
        ...values,
        createdBy: user.id,
        demo: false,
        createdAt: now,
        updatedAt: now,
        completedAt: values.status === 'done' ? now : null,
      };
      if (!created.attachment) delete created.attachment;
      state.tasks.push(created);
      if (!saveState(true)) {
        state.tasks.pop();
        setFieldErrors(form, { attachment: 'Не вдалося зберегти: у браузері закінчилося місце. Спробуйте менший PDF або додайте посилання на Google Docs.' });
        return;
      }
      const m = getAssignee(values.ministerId);
      const sent = sendTzNotifications(created, false);
      logActivity('create', `${m.position}: нове завдання «${created.title}»${preset.fromDraft ? ' (з чернетки)' : ''}`, created.ministerId);
      sendCharterNotifications(created);
      if (preset.fromDraft) state.drafts = state.drafts.filter((d) => d.id !== preset.fromDraft);
      closeModal(modal);
      commit(approvalRequested ? 'Завдання створено й надіслано на погодження' : sent ? 'Завдання створено — арт-менеджери отримали ТЗ' : preset.fromDraft ? 'Ідею перетворено на завдання' : 'Завдання створено');
    }
  });
}

function readPdf(file) {
  return new Promise((resolve, reject) => {
    const looksPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if (!looksPdf) {
      reject(new Error('Оберіть файл у форматі PDF'));
      return;
    }
    if (file.size > ATTACH_MAX_FILE) {
      reject(new Error(`Файл завеликий (${formatSize(file.size)}). Максимум — 2 МБ; для більших ТЗ додайте посилання на Google Docs.`));
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = String(reader.result).split(',')[1] || '';
      if (!base64.startsWith('JVBERi')) { // сигнатура «%PDF»
        reject(new Error('Файл пошкоджений або не є PDF'));
        return;
      }
      resolve({ name: file.name.slice(0, 120), size: file.size, data: `data:application/pdf;base64,${base64}` });
    };
    reader.onerror = () => reject(new Error('Не вдалося прочитати файл'));
    reader.readAsDataURL(file);
  });
}

function dataUrlToBlob(dataUrl) {
  const [head, base64] = dataUrl.split(',');
  const mime = head.slice(5).split(';')[0];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

/* Перегляд PDF: сторінки малює PDF.js (завантажується з CDN лише при першому відкритті),
   тому файл видно всюди — у браузері, в артефакті й на телефоні. */
/* Файли з npm-пакета pdfjs-dist; цілісність перевіряється хешем (SRI) */
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js';
const PDFJS_WORKER_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
const SRI = {
  [PDFJS_URL]: 'sha384-uLiAv4VcjM5H2Jsqzl8EajEaxPugj1CIzQaCjQ8c5//vC+elhxO5pZfXGxoLQi1W',
  [PDFJS_WORKER_URL]: 'sha384-cdzss87ZwpiG252tPQexupMwS1W1lTzzgy/UlNUHXW6h8aaJpBizRQk9j8Vj3zw9',
};
let pdfjsPromise = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    if (SRI[src]) {
      script.integrity = SRI[src];
      script.crossOrigin = 'anonymous';
    }
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error(`Не вдалося завантажити ${src}`));
    document.head.appendChild(script);
  });
}

function loadPdfJs() {
  if (!pdfjsPromise) {
    pdfjsPromise = (async () => {
      if (!window.pdfjsLib) await loadScript(PDFJS_URL);
      // Обробник PDF у головному потоці — без окремого воркера з іншого домену
      if (!window.pdfjsWorker) await loadScript(PDFJS_WORKER_URL);
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
      return window.pdfjsLib;
    })().catch((err) => {
      pdfjsPromise = null;
      throw err;
    });
  }
  return pdfjsPromise;
}

function base64ToBytes(dataUrl) {
  const binary = atob(dataUrl.split(',')[1]);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function renderPdfPages(att, box) {
  try {
    const pdfjs = await loadPdfJs();
    const doc = await pdfjs.getDocument({ data: base64ToBytes(att.data), isEvalSupported: false }).promise;
    if (!document.contains(box)) return;
    box.innerHTML = '';
    const width = Math.max(240, box.clientWidth - 24);
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    for (let n = 1; n <= doc.numPages; n += 1) {
      if (!document.contains(box)) break; // вікно закрили
      const page = await doc.getPage(n);
      const scale = Math.min(1.6, width / page.getViewport({ scale: 1 }).width);
      const viewport = page.getViewport({ scale: scale * ratio });
      const canvas = document.createElement('canvas');
      canvas.className = 'pdf-page';
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = `${Math.floor(viewport.width / ratio)}px`;
      canvas.setAttribute('aria-label', `Сторінка ${n} з ${doc.numPages}`);
      box.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }
    doc.destroy();
  } catch (err) {
    console.error(err);
    if (document.contains(box)) {
      box.innerHTML = emptyState({
        iconName: 'file-type',
        title: 'Не вдалося показати PDF',
        text: 'Перевірте підключення до інтернету або завантажте файл і відкрийте його на пристрої.',
        small: true,
      });
      refreshIcons();
    }
  }
}

function pdfFilename(name) {
  return /\.pdf$/i.test(name) ? name : `${name}.pdf`;
}

function openPdfViewer(att) {
  if (CLOUD && att && att.path && !att.data) {
    cloudPdfData(att).then((data) => openPdfViewer({ ...att, data })).catch((err) => toast(cloudErrorText(err), 'error'));
    return;
  }
  const body = `
    <div class="pdf-pages" data-role="pdf-pages">
      <div class="pdf-loading">${icon('loader')}<span>Відкриваю PDF…</span></div>
    </div>
    <div class="modal__footer">
      <span class="pdf-meta">${icon('file-type')}<span>${esc(att.name)} · ${formatSize(att.size)}</span></span>
      <button type="button" class="btn btn--gold" data-role="pdf-download">${icon('download')}<span>Завантажити PDF</span></button>
    </div>`;
  const modal = openModal({ title: 'Технічне завдання (PDF)', iconName: 'file-type', size: 'lg', body });
  modal.querySelector('[data-role="pdf-download"]').addEventListener('click', async () => {
    if (await download(pdfFilename(att.name), dataUrlToBlob(att.data), 'application/pdf')) toast('PDF збережено');
  });
  renderPdfPages(att, modal.querySelector('[data-role="pdf-pages"]'));
}

function setTaskStatus(id, status) {
  const task = getTask(id);
  closeStatusMenu();
  if (!task || !EDITABLE_STATUSES.includes(status) || task.status === status) return;
  if (!requireTaskAccess(task)) return;
  if (status === 'done' && needsTz(task)) {
    toast('Спочатку прикріпіть ТЗ — для цього завдання воно обовʼязкове', 'error');
    return;
  }
  if (status === 'done' && task.approval && task.approval.status !== 'approved') {
    toast('Масштабний захід можна закрити лише після погодження адміністрацією', 'error');
    return;
  }
  task.status = status;
  task.updatedAt = Date.now();
  task.completedAt = status === 'done' ? Date.now() : null;
  if (status === 'done') logActivity('done', `Виконано: «${task.title}»`, task.ministerId);
  else logActivity('status', `«${task.title}» → ${STATUSES[status].label}`, task.ministerId);
  commit(status === 'done' ? 'Завдання позначено як виконане' : `Статус змінено: «${STATUSES[status].label}»`);
}

function toggleDone(id) {
  const task = getTask(id);
  if (!task) return;
  setTaskStatus(id, task.status === 'done' ? 'progress' : 'done');
}

async function deleteTask(id) {
  const task = getTask(id);
  if (!task || !requireTaskAccess(task)) return;
  const ok = await confirmDialog({
    title: 'Видалити завдання?',
    text: `Завдання <b>«${esc(task.title)}»</b> буде видалено без можливості відновлення.`,
    confirmLabel: 'Видалити',
  });
  if (!ok) return;
  state.tasks = state.tasks.filter((t) => t.id !== id);
  pruneNotifications();
  logActivity('delete', `Видалено завдання «${task.title}»`, task.ministerId);
  closeAllModals();
  commit('Завдання видалено');
}

      ${minister && (CLOUD ? isManager(currentUser()) : minister.passwordHash) ? `

            <button type="button" class="btn btn--danger-ghost btn--sm" data-role="remove-photo" ${photo ? '' : 'hidden'}>${icon('trash-2')}<span>Прибрати</span></button>

        <button type="button" class="btn btn--ghost" data-action="close-modal">Скасувати</button>
        <button type="submit" class="btn btn--gold">${icon(minister ? 'save' : 'user-plus')}<span>${minister ? 'Зберегти' : 'Додати акаунт'}</span></button>
      </div>
    </form>`;

  const modal = openModal({ title: minister ? 'Редагування акаунта' : 'Новий акаунт', iconName: minister ? 'pencil' : 'user-plus', body });
  const form = $('#minister-form', modal);
  const loginInput = $('#m-login', form);
  let loginTouched = Boolean(minister);
  loginInput.addEventListener('input', () => { loginTouched = true; });
  $('#m-position', form).addEventListener('input', (e) => {
    if (!loginTouched) loginInput.value = e.target.value.trim() ? suggestLogin(e.target.value, otherLogins) : '';
  });
  if (userIsManager) {
    const preview = $('[data-role="photo-preview"]', form);
    const pickBtn = $('[data-role="pick-photo"]', form);
    const removeBtn = $('[data-role="remove-photo"]', form);
    const fileInput = $('[data-role="photo-input"]', form);
    const refreshPreview = () => {
      const picked = $('input[name="color"]:checked', form);
      preview.innerHTML = avatar({ name: $('#m-name', form).value.trim() || '?', color: picked ? picked.value : color, photo }, 'lg');
      removeBtn.hidden = !photo;
      pickBtn.querySelector('span').textContent = photo ? 'Змінити фото' : 'Завантажити фото';
    };

    pickBtn.addEventListener('click', () => {
      if (!consentBox.checked) {
        toast('Спершу підтвердіть згоду на використання фото', 'error');
        consentBox.focus();
        return;
      }
      fileInput.click();
    });
    removeBtn.addEventListener('click', () => {
      photo = null;
      photoChanged = true;
      refreshPreview();
    });
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      try {
        photo = await processPhoto(file);
        photoChanged = true;
        refreshPreview();
      } catch (err) {
        toast(err.message, 'error');
      }
    });
    $('#m-name', form).addEventListener('input', refreshPreview);
    $$('input[name="color"]', form).forEach((radio) => radio.addEventListener('change', refreshPreview));
  }

  $$('input[name="role"]', form).forEach((radio) => radio.addEventListener('change', () => {
    if (!radio.checked) return;
    $('#m-post-row', form).hidden = radio.value !== 'minister';
    $('#m-director-row', form).hidden = radio.value !== 'school';

    if (defaults[radio.value] && (!position.value.trim() || Object.values(defaults).includes(position.value.trim()))) {
      position.value = defaults[radio.value];
      position.dispatchEvent(new Event('input'));
    }
  }));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const values = {
      position: String(fd.get('position') || '').trim(),
      name: String(fd.get('name') || '').trim(),
      color: PALETTE.includes(fd.get('color')) ? String(fd.get('color')) : color,
      login: String(fd.get('login') || '').trim().toLowerCase(),
      role: userIsManager ? (['manager', 'school'].includes(fd.get('role')) ? String(fd.get('role')) : 'minister') : (minister ? minister.role : 'minister'),
    };
    const chosenPost = userIsManager ? String(fd.get('post') || 'minister') : (minister ? minister.post || 'minister' : 'minister');
    const director = userIsManager ? fd.get('director') === 'on' : Boolean(minister && minister.director);
    Object.assign(values, accountRole({ role: values.role, post: chosenPost, director }, values.position));
    const errors = {};
    if (!values.position) errors.position = 'Вкажіть посаду';
    if (!values.name) errors.name = 'Вкажіть прізвище та ініціали';
    if (!isValidEmail(values.login)) errors.login = `Вкажіть логін у форматі імʼя@${LOGIN_DOMAIN}`;
    else if (state.ministers.some((m) => m.id !== id && m.login === values.login && m.name.trim().toLowerCase() !== values.name.trim().toLowerCase())) {
      errors.login = 'Цей логін уже має інша людина. Один логін на кілька посад — лише для тієї самої людини (однакове імʼя).';
    }
    if (minister && isManager(minister) && values.role !== 'manager' && managers().length <= 1) {
      errors.login = errors.login || 'Має залишитися хоча б один арт-менеджер — роль не можна змінити в останнього.';
    }
    setFieldErrors(form, errors);
    if (Object.keys(errors).length) return;

    if (userIsManager && photoChanged) {
      values.photo = photo;
      values.photoConsent = photo ? { by: currentUser().id, ts: Date.now() } : null;
    }
    if (CLOUD) {
      form.querySelector('button[type="submit"]').disabled = true;
      cloudSaveAccount(minister, values, { resetPassword: fd.get('resetPassword') === 'on', resetTotp: fd.get('resetTotp') === 'on' }, modal);
      return;
    }

    // Спільний логін — спільні пароль і 2FA
    const twin = state.ministers.find((m) => m.id !== id && m.login === values.login);
    const applyTwin = (acc) => {
      if (!twin) return;
      if (twin.passwordHash) acc.passwordHash = twin.passwordHash; else delete acc.passwordHash;
      if (twin.totp) acc.totp = { ...twin.totp }; else delete acc.totp;
    };
    if (minister) {
      const loginChanged = minister.login !== values.login;
      Object.assign(minister, values);
      if (loginChanged) applyTwin(minister);
      if (fd.get('resetTotp') === 'on') linkedAccounts(minister).forEach((a) => { delete a.totp; });
      if (values.role !== 'minister') delete minister.post;
      if (values.role !== 'school') delete minister.director;
      if (!minister.photo) delete minister.photo;
      if (!minister.photoConsent) delete minister.photoConsent;
      if (fd.get('resetPassword') === 'on') linkedAccounts(minister).forEach((a) => { delete a.passwordHash; });
      logActivity('minister', `Оновлено акаунт: ${values.position} — ${values.name}${fd.get('resetPassword') === 'on' ? ' (пароль скинуто до стандартного)' : ''}`, minister.id);
      closeModal(modal);
      commit('Акаунт збережено');
    } else {
      const created = { id: uid('m'), ...values };
      applyTwin(created);
      if (!created.photo) delete created.photo;
      if (!created.photoConsent) delete created.photoConsent;
      state.ministers.push(created);
      logActivity('minister', `Створено акаунт: ${values.position} — ${values.name}`, created.id);
      closeModal(modal);
      commit('Акаунт створено');
    }
  });
}

async function deleteMinister(id) {
  if (!requireAdmin()) return;
  const minister = getMinister(id);
  if (!minister) return;
  if (!canManageAccount(minister)) {
    toast('Акаунти арт-менеджерів може видаляти лише арт-менеджер', 'error');
    return;
  }
  if (minister.id === currentUser().id) {
    toast('Не можна видалити власний обліковий запис', 'error');
    return;
  }
  if (isManager(minister) && managers().length <= 1) {
    toast('Це останній арт-менеджер — спершу створіть інший акаунт арт-менеджера', 'error');
    return;
  }
  const count = ministerTasks(id).length;
  const ok = await confirmDialog({
    title: isManager(minister) ? 'Видалити акаунт арт-менеджера?' : 'Видалити посаду?',
    text: `<b>${esc(minister.position)} — ${esc(minister.name)}</b> буде видалено${isManager(minister) ? '' : ' з кабінету'}, а логін <b>${esc(minister.login)}</b> перестане працювати.${count
      ? ` ${count} ${plural(count, 'завдання залишиться', 'завдання залишаться', 'завдань залишаться')} без відповідального — їх можна буде перепризначити.`
      : ''}`,
    confirmLabel: 'Видалити',
  });
  if (!ok) return;
  if (CLOUD) { cloudDeleteAccount(minister); return; }
  state.ministers = state.ministers.filter((m) => m.id !== id);
  state.tasks.forEach((t) => { if (t.ministerId === id) t.ministerId = null; });
  state.drafts = state.drafts.filter((d) => d.ownerId !== id);
  state.plans = state.plans.filter((x) => x.ownerId !== id);
  state.reports = state.reports.filter((x) => x.ownerId !== id);
  state.tasks.forEach((t) => { if (t.helpers) t.helpers = t.helpers.filter((h) => h !== id); });
  pruneNotifications();
  logActivity('delete', `З кабінету видалено посаду «${minister.position}»`, id);
  if (location.hash === `#${ministerRoute(id)}`) {
    saveState();
    navigate('ministers');
    toast('Посаду видалено');
    return;
  }
  commit('Посаду видалено');
}

function csvCell(value) {
  let s = String(value ?? '');
  if (/^[=+\-@]/.test(s)) s = `'${s}`; // захист від виконання формул у таблицях
  return /[;"\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

async function exportCSV() {
  const tasks = visibleTasks();
  if (!tasks.length) {
    toast('Немає завдань для звіту', 'info');
    return;
  }
  const header = ['Посада', 'Відповідальний', 'Що плануємо', 'Коли', 'План організації', 'Статус', 'Погодження', 'Нова ініціатива', 'Допомагають', 'Посилання на Google Docs (ТЗ)', 'Файл ТЗ (PDF)', 'Демо-запис'];
  const rows = sortTasks(tasks).map((t) => {
    const m = getAssignee(t.ministerId);
    return [
      m ? m.position : 'Не призначено',
      m ? m.name : '',
      t.title,
      formatNumeric(t.date),
      t.plan,
      STATUSES[effectiveStatus(t)].label,
      t.approval ? APPROVAL_STATUS[t.approval.status].label : '',
      t.initiative ? 'так' : '',
      (t.helpers || []).map(getMinister).filter(Boolean).map((h) => h.position).join(', '),
      t.docLink,
      t.attachment ? t.attachment.name : '',
      t.demo ? 'так' : 'ні',
    ];
  });
  const csv = [header, ...rows].map((r) => r.map(csvCell).join(';')).join('\r\n');
  const suffix = isCabinetView() ? 'kabinet' : currentUser().login.split('@')[0];
  if (await download(`student-government-${suffix}-${todayISO()}.csv`, `\uFEFF${csv}`, 'text/csv;charset=utf-8')) {
    toast('Звіт CSV збережено');
  }
}

async function importJSON(file) {
  if (CLOUD || !requireAdmin()) return;
  if (file.size > 5 * 1024 * 1024) {
    toast('Файл завеликий (максимум 5 МБ)', 'error');
    return;
  }
  let parsed = null;
  try {
    parsed = normalizeState(JSON.parse(await file.text()));
  } catch {
    parsed = null;
  }
  if (!parsed) {
    toast('Не вдалося прочитати файл. Оберіть JSON, експортований із цього застосунку.', 'error');
    return;
  }
  const ok = await confirmDialog({
    title: 'Імпортувати дані?',
    text: `У файлі <b>${esc(file.name)}</b>: ${parsed.tasks.length} ${plural(parsed.tasks.length, 'завдання', 'завдання', 'завдань')} і ${parsed.ministers.length} ${plural(parsed.ministers.length, 'посада', 'посади', 'посад')}. Поточні дані буде замінено.`,
    confirmLabel: 'Імпортувати',
    danger: false,
  });
  if (!ok) return;
  state = parsed;

/* ---------- Двофакторна автентифікація (TOTP, RFC 6238) ---------- */

const TOTP_ISSUER = 'STUDENT GOVERNMENT';
const TOTP_STEP = 30;            // секунд на один код
const TOTP_DIGITS = 6;
const OTP_PENDING_MS = 5 * 60 * 1000; // на введення коду після пароля — 5 хв
const QR_URL = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
SRI[QR_URL] = 'sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k';

/** Усі посади, на які входять одним логіном (одна людина — кілька посад). */
const linkedAccounts = (account) => (account ? state.ministers.filter((m) => m.login === account.login) : []);

function sha1Bytes(bytes) {
  const ml = bytes.length;
  const total = ((ml + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total);
  buf.set(bytes);
  buf[ml] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 4, (ml * 8) >>> 0);
  dv.setUint32(total - 8, Math.floor((ml * 8) / 4294967296));
  let h0 = 0x67452301; let h1 = 0xEFCDAB89; let h2 = 0x98BADCFE; let h3 = 0x10325476; let h4 = 0xC3D2E1F0;
  const w = new Uint32Array(80);
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i += 1) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 80; i += 1) {
      const x = w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16];
      w[i] = (x << 1) | (x >>> 31);
    }
    let a = h0; let b = h1; let c = h2; let d = h3; let e = h4;
    for (let i = 0; i < 80; i += 1) {
      let f; let k;
      if (i < 20) { f = (b & c) | (~b & d); k = 0x5A827999; } else if (i < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; } else if (i < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; } else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const t = ((((a << 5) | (a >>> 27)) >>> 0) + (f >>> 0) + e + k + w[i]) >>> 0;
      e = d; d = c; c = ((b << 30) | (b >>> 2)) >>> 0; b = a; a = t;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  const out = new Uint8Array(20);
  const odv = new DataView(out.buffer);
  [h0, h1, h2, h3, h4].forEach((v, i) => odv.setUint32(i * 4, v));
  return out;
}

function hmacSha1(key, message) {
  const k = new Uint8Array(64);
  k.set(key.length > 64 ? sha1Bytes(key) : key);
  const join = (a, b) => { const r = new Uint8Array(a.length + b.length); r.set(a); r.set(b, a.length); return r; };
  const inner = sha1Bytes(join(k.map((x) => x ^ 0x36), message));
  return sha1Bytes(join(k.map((x) => x ^ 0x5c), inner));
}

const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Encode(bytes) {
  let bits = 0; let value = 0; let out = '';
  bytes.forEach((byte) => {
    value = (value << 8) | byte; bits += 8;
    while (bits >= 5) { out += B32[(value >>> (bits - 5)) & 31]; bits -= 5; }
  });
  if (bits > 0) out += B32[(value << (5 - bits)) & 31];
  return out;
}
function base32Decode(text) {
  let bits = 0; let value = 0; const out = [];
  text.replace(/=+$/, '').toUpperCase().split('').forEach((ch) => {
    const idx = B32.indexOf(ch);
    if (idx < 0) return;
    value = (value << 5) | idx; bits += 5;
    if (bits >= 8) { out.push((value >>> (bits - 8)) & 255); bits -= 8; }
  });
  return new Uint8Array(out);
}

function totpCode(secret, step) {
  const msg = new Uint8Array(8);
  const dv = new DataView(msg.buffer);
  dv.setUint32(0, Math.floor(step / 4294967296));
  dv.setUint32(4, step >>> 0);
  const h = hmacSha1(base32Decode(secret), msg);
  const off = h[19] & 15;
  const bin = ((h[off] & 127) << 24) | (h[off + 1] << 16) | (h[off + 2] << 8) | h[off + 3];
  return String(bin % 10 ** TOTP_DIGITS).padStart(TOTP_DIGITS, '0');
}

/** Повертає крок часу, якщо код правильний (±1 крок на розбіжність годинників), інакше null. Повтор коду не приймається. */
function checkTotp(totp, code) {
  const clean = String(code || '').replace(/\D/g, '');
  if (!totp || clean.length !== TOTP_DIGITS) return null;
  const now = Math.floor(Date.now() / 1000 / TOTP_STEP);
  for (const step of [now, now - 1, now + 1]) {
    if (step > (totp.lastStep || 0) && safeEqual(totpCode(totp.secret, step), clean)) return step;
  }
  return null;
}

function newTotpSecret() {
  return base32Encode(crypto.getRandomValues(new Uint8Array(20)));
}

const otpauthUri = (account, secret) => `otpauth://totp/${encodeURIComponent(`${TOTP_ISSUER}:${account.login}`)}?secret=${secret}&issuer=${encodeURIComponent(TOTP_ISSUER)}&algorithm=SHA1&digits=${TOTP_DIGITS}&period=${TOTP_STEP}`;

let qrPromise = null;
function loadQr() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (!qrPromise) qrPromise = loadScript(QR_URL).then(() => window.qrcode).catch((err) => { qrPromise = null; throw err; });
  return qrPromise;
}

const groupSecret = (s) => s.replace(/(.{4})/g, '$1 ').trim();

/** Підключення 2FA: QR-код → застосунок-автентифікатор → підтвердження кодом. */
function openTwoFaSetup() {
  const user = currentUser();
  if (!user || user.totp) return;
  const secret = newTotpSecret();
  const uri = otpauthUri(user, secret);
  const body = `
    <ol class="twofa-steps">
      <li><b>Встановіть застосунок-автентифікатор</b><span>Google Authenticator, Microsoft Authenticator або 2FAS — безкоштовно в App Store і Google Play.</span></li>
      <li><b>Скануйте QR-код</b><span>У застосунку: «+» → «Сканувати QR-код».</span>
        <div class="twofa-qr" data-role="qr"><div class="pdf-loading">${icon('loader')}<span>Готую QR-код…</span></div></div>
        <p class="twofa-secret">Не сканується? Введіть ключ вручну: <code>${groupSecret(secret)}</code></p>
      </li>
      <li><b>Введіть 6-значний код із застосунку</b>
        <form class="form" id="twofa-setup-form" novalidate>
          <div class="field" data-field="code">
            <input class="input otp-input" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" aria-label="Код із застосунку" required>
            <p class="field__error"></p>
          </div>
          <div class="modal__footer">
            <button type="button" class="btn btn--ghost" data-action="close-modal">Скасувати</button>
            <button type="submit" class="btn btn--gold">${icon('shield-check')}<span>Увімкнути 2FA</span></button>
          </div>
        </form>
      </li>
    </ol>`;
  const modal = openModal({ title: 'Двофакторна автентифікація', iconName: 'smartphone', body });
  loadQr().then((qrcode) => {
    const qr = qrcode(0, 'M');
    qr.addData(uri);
    qr.make();
    $('[data-role="qr"]', modal).innerHTML = qr.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
  }).catch(() => {
    $('[data-role="qr"]', modal).innerHTML = `<p class="muted">QR-код не завантажився (немає інтернету). Введіть ключ нижче вручну.</p>`;
  });
  const form = $('#twofa-setup-form', modal);
  form.elements.code.focus();
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const step = checkTotp({ secret, lastStep: 0 }, form.elements.code.value);
    if (step === null) {
      setFieldErrors(form, { code: 'Код не підходить. Перевірте, що час на телефоні встановлено автоматично, і введіть свіжий код.' });
      return;
    }
    const totp = { secret, enabledAt: Date.now(), lastStep: step };
    linkedAccounts(user).forEach((a) => { a.totp = { ...totp }; });
    logActivity('minister', 'Увімкнено двофакторну автентифікацію', user.id);
    closeModal(modal);
    commit('2FA увімкнено. Під час входу вводьте код із застосунку.');
  });
}

function verifyOtpLogin(form) {
  const p = pendingLogin;
  if (!p || Date.now() > p.until) {
    pendingLogin = null;
    renderAuth(p ? p.login : '');
    showLoginError('Час на введення коду вичерпано — увійдіть ще раз');
    return;
  }
  const wait = lockRemaining(p.login);
  if (wait > 0) {
    showLoginError(`Забагато невдалих спроб. Спробуйте через ${formatWait(wait)}.`);
    return;
  }
  const accounts = p.ids.map(getMinister).filter(Boolean);
  const step = accounts.length ? checkTotp(accounts[0].totp, form.elements.code.value) : null;
  if (step === null) {
    registerFailure(p.login);
    const locked = lockRemaining(p.login);
    if (locked > 0) {
      pendingLogin = null;
      renderAuth(p.login);
      showLoginError(`Забагато невдалих спроб. Вхід заблоковано на ${formatWait(locked)}.`);
      return;
    }
    showLoginError('Невірний код. Введіть свіжий код із застосунку.');
    form.elements.code.value = '';
    form.elements.code.focus();
    return;
  }
  clearFailures(p.login);
  accounts.forEach((a) => { if (a.totp) a.totp.lastStep = step; }); // код не можна використати двічі
  saveState(true);
  finishLogin(accounts, p.remember);
}

function renderPostPicker(accounts, remember) {
  pendingLogin = { ids: accounts.map((a) => a.id), login: accounts[0].login, remember, until: Date.now() + OTP_PENDING_MS, verified: true };
  authShell(`
    <h1 class="auth__title">Оберіть посаду</h1>

}

function pickPost(id) {
  const p = pendingLogin;
  if (!p || !p.verified || Date.now() > p.until || !p.ids.includes(id)) {
    renderAuth(p ? p.login : '');
    return;
  }
  finishLogin([getMinister(id)].filter(Boolean), p.remember);
}

function switchPost(id) {
  const user = currentUser();
  const target = getMinister(id);
  if (!user || !target || target.login !== user.login || target.id === user.id) return;
  closeAllModals();
  saveSession(target.id, session.remember);
  resetViewState();
  history.replaceState(null, '', '#dashboard');
  render();
  toast(`Посада: ${target.position}`, 'info');
}

const routeId = (id) => String(id).replace(/[^A-Za-z0-9]/g, '-');
const ministerRoute = (id) => `minister-${routeId(id)}`;

function parseRoute() {
  let raw = location.hash.replace(/^#\/?/, '');
  if (raw.startsWith('minister/')) raw = `minister-${routeId(decodeURIComponent(raw.slice(9)))}`; // старі посилання
  if (raw === 'settings') raw = 'account';
  if (raw.startsWith('minister-')) return { name: 'minister', param: raw.slice(9) };
  return { name: PAGES[raw] ? raw : 'dashboard', param: null };
}

function navigate(path) {
  if (location.hash === `#${path}`) render();
  else location.hash = path;
}

function refreshIcons() {
  if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.85 } });
}

function animateRings(animate) {
  $$('.ring__value[data-offset]').forEach((circle) => {
    const target = circle.dataset.offset;
    if (!animate) {
      circle.style.transition = 'none';
      circle.style.strokeDashoffset = target;
      return;
    }
    requestAnimationFrame(() => requestAnimationFrame(() => { circle.style.strokeDashoffset = target; }));
  });
}

function updateChrome(route) {
  const active = route === 'minister' ? 'ministers' : route;
  $$('.nav__link').forEach((link) => {
    const on = link.dataset.route === active;
    link.classList.toggle('is-active', on);
    if (on) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });

  const wishBadge = $('#nav-wishes');
  const freshWishes = voice.ideas ? voice.ideas.filter((i) => i.moderation === 'Нова' || i.moderation === 'Потребує модерації').length : 0;
  wishBadge.hidden = !freshWishes;
  wishBadge.textContent = freshWishes;
  wishBadge.title = `Нових ідей: ${freshWishes}`;

  const approvalCount = pendingApprovals().length;
  const approvalBadge = $('#nav-approvals');
  approvalBadge.hidden = !approvalCount;
  approvalBadge.textContent = approvalCount;
  approvalBadge.title = `Чекають погодження: ${approvalCount}`;

  const reportCount = pendingReviews().length + myObligations();
  const reportBadge = $('#nav-reports');
  reportBadge.hidden = !reportCount;
  reportBadge.textContent = reportCount;
  reportBadge.title = `Потребують дії: ${reportCount}`;

  const draftCount = myDrafts().length;
  const draftBadge = $('#nav-drafts');
  draftBadge.hidden = !draftCount;
  draftBadge.textContent = draftCount;

  const unread = unreadCount();
  const notifBadge = $('#nav-notif');
  notifBadge.hidden = !unread;
  notifBadge.textContent = unread;
  $('#mobile-notif').hidden = !unread;

  const overdue = visibleTasks().filter((t) => effectiveStatus(t) === 'overdue').length;
  const badge = $('#nav-overdue');
  badge.hidden = !overdue;
  badge.textContent = overdue;
  badge.title = `Прострочено: ${overdue}`;

  const user = currentUser();
  const cabinet = isCabinetView();
  $('.nav__link[data-route="ministers"]').hidden = !can('see-ministers');
  $('.nav__link[data-route="ministry"]').hidden = isStaff(user);
  $('.nav__link[data-route="tasks"] span').textContent = cabinet ? 'Завдання' : 'Мої завдання';
  $('.nav__link[data-route="analytics"] span').textContent = cabinet ? 'Аналітика' : 'Моя аналітика';

  const switcher = $('#scope-switch');
  const showSwitch = isPresident(user) || isPremier(user);
  switcher.hidden = !showSwitch;
  switcher.innerHTML = showSwitch ? `
    <p class="nav__label">Режим перегляду</p>
    <div class="segmented segmented--block" role="group" aria-label="Режим перегляду">
      <button type="button" class="segmented__btn ${cabinet ? '' : 'is-active'}" data-action="set-scope" data-scope="own" aria-pressed="${!cabinet}">${icon('user')}<span>Мій простір</span></button>
      <button type="button" class="segmented__btn ${cabinet ? 'is-active' : ''}" data-action="set-scope" data-scope="cabinet" aria-pressed="${cabinet}">${icon('landmark')}<span>Кабінет</span></button>
    </div>` : '';

  const posts = linkedAccounts(user);
  const postSwitch = $('#post-switch');
  postSwitch.hidden = posts.length < 2;
  postSwitch.innerHTML = posts.length > 1 ? `
    <p class="nav__label">Моя посада</p>
    <div class="post-switch">
      ${posts.map((m) => `<button type="button" class="post-switch__btn ${m.id === user.id ? 'is-active' : ''}" data-action="switch-post" data-id="${m.id}" aria-pressed="${m.id === user.id}">${avatar(m, 'xs')}<span>${esc(m.position)}</span></button>`).join('')}
    </div>` : '';

  $('#user-card').innerHTML = `
    ${avatar(user, 'md')}
    <span class="user-card__text">
      <span class="user-card__name">${esc(user.name)}</span>
      <span class="user-card__role">${esc(user.position)}</span>
    </span>`;

  let title = PAGE_TITLES[active] || 'Головна';
  if (route === 'minister') {
    const m = getMinister(ui.param);
    if (m) title = m.position;
  }
  document.title = `${title} · Student Government`;
}

function closeSidebar() {
  document.body.classList.remove('sidebar-open');
}

function render() {
  if (CLOUD) {
    if (cloud.phase !== 'ready') { cloudRenderGate(); return; }
    if (!currentUser()) {
      const mine = cloudMyAccounts();
      if (mine.length !== 1) { cloud.phase = 'pick'; cloudRenderGate(); return; }
      saveSession(mine[0].id, cloudStorage.target() === localStorage);
    }
  }
  if (!currentUser()) {
    if (session) { clearSession(); session = null; }
    renderAuth();
    return;
  }
  if (state.settings.require2fa && !currentUser().totp) {
    closeAllModals();
    renderTwoFaGate(currentUser());
    return;
  }
  $('#auth').hidden = true;
  $('#app').hidden = false;

  let { name, param } = parseRoute();
  // Склад самоврядування та профілі посад — для керівництва й адміністрації школи
  if ((name === 'ministers' || name === 'minister') && !can('see-ministers')) {
    history.replaceState(null, '', '#dashboard');
    name = 'dashboard';
    param = null;
  }
  const routeKey = `${name}/${param || ''}`;
  const routeChanged = routeKey !== ui.lastRoute;
  ui.lastRoute = routeKey;
  ui.param = param;
  ui.today = todayISO();

  destroyCharts();
  closeStatusMenu();

  const view = $('#view');
  view.innerHTML = PAGES[name](param);

  if (routeChanged) {
    view.classList.remove('is-entering');
    void view.offsetWidth; // перезапуск анімації переходу
    view.classList.add('is-entering');
    window.scrollTo(0, 0);
    closeSidebar();
  }

  if (AFTER_RENDER[name]) AFTER_RENDER[name]();
  refreshOpenModals();
  updateChrome(name);
  refreshIcons();
  animateRings(routeChanged);
}

/* Делегування кліків для всіх кнопок з data-action */
document.addEventListener('click', (e) => {
  if (statusMenu && !e.target.closest('.popover') && !e.target.closest('[data-action="status-menu"]')) closeStatusMenu();

  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const { action, id } = el.dataset;

  switch (action) {
    case 'open-link':
      return; // браузер сам відкриє посилання
    case 'open-sidebar':
      document.body.classList.add('sidebar-open');
      break;
    case 'close-sidebar':
      closeSidebar();
      break;
    case 'new-task':
      openTaskForm(null, { date: el.dataset.date, ministerId: el.dataset.minister });
      break;
    case 'view-task':
      openTaskView(id);
      break;
    case 'edit-task': {
      const inModal = el.closest('.modal-overlay');
      if (inModal) closeModal(inModal);
      openTaskForm(id);
      break;
    }
    case 'delete-task':
      deleteTask(id);
      break;
    case 'toggle-done':
      toggleDone(id);
      break;
    case 'status-menu':
      if (statusMenu && statusMenu.anchor === el) closeStatusMenu();
      else openStatusMenu(el, id);
      break;
    case 'set-status':
      setTaskStatus(id, el.dataset.status);
      break;
    case 'set-scope':
      if (!(isPresident(currentUser()) || isPremier(currentUser()))) break;
      setUserPref('scope', el.dataset.scope === 'cabinet' ? 'cabinet' : 'own');
      ui.filterMinister = 'all';
      closeSidebar();
      render();
      toast(isCabinetView() ? 'Режим: увесь кабінет' : 'Режим: мій простір', 'info');
      break;
    case 'set-view':
      setUserPref('view', el.dataset.view === 'cards' ? 'cards' : 'table');
      $$('.segmented__btn[data-view]').forEach((b) => {
        const on = b.dataset.view === currentView();
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-pressed', String(on));
      });
      renderTaskResults();
      break;
    case 'reset-filters':
      ui.search = '';
      ui.filterMinister = 'all';
      ui.filterStatus = 'all';
      render();
      break;
    case 'goto-tasks':
      if (el.dataset.minister && can('see-cabinet') && !isStaff(currentUser()) && el.dataset.minister !== currentUser().id) setUserPref('scope', 'cabinet');
      ui.search = '';
      ui.filterStatus = el.dataset.status || 'all';
      ui.filterMinister = el.dataset.minister || 'all';
      navigate('tasks');
      break;
    case 'goto-minister':
      e.preventDefault();
      closeAllModals();
      navigate(ministerRoute(id));
      break;
    case 'cal-prev':
    case 'cal-next': {
      const step = action === 'cal-prev' ? -1 : 1;
      ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth() + step, 1);
      const now = new Date();
      ui.calSelected = ui.calMonth.getFullYear() === now.getFullYear() && ui.calMonth.getMonth() === now.getMonth()
        ? todayISO()
        : toISO(ui.calMonth);
      render();
      break;
    }
    case 'cal-today':
      ui.calMonth = startOfMonth(new Date());
      ui.calSelected = todayISO();
      render();
      break;
    case 'cal-day': {
      const date = parseISO(el.dataset.date);
      ui.calSelected = el.dataset.date;
      if (date.getMonth() !== ui.calMonth.getMonth() || date.getFullYear() !== ui.calMonth.getFullYear()) {
        ui.calMonth = startOfMonth(date);
      }
      render();
      break;
    }
    case 'open-minister':
      navigate(ministerRoute(id));
      break;
    case 'new-minister':
      openMinisterForm();
      break;
    case 'edit-minister':
      openMinisterForm(id);
      break;
    case 'delete-minister':
      deleteMinister(id);
      break;
    case 'export-json':
      exportJSON();
      break;
    case 'import-json':
      $('#import-input').click();
      break;
    case 'export-csv':
      exportCSV();
      break;
    case 'remove-demo':
      removeDemo();
      break;
    case 'reset-demo':
      resetDemo();
      break;
    case 'clear-tasks':
      clearTasks();
      break;
    case 'dismiss-banner':
      state.demoBannerHidden = true;
      commit();
      break;
    case 'close-modal':
      closeModal(el.closest('.modal-overlay'));
      break;
    case 'logout':
      logout();
      break;
    case 'voice-change-url':
      if (!requireAdmin()) break;
      state.settings.voiceUrl = '';
      clearVoiceToken();
      commit();
      break;
    case 'voice-refresh':
      loadWishes(true);
      break;
    case 'voice-disconnect':
      voiceLogout();
      break;
    case 'view-wish':
      openWish(id);
      break;
    case 'voice-filter-reset':
      Object.assign(voice, { search: '', fMod: 'all', fReview: 'all', fCat: 'all' });
      render();
      break;
    case 'new-draft':
      openDraftForm();
      break;
    case 'edit-draft':
      openDraftForm(id);
      break;
    case 'delete-draft':
      deleteDraft(id);
      break;
    case 'draft-to-task':
      draftToTask(id);
      break;
    case 'quick-login':
      quickLogin(id);
      break;
    case 'cloud-pick':
      cloudPick(id);
      break;
    case 'cloud-signout':
      cloudLogout('');
      break;
    case 'twofa-setup':
      openTwoFaSetup();
      break;
    case 'twofa-disable':
      openTwoFaDisable();
      break;
    case 'otp-back':
      renderAuth(pendingLogin ? pendingLogin.login : '');
      break;
    case 'pick-post':
      pickPost(id);
      break;
    case 'switch-post':
      switchPost(id);
      break;
    case 'view-tz-example':
      openPdfViewer(tzExample());
      break;
    case 'open-plan':
      openPlan(el.dataset.owner, el.dataset.period);
      break;
    case 'open-report':
      openReport(el.dataset.owner, el.dataset.month);
      break;
    case 'add-team-member':
      openTeamMemberForm(el.dataset.owner);
      break;
    case 'remove-team-member':
      removeTeamMember(el.dataset.owner, id);
      break;
    case 'decide-approval':
      decideApproval(id, el.dataset.decision);
      break;
    case 'new-initiative':
      if (isStaff(currentUser())) break;
      closeAllModals();
      openTaskForm(null, { initiative: true, ministerId: currentUser().id });
      break;
    case 'close-to-charter':
      closeAllModals();
      return;
    case 'open-notifications':
      closeSidebar();
      openNotifications();
      break;
    case 'view-pdf': {
      const t = getTask(id);
      if (t && t.attachment) openPdfViewer(t.attachment);
      break;
    }
    case 'change-photo': {
      if (!isManager(currentUser())) {
        toast('Фото на аватарку може додавати лише арт-менеджер', 'error');
        break;
      }
      const account = getMinister(id);
      if (!account) break;
      confirmDialog({
        title: 'Згода на фото',
        text: `Підтвердіть, що <b>${esc(account.name)}</b> погоджується на використання свого фото в системі (для неповнолітніх — також батьки). Фото бачать усі, хто має доступ до платформи.`,
        confirmLabel: 'Згода є — обрати фото',
        danger: false,
      }).then((ok) => {
        if (!ok) return;
        const input = $('#photo-input');
        input.dataset.target = id;
        input.click();
      });
      break;
    }
    case 'toggle-password': {
      const input = el.parentElement.querySelector('input');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      el.setAttribute('aria-label', show ? 'Приховати пароль' : 'Показати пароль');
      el.title = el.getAttribute('aria-label');
      el.innerHTML = icon(show ? 'eye-off' : 'eye');
      refreshIcons();
      input.focus();
      break;
    }
    default:
      break;
  }
});

/* Пошук і фільтри на сторінці завдань */
document.addEventListener('input', (e) => {
  if (e.target.dataset.voiceFilter === 'search') {
    voice.search = e.target.value;
    renderWishList();
    const input = $('[data-voice-filter="search"]');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    return;
  }
  if (e.target.dataset.filter === 'search') {
    ui.search = e.target.value;
    renderTaskResults();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.dataset.voiceFilter && e.target.dataset.voiceFilter !== 'search') {
    voice[e.target.dataset.voiceFilter] = e.target.value;
    renderWishList();
    return;
  }
  const { filter } = e.target.dataset;
  if (filter === 'minister') ui.filterMinister = e.target.value;
  else if (filter === 'status') ui.filterStatus = e.target.value;
  else if (filter === 'sort') ui.sort = e.target.value;
  else return;
  renderTaskResults();
});

/* Форми входу та налаштувань */
document.addEventListener('submit', (e) => {
  if (e.target.id === 'login-form') {
    e.preventDefault();
    handleLogin(e.target);
    return;
  }
  if (e.target.id === 'cloud-login-form') {
    e.preventDefault();
    cloudHandleLogin(e.target);
    return;
  }
  if (e.target.id === 'cloud-otp-form') {
    e.preventDefault();
    cloudVerifyOtp(e.target);
    return;
  }
  if (e.target.id === 'otp-form') {
    e.preventDefault();
    verifyOtpLogin(e.target);
    return;
  }
  if (e.target.id === 'password-form') {
    e.preventDefault();
    changePassword(e.target);
    return;
  }
  if (e.target.id !== 'settings-form') return;
  e.preventDefault();
  if (!requireAdmin()) return;
  const form = e.target;
  const fd = new FormData(form);
  const cabinetName = String(fd.get('cabinetName') || '').trim();
  const errors = cabinetName ? {} : { cabinetName: 'Вкажіть назву кабінету' };
  setFieldErrors(form, errors);
  if (!cabinetName) return;
  const require2fa = fd.get('require2fa') === 'on';
  if (require2fa && !currentUser().totp) {
    setFieldErrors(form, { cabinetName: '' });
    toast('Спершу підключіть 2FA собі (картка «Двофакторна автентифікація»), потім увімкніть її для всіх', 'error');
    return;
  }
  state.settings = { ...state.settings, cabinetName, quickLogin: fd.get('quickLogin') === 'on', require2fa };
  commit('Налаштування збережено');
});

/* Клавіатура: Escape закриває, Enter/Пробіл активує рядки та картки */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (statusMenu) { closeStatusMenu(); return; }
    if (modalStack.length) { closeModal(); return; }
    if (document.body.classList.contains('sidebar-open')) closeSidebar();
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[tabindex="0"][data-action]')) {
    e.preventDefault();
    e.target.click();
  }
});

$('#photo-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  const { target } = e.target.dataset;
  e.target.value = '';
  if (file && target) setAccountPhoto(target, file);
});

$('#import-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (file) importJSON(file);
});

window.addEventListener('hashchange', render);
// запасний варіант, якщо живі оновлення (Realtime) недоступні: раз на 90 с підтягуємо зміни
setInterval(() => {
  if (CLOUD && cloud.phase === 'ready' && document.visibilityState === 'visible' && !modalStack.length && !cloud.draining && Date.now() - cloud.lastLoad > 85000) {
    cloud.lastLoad = Date.now();
    cloudReloadTables(Object.values(CLOUD_TABLE));
  }
}, 90000);
document.addEventListener('visibilitychange', () => {
  if (CLOUD && document.visibilityState === 'visible' && cloud.phase === 'ready' && Date.now() - cloud.lastLoad > 60000) {
    cloud.lastLoad = Date.now();
    cloudReloadTables(Object.values(CLOUD_TABLE));
  }
});
window.addEventListener('resize', positionStatusMenu);
window.addEventListener('scroll', positionStatusMenu, { passive: true, capture: true });

/* Синхронізація між вкладками браузера */
window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY) {
    if (CLOUD) return;
    state = loadState();
    render();
  } else if (e.key === SESSION_KEY) {
    session = loadSession();
    render();
  }
});

/* Тайм-аут сесії: без «Запамʼятати мене» — вихід після 30 хв бездіяльності */
setInterval(() => {
  if (CLOUD) {
    if (cloud.phase === 'ready' && session && !session.remember && Date.now() - lastActivity > SESSION_IDLE_MS) cloudLogout('Сесію завершено через 30 хв бездіяльності. Увійдіть знову.');
    return;
  }
  if (session && !session.remember && currentUser() && Date.now() - lastActivity > SESSION_IDLE_MS) {
    const user = currentUser();
    clearSession();
    session = null;
    renderAuth(user.login);
    toast('Сесію завершено через 30 хв бездіяльності. Увійдіть знову.', 'info');
  }
}, 30000);

/* Опівночі статуси «Прострочено» мають перерахуватися без перезавантаження */
setInterval(() => {
  if (ui.today !== todayISO() && !modalStack.length && currentUser()) render();
}, 60000);

function init() {
  if (CLOUD_BAD) {
    $('#app').hidden = true;
    $('#auth').hidden = false;
    authShell(`<h1 class="auth__title">Сайт ще не підключено до бази</h1>
      <p class="auth__sub">Відкрийте файл <b>config.js</b> поруч зі сторінкою і вставте <b>Project URL</b> та <b>anon / publishable key</b> зі свого проєкту Supabase (Project Settings → API).</p>`);
    return;
  }
  if (CLOUD) { cloudBoot(); return; }
  if (window.Chart) setChartDefaults();
  if (inArtifact()) getDownloadsApi(); // підготувати збереження файлів заздалегідь
  saveState(true); // зберегти початкові демо-дані або результат міграції зі старішої версії
  if (!location.hash) history.replaceState(null, '', '#dashboard');
  render();
  if (currentUser() && voiceToken() && voiceReachable()) loadWishes(false);
}

/* Оновлення «Бажань учнів» раз на хвилину, поки розділ відкритий */
setInterval(() => {
  if (currentUser() && parseRoute().name === 'wishes' && voiceToken() && !modalStack.length && document.visibilityState === 'visible') loadWishes(false);
}, 60000);

init();

  </script>
