.team-item__text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.team-item__text b { font-size: 14px; }
.team-item__text small { font-size: 12.5px; color: var(--text-3); }
.card__foot { margin-top: 14px; }

/* Плани і звіти */
.chip-btn { padding: 0; border: 0; background: none; cursor: pointer; font: inherit; }
.chip-btn:hover .badge { filter: brightness(1.15); }
.chip-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.compliance-table td { vertical-align: middle; }
.compliance-table a { color: inherit; text-decoration: none; }
.doc-owner { margin: 4px 0 14px; }
.mini-task-list { display: flex; flex-direction: column; gap: 8px; margin: 0 0 6px; padding: 0; list-style: none; }
.mini-task-list li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; }
.mini-task-list small { margin-left: auto; color: var(--text-3); }
.mini-task-list .link-btn { text-align: left; }
.review-form { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-soft); }
.modal__body .detail__label { margin-top: 16px; }

/* Погодження */
.approval-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.approval-card { display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--c-progress); }
.approval-card.is-approved { border-top-color: var(--c-done); }
.approval-card.is-returned { border-top-color: var(--c-overdue); }
.approval-card__head { display: flex; align-items: center; gap: 6px; }
.approval-card__date { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; font-size: 12.5px; color: var(--text-3); }
.approval-card__date svg { width: 14px; height: 14px; }
.approval-card__title { margin: 0; font-size: 16px; line-height: 1.3; }
.approval-card__title .link-btn { font-size: inherit; font-weight: 800; color: var(--text); text-align: left; }
.approval-card__plan { margin: 0; font-size: 13px; color: var(--text-2); white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.approval-card__meta { margin: 0; font-size: 12px; color: var(--text-3); }
.approval-card .btn-row { margin-top: auto; justify-content: flex-end; flex-wrap: wrap; }

.approval-callout {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin: 14px 0;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid rgba(110, 168, 230, 0.38);
  background: rgba(110, 168, 230, 0.08);
}
.approval-callout.is-approved { border-color: rgba(92, 197, 150, 0.38); background: rgba(92, 197, 150, 0.07); }
.approval-callout.is-returned { border-color: rgba(239, 107, 107, 0.4); background: rgba(239, 107, 107, 0.07); }
.approval-callout__icon { width: 38px; height: 38px; flex-shrink: 0; display: grid; place-items: center; border-radius: 10px; color: var(--c-progress); background: rgba(110, 168, 230, 0.16); }
.approval-callout.is-approved .approval-callout__icon { color: var(--c-done); background: rgba(92, 197, 150, 0.16); }
.approval-callout.is-returned .approval-callout__icon { color: var(--c-overdue); background: rgba(239, 107, 107, 0.16); }
.approval-callout__text { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--text-2); }
.approval-callout__text b { font-size: 14px; color: var(--text); }
.approval-callout__comment { display: flex; gap: 6px; margin-top: 4px; color: var(--text); }
.approval-callout__comment svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 3px; color: var(--text-3); }

.helper-chips { display: flex; flex-wrap: wrap; gap: 8px 16px; }

/* Поля статуту у формі завдання */
.charter-fields { display: flex; flex-direction: column; gap: 10px; }
.charter-fields .switch-row__text b { display: inline-flex; align-items: center; gap: 6px; }
.charter-fields .switch-row__text b svg { width: 15px; height: 15px; color: var(--gold); }
.charter-fields .field { gap: 0; }
.helpers-field { margin: 0; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: rgba(13, 22, 36, 0.45); min-width: 0; }
.helpers-field legend { display: inline-flex; align-items: center; gap: 6px; padding: 0 4px; }
.helpers-field legend svg { width: 15px; height: 15px; color: var(--gold); }
.helper-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; margin-top: 6px; }
.helper-pick { position: relative; display: block; cursor: pointer; }
.helper-pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.helper-pick > span { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border-soft); font-size: 13px; color: var(--text-2); transition: border-color 0.2s, background 0.2s; }
.helper-pick > span > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.helper-pick input:checked + span { border-color: rgba(92, 197, 150, 0.55); background: rgba(92, 197, 150, 0.1); color: var(--text); }
.helper-pick input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Статут */
.charter-purpose { display: flex; align-items: center; gap: 16px; border-color: var(--gold-line); background: linear-gradient(135deg, rgba(214, 182, 110, 0.1), rgba(23, 40, 61, 0.9)); }
.charter-purpose p { margin: 0; font-size: 15.5px; line-height: 1.6; color: var(--text); }
.charter-purpose__icon { width: 48px; height: 48px; flex-shrink: 0; display: grid; place-items: center; border-radius: 14px; color: var(--gold); background: var(--gold-soft); }
.charter-purpose__icon svg { width: 24px; height: 24px; }
.duty-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.duty-card { border-top: 3px solid var(--c, var(--gold)); }
.duty-card__head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.duty-card__head > span:last-child { min-width: 0; display: flex; flex-direction: column; }
.duty-card__head b { font-size: 14.5px; line-height: 1.3; }
.duty-card__head small { font-size: 12.5px; color: var(--text-3); }
.duty-card__num { width: 26px; height: 26px; flex-shrink: 0; display: grid; place-items: center; border-radius: 8px; font-size: 12px; font-weight: 800; color: var(--gold-ink); background: var(--gold); }
.rule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.rule-card { display: flex; gap: 14px; }
.rule-card__icon { width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center; border-radius: 12px; color: var(--gold); background: var(--gold-soft); }
.rule-card__icon svg { width: 19px; height: 19px; }
.rule-card__title { margin: 0 0 4px; font-size: 15px; }
.rule-card__text { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--text-2); }
.rule-card__how { display: flex; gap: 6px; margin: 10px 0 0; padding-top: 10px; border-top: 1px dashed var(--border-soft); font-size: 12.5px; line-height: 1.45; color: var(--text-3); }
.rule-card__how svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; color: var(--c-done); }
.rights-table th:first-child { width: 30%; }
.rights-table th { white-space: normal; }
.rights-table td { vertical-align: middle; font-size: 13px; }
.rights-yes, .rights-no { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; }
.rights-yes { color: var(--c-done); background: rgba(92, 197, 150, 0.14); }
.rights-no { color: #52667F; }
.rights-yes svg, .rights-no svg { width: 14px; height: 14px; }
.rights-part { font-size: 12.5px; font-weight: 700; color: var(--gold-2); }

.minister-card--school { cursor: default; }
.minister-card--school:hover { transform: none; }
.quick-login__item.is-school { border-color: rgba(110, 168, 230, 0.35); }

@media (max-width: 1320px) {
  .charter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .charter-grid > :first-child { grid-column: 1 / -1; }
}
@media (max-width: 1024px) {
  .charter-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .charter-grid { grid-template-columns: minmax(0, 1fr); }
  .stats-grid--3 { grid-template-columns: minmax(0, 1fr); }
  .rights-table td { grid-template-columns: minmax(0, 1fr) auto; }
}
@media (max-width: 520px) {
  .charter-tiles { grid-template-columns: minmax(0, 1fr); }
  .charter-purpose { flex-direction: column; align-items: flex-start; }
  .duty-row__side { margin-left: 48px; }
  .approval-grid, .duty-grid, .rule-grid { grid-template-columns: minmax(0, 1fr); }
}

/* Посади однієї людини */
.post-switch { display: flex; flex-direction: column; gap: 4px; }
.post-switch__btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--text-2); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.post-switch__btn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.post-switch__btn:hover { background: rgba(255, 255, 255, 0.04); }
.post-switch__btn.is-active { border-color: var(--gold-line); background: var(--gold-soft); color: var(--text); font-weight: 700; }
.post-picker { margin-top: 18px; }

/* 2FA */
.twofa-steps { display: flex; flex-direction: column; gap: 18px; margin: 0; padding: 0 0 0 22px; }
.twofa-steps > li { padding-left: 4px; }
.twofa-steps > li::marker { font-weight: 800; color: var(--gold); }
.twofa-steps > li > b { display: block; font-size: 14.5px; }
.twofa-steps > li > span { display: block; font-size: 13px; color: var(--text-3); }
.twofa-qr { display: grid; place-items: center; width: 212px; min-height: 212px; margin: 12px 0 8px; padding: 10px; border-radius: 14px; background: #fff; }
.twofa-qr svg { width: 192px; height: 192px; display: block; }
.twofa-qr .muted, .twofa-qr .pdf-loading { color: #3A4A5E; text-align: center; font-size: 13px; }
.twofa-secret { margin: 0; font-size: 12.5px; color: var(--text-3); }
.twofa-secret code { display: inline-block; margin-top: 4px; padding: 3px 8px; border-radius: 6px; background: rgba(13, 22, 36, 0.7); color: var(--gold-2); font-size: 13px; letter-spacing: 0.06em; word-break: break-all; }
.otp-input { font-size: 22px; font-weight: 800; letter-spacing: 0.35em; text-align: center; font-variant-numeric: tabular-nums; }
.input-icon .otp-input { text-align: left; }
.twofa-steps .form { margin-top: 10px; }
.twofa-gate__actions { justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

/* Приклад ТЗ */
.tz-example { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-color: rgba(229, 143, 107, 0.38); }
.tz-example__icon { width: 46px; height: 46px; flex-shrink: 0; display: grid; place-items: center; border-radius: 12px; color: #FFB27A; background: rgba(229, 143, 107, 0.14); }
.tz-example__icon svg { width: 22px; height: 22px; }
.tz-example__text { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--text-2); }
.tz-example__text b { font-size: 15px; color: var(--text); }
.tz-example__meta { flex-basis: 100%; font-size: 12px; color: var(--text-3); }
.field__hint .link-btn { display: inline-flex; vertical-align: baseline; }

/* Робоча версія: QR 2FA і виданий пароль */
.twofa-qr img { width: 192px; height: 192px; display: block; }
.auth__card .twofa-qr { margin-left: auto; margin-right: auto; }
.auth__card .twofa-secret { text-align: center; margin-bottom: 14px; }
.issued { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; padding: 14px; border-radius: 14px; border: 1px solid var(--gold-line); background: var(--gold-soft); }
.issued__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.issued__row span { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }
.issued__row code { font-size: 16px; font-weight: 700; letter-spacing: 0.04em; color: var(--text); word-break: break-all; user-select: all; }

  </style>
</head>

  <script>
'use strict';

/* ==========================================================================
   STUDENT GOVERNMENT · Кабінет міністрів учнівського самоврядування
   --------------------------------------------------------------------------
   Vanilla JS SPA без сервера. Дані — у LocalStorage.
   Структура файлу:
     1. Константи                 9. Сторінка «Календар»
     2. Утиліти                  10. Сторінки «Міністри» та профіль міністра
     3. Дані: стан і сховище     11. Сторінка «Аналітика» (Chart.js)
     4. Вхід і права доступу     12. Сторінка «Налаштування»

/** Екранування тексту перед вставкою в HTML. */
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',

const pad = (n) => String(n).padStart(2, '0');

const capitalize = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);

function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);

function isValidISO(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d = parseISO(value);
  return !Number.isNaN(d.getTime()) && toISO(d) === value;
}

/** Різниця в днях між датою та сьогодні (від'ємна — у минулому). */
function diffDays(iso) {

}

function isSafeUrl(value) {

/** Українська множина: 1 день, 2 дні, 5 днів. */
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100;
  const b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b === 1) return one;
  if (b >= 2 && b <= 4) return few;

}

}

  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} год тому`;

  if (days === 1) return 'вчора';
  if (days < 7) return `${days} ${plural(days, 'день', 'дні', 'днів')} тому`;
  return formatDateTime(ts);
}

/** SHA-256 (hex). Власна реалізація — працює і з file://, де crypto.subtle може бути недоступний. */
function sha256Hex(message) {
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const primes = [];
  for (let n = 2; primes.length < 64; n += 1) {
    if (primes.every((p) => n % p !== 0)) primes.push(n);
  }
  const frac = (x) => Math.floor((x - Math.floor(x)) * 4294967296) >>> 0;
  const K = primes.map((p) => frac(Math.cbrt(p)));
  let H = primes.slice(0, 8).map((p) => frac(Math.sqrt(p)));

  const bytes = new TextEncoder().encode(message);
  const padded = new Uint8Array((((bytes.length + 9) + 63) >> 6) << 6);
  padded.set(bytes);
  padded[bytes.length] = 0x80;
  const view = new DataView(padded.buffer);
  const bitLength = bytes.length * 8;
  view.setUint32(padded.length - 8, Math.floor(bitLength / 4294967296));
  view.setUint32(padded.length - 4, bitLength >>> 0);

  const W = new Uint32Array(64);
  for (let offset = 0; offset < padded.length; offset += 64) {
    for (let i = 0; i < 16; i += 1) W[i] = view.getUint32(offset + i * 4);
    for (let i = 16; i < 64; i += 1) {
      const s0 = rotr(W[i - 15], 7) ^ rotr(W[i - 15], 18) ^ (W[i - 15] >>> 3);
      const s1 = rotr(W[i - 2], 17) ^ rotr(W[i - 2], 19) ^ (W[i - 2] >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i += 1) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H = H.map((v, i) => (v + [a, b, c, d, e, f, g, h][i]) >>> 0);
  }
  return H.map((v) => v.toString(16).padStart(8, '0')).join('');
}

/* ---------- Паролі: PBKDF2-SHA256 із сіллю (WebCrypto) ---------- */

const bytesToB64 = (bytes) => btoa(String.fromCharCode(...bytes));
const b64ToBytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const hasWebCrypto = () => Boolean(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);

/** Формати: `pbkdf2$<ітерації>$<сіль>$<хеш>` (поточний) або 64 hex-символи (старий SHA-256). */
function isValidPasswordRecord(value) {
  return typeof value === 'string'
    && (/^[0-9a-f]{64}$/.test(value) || /^pbkdf2\$\d{4,7}\$[A-Za-z0-9+/=]{16,64}\$[A-Za-z0-9+/=]{40,64}$/.test(value));
}

async function pbkdf2(password, salt, iterations) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations }, key, 256);
  return new Uint8Array(bits);
}

async function hashPassword(password) {
  if (!hasWebCrypto()) return sha256Hex(password); // дуже старий браузер — запасний варіант
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const hash = await pbkdf2(password, salt, PBKDF2_ITERATIONS);
  return `pbkdf2$${PBKDF2_ITERATIONS}$${bytesToB64(salt)}$${bytesToB64(hash)}`;
}

/** Порівняння без раннього виходу — однаковий час для правильних і неправильних паролів. */
function safeEqual(a, b) {
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i += 1) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return diff === 0;
}

async function verifyPassword(account, password) {
  const record = account.passwordHash;
  if (!record) return safeEqual(sha256Hex(password), DEFAULT_PASSWORD_HASH);
  if (record.startsWith('pbkdf2$')) {
    if (!hasWebCrypto()) return false;
    const [, iter, salt, hash] = record.split('$');
    const derived = await pbkdf2(password, b64ToBytes(salt), Number(iter));
    return safeEqual(bytesToB64(derived), hash);
  }
  return safeEqual(sha256Hex(password), record);
}

/** Перевірка нового пароля. Повертає текст помилки або ''. */
function passwordPolicyError(password, account) {
  if (password.length < PASSWORD_MIN) return `Щонайменше ${PASSWORD_MIN} символів — підійде фраза з кількох слів`;
  if (password.length > PASSWORD_MAX) return `Не більше ${PASSWORD_MAX} символів`;
  const lower = password.toLowerCase();
  if (COMMON_PASSWORDS.includes(lower) || safeEqual(sha256Hex(password), DEFAULT_PASSWORD_HASH)) return 'Цей пароль надто поширений — оберіть інший';
  const loginName = account.login.split('@')[0].toLowerCase();
  if (loginName.length >= 4 && lower.includes(loginName)) return 'Пароль не повинен містити ваш логін';
  if (/^(.)\1+$/.test(password)) return 'Пароль не може складатися з одного символу';
  return '';
}

/* ---------- Захист від підбору пароля: блокування зберігається між перезавантаженнями ---------- */

function readGuard() {
  try {
    const parsed = JSON.parse(readStorage(GUARD_KEY) || '{}');
    return { logins: parsed.logins || {}, global: Array.isArray(parsed.global) ? parsed.global : [] };
  } catch {
    return { logins: {}, global: [] };
  }
}

function writeGuard(guard) {
  try { localStorage.setItem(GUARD_KEY, JSON.stringify(guard)); } catch { /* не критично */ }
}

/** Скільки мілісекунд ще діє блокування для цього логіна (0 — можна пробувати). */
function lockRemaining(login) {
  const guard = readGuard();
  const now = Date.now();
  const entry = guard.logins[login];
  const recent = guard.global.filter((ts) => now - ts < GLOBAL_WINDOW_MS);
  const globalLock = recent.length >= GLOBAL_FAIL_LIMIT ? recent[recent.length - GLOBAL_FAIL_LIMIT] + GLOBAL_WINDOW_MS - now : 0;
  return Math.max(entry && entry.until ? entry.until - now : 0, globalLock, 0);
}

function registerFailure(login) {
  const guard = readGuard();
  const now = Date.now();
  const entry = guard.logins[login] || { fails: 0, locks: 0, until: 0 };
  entry.fails += 1;
  if (entry.fails >= MAX_LOGIN_ATTEMPTS) {
    entry.until = now + Math.min(LOCK_BASE_MS * 2 ** entry.locks, LOCK_MAX_MS);
    entry.locks += 1;
    entry.fails = 0;
  }
  guard.logins[login] = entry;
  guard.global = [...guard.global.filter((ts) => now - ts < GLOBAL_WINDOW_MS), now].slice(-50);
  writeGuard(guard);
}

function clearFailures(login) {
  const guard = readGuard();
  delete guard.logins[login];
  writeGuard(guard);
}

function formatWait(ms) {
  const sec = Math.ceil(ms / 1000);
  return sec < 60 ? `${sec} с` : `${Math.ceil(sec / 60)} хв`;
}

/* Завантаження файлів: в опублікованому артефакті — через можливість «downloads»,
   у звичайному браузері — через тимчасове посилання. */
const inArtifact = () => Boolean(window.claude && typeof window.claude.use === 'function');
let downloadsApi;

async function getDownloadsApi() {
  if (!inArtifact()) return null;
  if (downloadsApi === undefined) {
    try { downloadsApi = await window.claude.use('downloads'); } catch { downloadsApi = null; }
  }
  return downloadsApi;
}

/** Повертає true, якщо файл передано на збереження. */
async function download(filename, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
  if (inArtifact()) {
    const api = await getDownloadsApi();
    if (!api) {
      toast('Завантаження файлів недоступне в цьому перегляді', 'error');
      return false;
    }
    try {
      await api.save({ filename, data: blob });
      return true;
    } catch (err) {
      if (!err || err.code !== 'declined') toast('Не вдалося зберегти файл. Спробуйте ще раз.', 'error');
      return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}

/* Періоди: навчальна чверть і місяць звіту */
const QUARTER_NAMES = ['I', 'II', 'III', 'IV'];

function quarterOf(date = new Date()) {
  const y = date.getFullYear();
  const m = date.getMonth();
  const sy = m >= 8 ? y : y - 1; // навчальний рік починається у вересні
  let q = 4;
  if (m === 8 || m === 9) q = 1;
  else if (m >= 10) q = 2;
  else if (m <= 2) q = 3;
  const ranges = {
    1: [`${sy}-09-01`, `${sy}-10-31`],
    2: [`${sy}-11-01`, `${sy}-12-31`],
    3: [`${sy + 1}-01-01`, `${sy + 1}-03-31`],
    4: [`${sy + 1}-04-01`, `${sy + 1}-08-31`],
  };
  return { key: `${sy}-q${q}`, q, sy, label: `${QUARTER_NAMES[q - 1]} чверть ${sy}/${String(sy + 1).slice(2)}`, start: ranges[q][0], end: ranges[q][1] };
}

function quarterByKey(key) {
  const match = /^(\d{4})-q([1-4])$/.exec(key || '');
  if (!match) return quarterOf();
  const sy = Number(match[1]);
  const q = Number(match[2]);
  const firstMonth = { 1: [sy, 8], 2: [sy, 10], 3: [sy + 1, 0], 4: [sy + 1, 3] }[q];
  return quarterOf(new Date(firstMonth[0], firstMonth[1], 1));
}

const monthKeyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return `${MONTHS[m - 1]} ${y}`;
}
function monthLabelGen(key) {
  const [y, m] = key.split('-').map(Number);
  return `${['січень', 'лютий', 'березень', 'квітень', 'травень', 'червень', 'липень', 'серпень', 'вересень', 'жовтень', 'листопад', 'грудень'][m - 1]} ${y}`;
}
/** Місяць, за який зараз треба звітувати (попередній). За липень і серпень — канікули, звіт не потрібен. */
function reportMonthDue(now = new Date()) {
  const d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  return d.getMonth() === 6 || d.getMonth() === 7 ? null : monthKeyOf(d);
}

/** Хто розглядає звіт: звіт Президента — арт-менеджери й адміністрація, решта — Президент і арт-менеджери. */
function reportReviewers(ownerId) {
  const owner = getMinister(ownerId);
  if (owner && isPresident(owner)) return [...managers(), ...schoolStaff()].map((m) => m.id);
  return [...state.ministers.filter(isPresident), ...managers()].map((m) => m.id);
}

/** Стан виконання вимог статуту для посади. */
function compliance(m) {
  const q = quarterOf();
  const due = reportMonthDue();
  const plan = planOf(m.id, q.key);
  const report = due ? reportOf(m.id, due) : null;
  return {
    q,
    due,
    plan,
    planStatus: plan ? plan.status : 'none',
    report,
    reportStatus: report ? report.status : 'none',
    initiatives: initiativesOf(m.id, q).length,
    team: (m.team || []).length,
    overdue: state.tasks.filter((t) => t.ministerId === m.id && effectiveStatus(t) === 'overdue').length,
  };
}

function pendingReviews() {
  const user = currentUser();
  if (!user) return [];
  const plans = can('review-plan')
    ? state.plans.filter((p) => p.status === 'submitted' && p.ownerId !== user.id).map((p) => ({ kind: 'plan', item: p }))
    : [];
  const reports = state.reports
    .filter((r) => r.status === 'submitted' && can('review-report', r) && reportReviewers(r.ownerId).includes(user.id))
    .map((r) => ({ kind: 'report', item: r }));
  return [...plans, ...reports];
}
/** Невиконані вимоги статуту для власної посади (план, звіт, ініціатива). */
function myObligations() {
  const user = currentUser();
  if (!user || isStaff(user)) return 0;
  const c = compliance(user);
  return Number(['none', 'draft', 'returned'].includes(c.planStatus))
    + Number(Boolean(c.due) && ['none', 'returned'].includes(c.reportStatus))
    + Number(c.initiatives === 0);
}

      <article class="card">
        ${cardHead('history', 'Мої звіти', `<button type="button" class="link-btn" data-action="open-report" data-owner="${user.id}" data-month="${currentMonth}">${icon('plus')}Звіт за ${monthLabelGen(currentMonth)}</button>`)}
        ${ownHistory.length ? `<ul class="list">${ownHistory.map((r) => `
          <li><button type="button" class="list-item" data-action="open-report" data-owner="${r.ownerId}" data-month="${r.month}">
            <span class="list-item__main"><span class="list-item__title">Звіт за ${monthLabelGen(r.month)}</span>
            <span class="list-item__meta">${r.submittedAt ? `Подано ${timeAgo(r.submittedAt)}` : 'Ще не подано'}${r.demo ? ' · демо' : ''}</span></span>
            ${statusChip(REPORT_STATUS[r.status])}
          </button></li>`).join('')}</ul>`
          : emptyState({ iconName: 'clipboard-check', title: 'Звітів ще немає', text: 'Раз на місяць коротко опишіть, що зроблено, — Президент побачить звіт одразу.', small: true })}
      </article>
    </section>` : '';

  const reviewSection = reviews.length ? `
    <article class="card section-gap">
      ${cardHead('inbox', 'Чекають вашого рішення', `<span class="card__count">${reviews.length}</span>`)}
      <ul class="list">${reviews.map(({ kind, item }) => {
        const owner = getMinister(item.ownerId);
        return `
          <li><button type="button" class="list-item" data-action="${kind === 'plan' ? 'open-plan' : 'open-report'}" data-owner="${item.ownerId}" ${kind === 'plan' ? `data-period="${item.period}"` : `data-month="${item.month}"`}>
            ${avatar(owner, 'sm')}
            <span class="list-item__main"><span class="list-item__title">${kind === 'plan' ? `План на ${quarterByKey(item.period).label}` : `Звіт за ${monthLabelGen(item.month)}`}</span>
            <span class="list-item__meta">${owner ? `${esc(owner.position)} — ${esc(owner.name)}` : 'Посаду видалено'} · подано ${timeAgo(item.submittedAt || item.updatedAt)}</span></span>
            <span class="pill pill--warn">${kind === 'plan' ? 'Затвердити' : 'Прийняти'}</span>
          </button></li>`;
      }).join('')}</ul>
    </article>` : '';

  const rows = overseer ? cabinetMembers().map((m) => {
    const c = compliance(m);
    return `
      <tr>
        <td data-label="Посада"><div><a href="#${ministerRoute(m.id)}" data-action="goto-minister" data-id="${m.id}">${ministerChip(m)}</a></div></td>
        <td data-label="План на чверть"><div><button type="button" class="chip-btn" data-action="open-plan" data-owner="${m.id}" data-period="${q.key}">${statusChip(PLAN_STATUS[c.planStatus])}</button></div></td>
        <td data-label="${due ? `Звіт за ${monthLabelGen(due)}` : 'Звіт'}"><div>${due ? `<button type="button" class="chip-btn" data-action="open-report" data-owner="${m.id}" data-month="${due}">${statusChip(REPORT_STATUS[c.reportStatus])}</button>` : '<span class="muted">канікули</span>'}</div></td>
        <td data-label="Ініціативи"><div>${c.initiatives ? `<span class="pill pill--ok">${icon('lightbulb')}${c.initiatives}</span>` : '<span class="pill pill--danger">0</span>'}</div></td>
        <td data-label="Прострочено"><div>${c.overdue ? `<span class="pill pill--danger">${c.overdue}</span>` : '<span class="muted">—</span>'}</div></td>
        <td data-label="Команда"><div>${c.team || '<span class="muted">—</span>'}</div></td>
      </tr>`;
  }).join('') : '';

  const all = overseer ? cabinetMembers().map(compliance) : [];
  const tally = overseer ? {
    plans: all.filter((c) => c.planStatus === 'approved').length,
    reports: all.filter((c) => ['submitted', 'accepted'].includes(c.reportStatus)).length,
    initiatives: all.filter((c) => c.initiatives > 0).length,
  } : null;

  const cabinetSection = overseer ? `
    <h2 class="section-title">${icon('landmark')}Кабінет міністрів <span>${q.label}${due ? ` · звіт за ${monthLabelGen(due)}` : ''}</span></h2>
    <section class="stats-grid stats-grid--3 section-gap">
      ${statCard({ iconName: 'map', value: `${tally.plans}/${all.length}`, label: 'Плани затверджено', hint: 'План роботи на чверть', tone: 'gold' })}
      ${statCard({ iconName: 'clipboard-check', value: due ? `${tally.reports}/${all.length}` : '—', label: 'Звіти подано', hint: due ? `За ${monthLabelGen(due)}` : 'Канікули', tone: 'progress' })}
      ${statCard({ iconName: 'lightbulb', value: `${tally.initiatives}/${all.length}`, label: 'Є нова ініціатива', hint: 'Щонайменше одна за чверть', tone: 'done' })}
    </section>
    <div class="card table-wrap">
      <table class="table compliance-table">
        <thead><tr>
          <th scope="col">Посада</th><th scope="col">План на чверть</th><th scope="col">${due ? `Звіт за ${monthLabelGen(due)}` : 'Звіт'}</th>
          <th scope="col">Ініціативи</th><th scope="col">Прострочено</th><th scope="col">Команда</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>` : '';

  return `
    ${pageHead('Плани і звіти', `Вимоги статуту: план на чверть, щомісячний звіт і нова ініціатива від кожного міністерства · ${q.label}`)}
    ${reviewSection}
    ${ownSection}
    ${cabinetSection}`;
}

/* ---------- План на чверть ---------- */

function openPlan(ownerId, periodKey) {
  const owner = getMinister(ownerId);
  if (!owner || isStaff(owner) || !canSeeMinistry(ownerId)) return;
  const user = currentUser();
  const q = quarterByKey(periodKey);
  const plan = planOf(ownerId, q.key);
  const status = plan ? plan.status : 'none';
  const own = user.id === ownerId;
  const editable = own && status !== 'approved';
  const reviewable = can('review-plan') && !own && status === 'submitted';
  const reviewer = plan && plan.reviewedBy ? getMinister(plan.reviewedBy) : null;
  const quarterTasks = sortTasks(state.tasks.filter((t) => t.ministerId === ownerId && t.date >= q.start && t.date <= q.end));

  const body = `
    <div class="detail__badges">${statusChip(PLAN_STATUS[status])}${plan && plan.demo ? demoTag() : ''}</div>
    <p class="doc-owner">${ministerChip(owner)}</p>
    ${plan && plan.comment ? `<p class="form-note ${status === 'returned' ? 'form-note--tz' : ''}">${icon('message-square-text')}<span><b>Коментар${reviewer ? ` · ${esc(reviewer.position)}` : ''}</b> ${esc(plan.comment)}</span></p>` : ''}
    ${editable ? `
    <form class="form" id="plan-form" novalidate>
      <div class="field" data-field="text">
        <label for="pl-text">Що міністерство планує на ${q.label}</label>
        <textarea class="input" id="pl-text" name="text" rows="8" maxlength="4000" placeholder="Кожен пункт — з нового рядка: захід, ініціатива, орієнтовний термін…">${esc(plan ? plan.text : '')}</textarea>
        <p class="field__hint">Статут: кожне міністерство складає план роботи на поточну навчальну чверть. Після подання план затверджує Президент.</p>
        <p class="field__error"></p>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--ghost" data-role="save-draft">${icon('save')}<span>Зберегти чернетку</span></button>
        <button type="submit" class="btn btn--gold">${icon('send')}<span>${status === 'submitted' ? 'Оновити поданий план' : 'Подати на затвердження'}</span></button>
      </div>
    </form>` : `
    <h4 class="detail__label">План роботи</h4>
    ${plan && plan.text ? `<div class="detail__plan">${esc(plan.text)}</div>` : '<p class="muted">План ще не складено.</p>'}`}
    <h4 class="detail__label">Завдання міністерства в цій чверті (${quarterTasks.length})</h4>
    ${quarterTasks.length ? `<ul class="mini-task-list">${quarterTasks.map((t) => `<li>${statusBadge(t)}<button type="button" class="link-btn" data-action="view-task" data-id="${t.id}">${esc(t.title)}</button>${t.initiative ? initiativeTag() : ''}<small>${formatDateShort(t.date)}</small></li>`).join('')}</ul>` : '<p class="muted">Завдань із дедлайном у цій чверті поки немає.</p>'}
    ${reviewable ? reviewForm('plan') : ''}
    ${plan && plan.reviewedAt && !reviewable ? `<p class="detail__stamps">${status === 'approved' ? 'Затверджено' : 'Розглянуто'} ${timeAgo(plan.reviewedAt)}${reviewer ? ` · ${esc(reviewer.position)} — ${esc(reviewer.name)}` : ''}</p>` : ''}`;

  const modal = openModal({ title: `План на ${q.label}`, iconName: 'map', body });
  const form = $('#plan-form', modal);
  if (form) {
    const save = (submit) => {
      const text = form.elements.text.value.trim();
      if (submit && !text) {
        setFieldErrors(form, { text: 'Опишіть хоча б один пункт плану' });
        return;
      }
      const now = Date.now();
      const target = plan || { id: uid('p'), ownerId, period: q.key, comment: '', reviewedBy: null, reviewedAt: null, submittedAt: null, demo: false };
      const wasSubmitted = target.status === 'submitted';
      Object.assign(target, { text, updatedAt: now, demo: false, status: submit ? 'submitted' : (target.status === 'submitted' ? 'submitted' : 'draft') });
      if (submit) target.submittedAt = now;
      if (!plan) state.plans.push(target);
      if (submit && !wasSubmitted) {
        notify('plan-submitted', null, `${owner.position}: план на ${q.label} чекає затвердження`, planReviewers(ownerId), { kind: 'plan', id: target.id });
        logActivity('plan', `${owner.position}: план на ${q.label} подано на затвердження`, ownerId);
      }
      closeModal(modal);
      commit(submit ? (wasSubmitted ? 'План оновлено' : 'План подано на затвердження') : 'Чернетку плану збережено');
    };
    form.addEventListener('submit', (e) => { e.preventDefault(); save(true); });
    $('[data-role="save-draft"]', form).addEventListener('click', () => save(false));
  }
  bindReview(modal, (decision, comment) => {
    Object.assign(plan, { status: decision === 'accept' ? 'approved' : 'returned', comment, reviewedBy: user.id, reviewedAt: Date.now() });
    notify('plan-reviewed', null, `План на ${q.label} ${decision === 'accept' ? 'затверджено' : 'повернуто на доопрацювання'}`, [ownerId], { kind: 'plan', id: plan.id });
    logActivity('plan', `${owner.position}: план на ${q.label} ${decision === 'accept' ? 'затверджено' : 'повернуто на доопрацювання'}`, ownerId);
    closeModal(modal);
    commit(decision === 'accept' ? 'План затверджено' : 'План повернуто з коментарем');
  });
}

/* ---------- Щомісячний звіт ---------- */

function openReport(ownerId, month) {
  const owner = getMinister(ownerId);
  if (!owner || isStaff(owner) || !canSeeMinistry(ownerId) || !/^\d{4}-\d{2}$/.test(month || '')) return;
  const user = currentUser();
  const report = reportOf(ownerId, month);
  const status = report ? report.status : 'none';
  const own = user.id === ownerId;
  const editable = own && ['none', 'returned', 'submitted'].includes(status);
  const reviewable = !own && status === 'submitted' && can('review-report', report) && reportReviewers(ownerId).includes(user.id);
  const reviewer = report && report.reviewedBy ? getMinister(report.reviewedBy) : null;
  const doneTasks = state.tasks.filter((t) => t.ministerId === ownerId && t.completedAt && monthKeyOf(new Date(t.completedAt)) === month);
  const doneList = doneTasks.map((t) => `• ${t.title}`).join('\n');
  const reviewers = reportReviewers(ownerId).map(getMinister).filter(Boolean);

  const field = (name, label, value, placeholder, rows = 4) => `
    <div class="field" data-field="${name}">
      <label for="rp-${name}">${label}</label>
      <textarea class="input" id="rp-${name}" name="${name}" rows="${rows}" maxlength="3000" placeholder="${placeholder}">${esc(value)}</textarea>
      <p class="field__error"></p>
    </div>`;
  const view = (label, value) => (value ? `<h4 class="detail__label">${label}</h4><div class="detail__plan">${esc(value)}</div>` : '');

  const body = `
    <div class="detail__badges">${statusChip(REPORT_STATUS[status])}${report && report.demo ? demoTag() : ''}</div>
    <p class="doc-owner">${ministerChip(owner)}</p>
    ${report && report.comment ? `<p class="form-note ${status === 'returned' ? 'form-note--tz' : ''}">${icon('message-square-text')}<span><b>Коментар${reviewer ? ` · ${esc(reviewer.position)}` : ''}</b> ${esc(report.comment)}</span></p>` : ''}
    ${editable ? `
    <form class="form" id="report-form" novalidate>
      ${field('done', 'Що зроблено за місяць <span class="req">*</span>', report ? report.done : '', 'Заходи, результати, кількість учасників…', 5)}
      ${doneTasks.length ? `<p class="field__hint">Виконані в системі завдання за ${monthLabelGen(month)}: ${doneTasks.length}. <button type="button" class="link-btn" data-role="insert-done">${icon('list-plus')}Вставити список</button></p>` : ''}
      ${field('problems', 'Труднощі / потрібна допомога', report ? report.problems : '', 'Що завадило, де потрібна підтримка інших міністерств чи адміністрації', 3)}
      ${field('next', 'Плани на наступний місяць', report ? report.next : '', 'Коротко: що буде далі', 3)}
      <p class="form-note">${icon('send')}<span>Звіт отримають: ${reviewers.map((m) => esc(m.position)).join(', ') || 'Президент'}.</span></p>
      <div class="modal__footer">
        <button type="button" class="btn btn--ghost" data-action="close-modal">Скасувати</button>
        <button type="submit" class="btn btn--gold">${icon('send')}<span>${status === 'submitted' ? 'Оновити звіт' : 'Подати звіт'}</span></button>
      </div>
    </form>` : `
    ${report ? `${view('Що зроблено', report.done)}${view('Труднощі / потрібна допомога', report.problems)}${view('Плани на наступний місяць', report.next)}` : '<p class="muted">Звіт за цей місяць ще не подано.</p>'}
    <h4 class="detail__label">Виконані завдання за ${monthLabelGen(month)} (${doneTasks.length})</h4>
    ${doneTasks.length ? `<ul class="mini-task-list">${doneTasks.map((t) => `<li>${statusBadge(t)}<button type="button" class="link-btn" data-action="view-task" data-id="${t.id}">${esc(t.title)}</button></li>`).join('')}</ul>` : '<p class="muted">У системі немає виконаних завдань за цей місяць.</p>'}`}
    ${reviewable ? reviewForm('report') : ''}
    ${report && report.reviewedAt && !reviewable ? `<p class="detail__stamps">${status === 'accepted' ? 'Прийнято' : 'Розглянуто'} ${timeAgo(report.reviewedAt)}${reviewer ? ` · ${esc(reviewer.position)} — ${esc(reviewer.name)}` : ''}</p>` : ''}`;

  const modal = openModal({ title: `Звіт за ${monthLabelGen(month)}`, iconName: 'clipboard-check', body });
  const form = $('#report-form', modal);
  if (form) {
    const insert = $('[data-role="insert-done"]', form);
    if (insert) insert.addEventListener('click', () => {
      const area = form.elements.done;
      area.value = area.value.trim() ? `${area.value.trim()}\n${doneList}` : doneList;
      area.focus();
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const values = {
        done: form.elements.done.value.trim(),
        problems: form.elements.problems.value.trim(),
        next: form.elements.next.value.trim(),
      };
      setFieldErrors(form, values.done ? {} : { done: 'Опишіть, що зроблено за місяць' });
      if (!values.done) return;
      const now = Date.now();
      const wasSubmitted = status === 'submitted';
      const target = report || { id: uid('r'), ownerId, month, comment: '', reviewedBy: null, reviewedAt: null, demo: false };
      Object.assign(target, values, { status: 'submitted', submittedAt: now, updatedAt: now, demo: false });
      if (!report) state.reports.push(target);
      if (!wasSubmitted) {
        notify('report-submitted', null, `${owner.position}: звіт за ${monthLabelGen(month)}`, reportReviewers(ownerId), { kind: 'report', id: target.id });
        logActivity('report', `${owner.position}: подано звіт за ${monthLabelGen(month)}`, ownerId);
      }
      closeModal(modal);
      commit(wasSubmitted ? 'Звіт оновлено' : 'Звіт подано');
    });
  }
  bindReview(modal, (decision, comment) => {
    Object.assign(report, { status: decision === 'accept' ? 'accepted' : 'returned', comment, reviewedBy: user.id, reviewedAt: Date.now() });
    notify('report-reviewed', null, `Звіт за ${monthLabelGen(month)} ${decision === 'accept' ? 'прийнято' : 'повернуто на доопрацювання'}`, [ownerId], { kind: 'report', id: report.id });
    logActivity('report', `${owner.position}: звіт за ${monthLabelGen(month)} ${decision === 'accept' ? 'прийнято' : 'повернуто'}`, ownerId);
    closeModal(modal);
    commit(decision === 'accept' ? 'Звіт прийнято' : 'Звіт повернуто з коментарем');
  });
}

/* Спільна форма рішення: затвердити / повернути з коментарем */
function reviewForm(kind) {
  const acceptLabel = kind === 'plan' ? 'Затвердити план' : kind === 'report' ? 'Прийняти звіт' : 'Погодити захід';
  const returnLabel = kind === 'approval' ? 'Не погоджувати' : 'Повернути на доопрацювання';
  return `
    <form class="form review-form" data-role="review-form" novalidate>
      <div class="field" data-field="comment">
        <label for="rv-comment">Коментар ${kind === 'approval' ? 'адміністрації' : ''}</label>
        <textarea class="input" id="rv-comment" name="comment" rows="3" maxlength="1000" placeholder="Обовʼязково, якщо повертаєте: що змінити або доповнити"></textarea>
        <p class="field__error"></p>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--danger-ghost" data-role="review-return">${icon('undo-2')}<span>${returnLabel}</span></button>
        <button type="button" class="btn btn--gold" data-role="review-accept">${icon(kind === 'approval' ? 'stamp' : 'badge-check')}<span>${acceptLabel}</span></button>
      </div>
    </form>`;
}

function bindReview(modal, onDecide) {
  const form = $('[data-role="review-form"]', modal);
  if (!form) return;
  const decide = (decision) => {
    const comment = form.elements.comment.value.trim();
    if (decision === 'return' && !comment) {
      setFieldErrors(form, { comment: 'Напишіть, що потрібно змінити' });
      form.elements.comment.focus();
      return;
    }
    onDecide(decision, comment);
  };
  $('[data-role="review-accept"]', form).addEventListener('click', () => decide('accept'));
  $('[data-role="review-return"]', form).addEventListener('click', () => decide('return'));
}

/* ---------- Команда міністерства ---------- */

function openTeamMemberForm(ownerId) {
  const owner = getMinister(ownerId);
  if (!owner || isStaff(owner) || !can('edit-team', owner)) {
    toast('Команду міністерства веде лише сам міністр', 'error');
    return;
  }
  if ((owner.team || []).length >= 40) {
    toast('У команді вже 40 учнів — це максимум', 'error');
    return;
  }
  const body = `
    <form class="form" id="team-form" novalidate>
      <div class="field" data-field="name">
        <label for="tm-name">Імʼя та прізвище <span class="req">*</span></label>
        <input class="input" id="tm-name" name="name" maxlength="60" placeholder="Напр., Коваль Софія" required>
        <p class="field__error"></p>
      </div>
      <div class="form-grid">
        <div class="field" data-field="klass">
          <label for="tm-klass">Клас</label>
          <input class="input" id="tm-klass" name="klass" maxlength="10" placeholder="9-А">
          <p class="field__error"></p>
        </div>
        <div class="field">
          <label for="tm-role">Чим допомагає</label>
          <input class="input" id="tm-role" name="role" maxlength="60" placeholder="Напр., фото, ведучий, декорації">
        </div>
      </div>
      <p class="form-note">${icon('shield-check')}<span>Не вказуйте телефони, адреси чи інші контакти учнів — лише імʼя, клас і роль у команді.</span></p>
      <div class="modal__footer">
        <button type="button" class="btn btn--ghost" data-action="close-modal">Скасувати</button>
        <button type="submit" class="btn btn--gold">${icon('user-round-plus')}<span>Додати до команди</span></button>
      </div>
    </form>`;
  const modal = openModal({ title: `Команда: ${owner.position}`, iconName: 'users', body });
  $('#team-form', modal).addEventListener('submit', (e) => {
    e.preventDefault();
    const form = e.target;
    const values = {
      name: form.elements.name.value.trim(),
      klass: form.elements.klass.value.trim().toUpperCase(),
      role: form.elements.role.value.trim(),
    };
    const errors = {};
    if (!values.name) errors.name = 'Вкажіть імʼя учня';
    if (values.klass && !/^\d{1,2}(-?[A-ZА-ЯІЇЄҐ])?$/i.test(values.klass)) errors.klass = 'Формат класу: 9-А';
    setFieldErrors(form, errors);
    if (Object.keys(errors).length) return;
    owner.team = [...(owner.team || []), { id: uid('s'), ...values, demo: false }];
    logActivity('team', `${owner.position}: до команди долучився ${values.name}`, ownerId);
    closeModal(modal);
    commit('Учня додано до команди');
  });
}

async function removeTeamMember(ownerId, memberId) {
  const owner = getMinister(ownerId);
  if (!owner || !can('edit-team', owner)) return;
  const member = (owner.team || []).find((p) => p.id === memberId);
  if (!member) return;
  const ok = await confirmDialog({ title: 'Прибрати з команди?', text: `<b>${esc(member.name)}</b> більше не буде в команді «${esc(owner.position)}».`, confirmLabel: 'Прибрати' });
  if (!ok) return;
  owner.team = owner.team.filter((p) => p.id !== memberId);
  logActivity('team', `${owner.position}: ${member.name} більше не в команді`, ownerId);
  commit('Команду оновлено');
}

/* ---------- Погодження масштабних заходів ---------- */

        <button type="button" class="btn btn--gold btn--sm" data-action="decide-approval" data-id="${t.id}" data-decision="accept">${icon('stamp')}<span>Погодити</span></button>
      </div>` : ''}
      ${a.status === 'returned' && canEditTask(t) ? `
      <div class="btn-row"><button type="button" class="btn btn--ghost btn--sm" data-action="edit-task" data-id="${t.id}">${icon('pencil')}<span>Доопрацювати й подати знову</span></button></div>` : ''}
    </article>`;
}

function renderApprovals() {
  const user = currentUser();
  const approver = can('approve');
  const relevant = state.tasks.filter((t) => t.approval && (approver || can('see-cabinet') || canEditTask(t) || involves(t, user)));
  const pending = relevant.filter((t) => t.approval.status === 'pending').sort((a, b) => a.date.localeCompare(b.date));
  const decided = relevant.filter((t) => t.approval.status !== 'pending').sort((a, b) => (b.approval.decidedAt || 0) - (a.approval.decidedAt || 0)).slice(0, 30);
  const sub = approver
    ? 'Статут: усі масштабні заходи та ініціативи погоджуються з відповідальним педагогом або адміністрацією.'
    : 'Масштабні заходи вашого міністерства та їхній статус погодження з адміністрацією школи.';
  return `
    ${pageHead('Погодження', sub)}
    <h2 class="section-title">${icon('hourglass')}${approver ? 'Чекають вашого рішення' : 'На погодженні'} <span>${pending.length}</span></h2>
    ${pending.length ? `<section class="approval-grid section-gap">${pending.map(approvalCard).join('')}</section>`
      : `<div class="card section-gap">${emptyState({ iconName: 'stamp', title: 'Немає заходів на погодженні', text: approver ? 'Нові запити зʼявляться тут і в сповіщеннях.' : 'Щоб подати захід, у формі завдання увімкніть «Масштабний захід — потрібне погодження».', small: true })}</div>`}
    <h2 class="section-title">${icon('history')}Розглянуті <span>${decided.length}</span></h2>
    ${decided.length ? `<section class="approval-grid">${decided.map(approvalCard).join('')}</section>`
      : `<div class="card">${emptyState({ iconName: 'history', title: 'Рішень ще немає', small: true })}</div>`}`;
}

function decideApproval(id, decision) {
  const t = getTask(id);
  if (!t || !t.approval || t.approval.status !== 'pending') return;
  if (!can('approve')) {
    toast('Погоджують заходи адміністрація школи та арт-менеджери', 'error');
    return;
  }
  const accept = decision === 'accept';
  const body = `
    <p class="settings-text">${accept ? 'Погодити' : 'Не погоджувати'} захід <b>«${esc(t.title)}»</b> (${formatDate(t.date)})?</p>
    ${reviewForm('approval')}`;
  const modal = openModal({ title: accept ? 'Погодження заходу' : 'Відмова в погодженні', iconName: 'stamp', body });
  const target = $(`[data-role="review-${accept ? 'return' : 'accept'}"]`, modal);
  if (target) target.hidden = true; // показуємо лише обрану дію
  bindReview(modal, async (d, comment) => {
    const user = currentUser();
    if (CLOUD) {
      try {
        await cloudRpc('decide_approval', { p_task: t.id, p_decision: d, p_comment: comment });
      } catch (err) {
        toast(cloudErrorText(err), 'error');
        return;
      }
    }
    Object.assign(t.approval, { status: d === 'accept' ? 'approved' : 'returned', comment, decidedBy: user.id, decidedAt: Date.now() });
    t.updatedAt = Date.now();
    if (CLOUD) cloudAcceptServer('tasks', t); // зміну вже зробила база
    notify('approval-decision', t, `«${t.title}»: ${d === 'accept' ? 'захід погоджено' : 'захід не погоджено'}`, [t.ministerId === ALL_ID ? null : t.ministerId, t.approval.requestedBy, t.createdBy]);
    logActivity('approval', `${d === 'accept' ? 'Погоджено' : 'Не погоджено'}: «${t.title}»`, t.ministerId);
    closeAllModals();
    commit(d === 'accept' ? 'Захід погоджено' : 'Рішення надіслано міністру');
  });
}

/*
 * Якщо поруч зі сторінкою є config.js з адресою проєкту Supabase, платформа працює
 * зі спільною базою: вхід поштою й паролем, обовʼязкова 2FA, права ролей перевіряє сервер.
 * Без config.js (демо-версія на claude.ai) — як раніше, дані в браузері.
 */
const CLOUD_CFG = typeof window !== 'undefined' && window.SG_CONFIG && typeof window.SG_CONFIG === 'object' ? window.SG_CONFIG : null;
const CLOUD = Boolean(CLOUD_CFG && /^(https:\/\/[a-z0-9.-]+|http:\/\/localhost(:\d+)?)$/i.test(String(CLOUD_CFG.supabaseUrl || '').replace(/\/$/, ''))
  && /^[A-Za-z0-9._-]{20,}$/.test(String(CLOUD_CFG.supabaseKey || '')));
/** config.js є, але не заповнений — показуємо підказку замість демо-режиму. */
const CLOUD_BAD = Boolean(CLOUD_CFG) && !CLOUD;
const CLOUD_REMEMBER_KEY = 'sg-cloud:remember';
const CLOUD_ORDER = ['settings', 'ministers', 'tasks', 'plans', 'reports', 'drafts', 'notifications', 'activity'];
const CLOUD_TABLE = {
  settings: 'settings', ministers: 'accounts', tasks: 'tasks', plans: 'plans', reports: 'reports',
  drafts: 'drafts', notifications: 'notifications', activity: 'activity',
};
const COLL_BY_TABLE = Object.fromEntries(Object.entries(CLOUD_TABLE).map(([k, v]) => [v, k]));

const cloud = {
  client: null,
  phase: 'starting',    // starting → login → mfa → loading → ready
  email: '',
  mfa: null,            // { factorId, qr, secret, enrolling }
  raw: {},              // останні рядки з сервера за таблицями
  synced: {},           // coll → Map(id → JSON рядка), що вже збережено на сервері
  queued: false,
  draining: false,
  rerun: false,
  pdfCache: new Map(),
  reloadTimers: {},
  channel: null,
  lastLoad: 0,
  error: '',
};

const msOf = (v) => (v ? Date.parse(v) || null : null);
const isoOf = (ms) => (ms ? new Date(ms).toISOString() : null);
const stableJson = (v) => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)
  ? Object.keys(x).sort().reduce((o, key) => { o[key] = x[key]; return o; }, {}) : x));

/* Сесія Supabase: «Запамʼятати мене» — у localStorage, інакше до закриття вкладки */
const cloudStorage = {
  target() {
    try { return localStorage.getItem(CLOUD_REMEMBER_KEY) === '1' ? localStorage : sessionStorage; } catch { return null; }
  },
  getItem(k) { try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  setItem(k, v) { try { const t = this.target(); if (t) t.setItem(k, v); } catch { /* ignore */ } },
  removeItem(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch { /* ignore */ } },
};

function cloudClient() {
  if (!cloud.client && CLOUD && window.supabase) {
    cloud.client = window.supabase.createClient(CLOUD_CFG.supabaseUrl.replace(/\/$/, ''), CLOUD_CFG.supabaseKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storage: cloudStorage, storageKey: 'sg-cloud-auth' },
    });
  }
  return cloud.client;
}

function cloudErrorText(err) {
  const msg = String((err && (err.message || err.error_description)) || err || '');
  if (/invalid login credentials/i.test(msg)) return 'Невірний логін або пароль';
  if (/rate limit|too many/i.test(msg)) return 'Забагато спроб. Зачекайте кілька хвилин і спробуйте знову.';
  if (/invalid totp|invalid code|otp/i.test(msg)) return 'Код не підходить. Введіть свіжий 6-значний код із застосунку.';
  if (/failed to fetch|network/i.test(msg)) return 'Немає звʼязку з сервером. Перевірте інтернет.';
  if (/row-level security|permission denied/i.test(msg)) return 'Немає прав на цю дію.';
  if (/JWT|session/i.test(msg)) return 'Сесію завершено — увійдіть знову.';
  if (/[а-яіїєґ]/i.test(msg)) return msg; // повідомлення сервера українською (перевірки статуту)
  return 'Не вдалося виконати дію. Спробуйте ще раз.';
}

async function cloudFetch(table) {
  const sb = cloudClient();
  let q = sb.from(table).select('*');
  if (table === 'accounts') q = q.order('sort').order('created_at');
  else if (table === 'notifications') q = q.order('created_at', { ascending: false }).limit(200);
  else if (table === 'activity') q = q.order('created_at', { ascending: false }).limit(150);
  else if (table === 'tasks') q = q.order('created_at').limit(5000);
  else q = q.limit(5000);
  const { data, error } = await q;
  if (error) throw error;
  return data || [];
}

function cloudAssemble() {
  const raw = cloud.raw;
  const settingsRow = (raw.settings || [])[0];
  return normalizeState({
    version: DATA_VERSION,
    seedVersion: SEED_VERSION,
    settings: { ...defaultSettings(), quickLogin: false, require2fa: false, ...(settingsRow ? CLOUD_MAP.settings.from(settingsRow) : {}) },
    ministers: (raw.accounts || []).map(CLOUD_MAP.ministers.from),
    tasks: (raw.tasks || []).map(CLOUD_MAP.tasks.from),
    plans: (raw.plans || []).map(CLOUD_MAP.plans.from),
    reports: (raw.reports || []).map(CLOUD_MAP.reports.from),
    drafts: (raw.drafts || []).map(CLOUD_MAP.drafts.from),
    notifications: (raw.notifications || []).map(CLOUD_MAP.notifications.from),
    activity: (raw.activity || []).map(CLOUD_MAP.activity.from),
    demoBannerHidden: true,
  });
}

function cloudSnapshot(coll, list = cloudRecords(coll)) {
  const map = new Map();
  list.forEach((rec) => map.set(String(rec.id), stableJson(CLOUD_MAP[coll].to(rec))));
  cloud.synced[coll] = map;
}

/** Чи є локальні зміни запису, ще не збережені на сервері. */
function cloudDirty(coll, rec) {
  const saved = cloud.synced[coll] && cloud.synced[coll].get(String(rec.id));
  return saved === undefined || saved !== stableJson(CLOUD_MAP[coll].to(rec));
}

async function cloudLoadAll() {
  const tables = Object.values(CLOUD_TABLE);
  const results = await Promise.all(tables.map(cloudFetch));
  tables.forEach((t, i) => { cloud.raw[t] = results[i]; });
  state = cloudAssemble();
  CLOUD_ORDER.forEach((coll) => cloudSnapshot(coll));
  cloud.lastLoad = Date.now();
}

/** Оновлення з сервера без втрати незбережених локальних змін і посилань на відкриті обʼєкти. */
function cloudReconcile(fresh, colls) {
  colls.forEach((coll) => {
    if (coll === 'settings') {
      if (!cloudDirty('settings', { ...state.settings, id: 1 })) {
        Object.assign(state.settings, { cabinetName: fresh.settings.cabinetName });
        cloudSnapshot('settings');
      }
      return;
    }
    const current = state[coll];
    const byId = new Map(current.map((x) => [x.id, x]));
    const dirty = new Set(current.filter((x) => cloudDirty(coll, x)).map((x) => x.id));
    const next = fresh[coll].map((item) => {
      const existing = byId.get(item.id);
      if (!existing) return item;
      if (dirty.has(item.id)) return existing;
      Object.keys(existing).forEach((k) => { if (!(k in item)) delete existing[k]; });
      return Object.assign(existing, item);
    });
    // локальні записи, які ще не дійшли до сервера, не губимо
    current.forEach((x) => { if (dirty.has(x.id) && !next.includes(x) && !(cloud.synced[coll] && cloud.synced[coll].has(String(x.id)))) next.push(x); });
    current.length = 0;
    next.forEach((x) => current.push(x));
    const map = cloud.synced[coll] || new Map();
    fresh[coll].forEach((item) => { if (!dirty.has(item.id)) map.set(String(item.id), stableJson(CLOUD_MAP[coll].to(item))); });
    [...map.keys()].forEach((id) => { if (!fresh[coll].some((x) => String(x.id) === id) && !dirty.has(id)) map.delete(id); });
    cloud.synced[coll] = map;
  });
}

async function cloudReloadTables(tables) {
  try {
    const results = await Promise.all(tables.map(cloudFetch));
    tables.forEach((t, i) => { cloud.raw[t] = results[i]; });
    cloudReconcile(cloudAssemble(), tables.map((t) => COLL_BY_TABLE[t]).filter(Boolean));
    if (tables.includes('ideas') || parseRoute().name === 'wishes') loadWishes(false);
    cloudScheduleRender();
  } catch (err) {
    console.warn('Оновлення з сервера не вдалося', err);
  }
}

function cloudScheduleReload(table) {
  if (table === 'ideas') {
    if (currentUser()) loadWishes(false);
    return;
  }
  if (!COLL_BY_TABLE[table]) return;
  clearTimeout(cloud.reloadTimers[table]);
  cloud.reloadTimers[table] = setTimeout(() => {
    if (cloud.draining || cloud.queued) { cloudScheduleReload(table); return; }
    cloudReloadTables([table]);
  }, 400);
}

function cloudScheduleRender() {
  if (cloud.phase !== 'ready' || !currentUser()) return;
  const active = document.activeElement;
  const typing = active && active.closest && active.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName);
  if (typing) {
    clearTimeout(cloud.renderTimer);
    cloud.renderTimer = setTimeout(cloudScheduleRender, 1500);
    return;
  }
  render();
}

function cloudSubscribe() {
  const sb = cloudClient();
  if (cloud.channel) sb.removeChannel(cloud.channel);
  cloud.channel = sb.channel('sg-live')
    .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => cloudScheduleReload(payload.table))
    .subscribe();
}

/* ---------- Збереження змін ---------- */

function cloudQueueSync() {
  if (cloud.phase !== 'ready') return;
  if (cloud.draining) { cloud.rerun = true; return; }
  if (cloud.queued) return;
  cloud.queued = true;
  setTimeout(cloudDrain, 0);
}

async function cloudUploadPdf(task) {
  const att = task.attachment;
  const path = `${task.id}/${uid('f')}.pdf`;
  const { error } = await cloudClient().storage.from('tz').upload(path, dataUrlToBlob(att.data), { contentType: 'application/pdf', upsert: false });
  if (error) throw error;
  cloud.pdfCache.set(path, att.data);
  task.attachment = { name: att.name, size: att.size, path };
}

async function cloudDrain() {
  cloud.queued = false;
  cloud.draining = true;
  const sb = cloudClient();
  try {
    for (const coll of CLOUD_ORDER) {
      const ops = CLOUD_OPS[coll];
      const table = CLOUD_TABLE[coll];
      const synced = cloud.synced[coll] || new Map();
      const records = cloudRecords(coll);
      for (const rec of records) {
        if (coll === 'tasks' && rec.attachment && rec.attachment.data && !rec.attachment.path) await cloudUploadPdf(rec);
        const row = CLOUD_MAP[coll].to(rec);
        const json = stableJson(row);
        const before = synced.get(String(rec.id));
        if (before === json) continue;
        if (before === undefined) {
          if (!ops.insert) continue;
          const { error } = await sb.from(table).insert(row);
          if (error) throw error;
        } else {
          if (!ops.update) continue;
          const prev = JSON.parse(before);
          const changed = {};
          Object.keys(row).forEach((k) => {
            if (k === 'id' || (IMMUTABLE_COLS[coll] || []).includes(k)) return;
            if (Array.isArray(ops.update) && !ops.update.includes(k)) return;
            if (stableJson(row[k]) !== stableJson(prev[k])) changed[k] = row[k];
          });
          if (Object.keys(changed).length) {
            const { data, error } = await sb.from(table).update(changed).eq('id', rec.id).select('id');
            if (error) throw error;
            if (!data || !data.length) throw new Error('Немає прав змінювати цей запис');
          }
        }
        synced.set(String(rec.id), json);
      }
      if (ops.remove) {
        const ids = new Set(records.map((r) => String(r.id)));
        for (const id of [...synced.keys()]) {
          if (ids.has(id)) continue;
          const { data, error } = await sb.from(table).delete().eq('id', id).select('id');
          if (error) throw error;
          if (!data || !data.length) throw new Error('Немає прав видалити цей запис');
          synced.delete(id);
        }
      }
      cloud.synced[coll] = synced;
    }
  } catch (err) {
    console.warn('Збереження не вдалося', err);
    toast(`Не збережено: ${cloudErrorText(err)}`, 'error');
    cloud.draining = false;
    cloud.rerun = false;
    await cloudLoadAllSafe(); // повертаємо дані з сервера
    render();
    return;
  }
  cloud.draining = false;
  if (cloud.rerun) { cloud.rerun = false; cloudQueueSync(); }
}

async function cloudLoadAllSafe() {
  try {
    const keep = session;
    await cloudLoadAll();
    session = keep;
  } catch (err) {
    toast(cloudErrorText(err), 'error');
  }
}

/** Позначити запис як уже збережений (зміну зробила функція бази). */
function cloudAcceptServer(coll, rec) {
  if (!cloud.synced[coll]) cloud.synced[coll] = new Map();
  cloud.synced[coll].set(String(rec.id), stableJson(CLOUD_MAP[coll].to(rec)));
}

async function cloudRpc(name, args) {
  const { data, error } = await cloudClient().rpc(name, args);
  if (error) throw error;
  return data;
}

/* PDF зі сховища: завантажуємо один раз і тримаємо в памʼяті сторінки */
async function cloudPdfData(att) {
  if (att.data) return att.data;
  if (cloud.pdfCache.has(att.path)) return cloud.pdfCache.get(att.path);
  const { data, error } = await cloudClient().storage.from('tz').download(att.path);
  if (error) throw error;
  const url = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).replace(/^data:[^;]*;/, 'data:application/pdf;'));
    reader.onerror = reject;
    reader.readAsDataURL(data);
  });
  cloud.pdfCache.set(att.path, url);
  return url;
}

/* ---------- Вхід, 2FA, вибір посади ---------- */

function cloudMyAccounts() {
  const mail = cloud.email.toLowerCase();
  return state.ministers.filter((m) => m.login.toLowerCase() === mail);
}

async function cloudBoot() {
  if (window.Chart) setChartDefaults();
  if (!window.supabase) {
    cloud.phase = 'error';
    cloud.error = 'Не вдалося завантажити бібліотеку Supabase. Перевірте інтернет і оновіть сторінку.';
    cloudRenderGate();
    return;
  }
  const sb = cloudClient();
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT' && cloud.phase === 'ready') cloudResetToLogin('Сесію завершено. Увійдіть знову.');
  });
  const { data } = await sb.auth.getSession();
  if (!data.session) { cloud.phase = 'login'; cloudRenderGate(); return; }
  cloud.email = data.session.user.email || '';
  await cloudAfterPassword();
}

async function cloudAfterPassword() {
  const sb = cloudClient();
  const { data: aal, error } = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if (error) { cloudResetToLogin(cloudErrorText(error)); return; }
  if (aal.currentLevel === 'aal2') { await cloudEnter(); return; }
  const { data: factors } = await sb.auth.mfa.listFactors();
  const verified = (factors && factors.totp || []).filter((f) => f.status === 'verified');
  if (verified.length) {
    cloud.mfa = { factorId: verified[0].id, enrolling: false };
  } else {
    // 2FA ще не підключено — підключаємо зараз (без неї сервер не віддає жодних даних)
    const stale = (factors && factors.all || []).filter((f) => f.status !== 'verified');
    for (const f of stale) await sb.auth.mfa.unenroll({ factorId: f.id });
    const { data: enrolled, error: enrollError } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: `STUDENT GOVERNMENT ${new Date().toISOString().slice(0, 16)}` });
    if (enrollError) { cloudResetToLogin(cloudErrorText(enrollError)); return; }
    const qr = String(enrolled.totp.qr_code || '');
    const svgPrefix = qr.match(/^data:image\/svg\+xml;(?:utf-8|charset=utf-8),/i);
    cloud.mfa = {
      factorId: enrolled.id, enrolling: true, secret: enrolled.totp.secret,
      qr: svgPrefix ? `data:image/svg+xml;charset=utf-8,${encodeURIComponent(qr.slice(svgPrefix[0].length))}` : qr,
    };
  }
  cloud.phase = 'mfa';
  cloudRenderGate();
}

async function cloudEnter() {
  cloud.phase = 'loading';
  cloudRenderGate();
  try {
    await cloudLoadAll();
  } catch (err) {
    cloudResetToLogin(cloudErrorText(err));
    return;
  }
  const mine = cloudMyAccounts();
  if (!mine.length) {
    await cloudClient().auth.signOut();
    cloudResetToLogin('Для цієї пошти немає посади в самоврядуванні. Зверніться до арт-менеджера.');
    return;
  }
  cloudSubscribe();
  cloud.phase = 'ready';
  const remember = cloudStorage.target() === localStorage;
  if (session && mine.some((m) => m.id === session.ministerId)) {
    lastActivity = Date.now();
  } else if (mine.length === 1) {
    saveSession(mine[0].id, remember);
    resetViewState();
    toast(`Вітаємо, ${mine[0].name}!`);
  } else {
    clearSession();
    session = null;
    cloud.phase = 'pick';
    cloudRenderGate();
    return;
  }
  if (!location.hash) history.replaceState(null, '', '#dashboard');
  render();
  if (voiceToken() && voiceReachable()) loadWishes(false);
}

function cloudResetToLogin(message = '') {
  if (cloud.channel && cloud.client) { cloud.client.removeChannel(cloud.channel); cloud.channel = null; }
  clearSession();
  session = null;
  clearVoiceToken();
  state = emptyCloudState();
  cloud.synced = {};
  cloud.raw = {};
  cloud.pdfCache.clear();
  cloud.mfa = null;
  cloud.phase = 'login';
  cloud.error = message;
  closeAllModals();
  cloudRenderGate();
}

async function cloudLogout(message = 'Ви вийшли з облікового запису') {
  try { await cloudClient().auth.signOut(); } catch { /* ignore */ }
  cloudResetToLogin('');
  if (message) toast(message, 'info');
}

function cloudRenderGate() {
  destroyCharts();
  closeStatusMenu();
  $('#app').hidden = true;
  const auth = $('#auth');
  auth.hidden = false;
  const fail = cloud.error ? `<p class="auth__error" id="login-error" role="alert">${esc(cloud.error)}</p>` : '<p class="auth__error" id="login-error" role="alert" hidden></p>';
  if (cloud.phase === 'starting' || cloud.phase === 'loading') {
    document.title = 'Student Government';
    authShell(`<div class="boot-state"><span class="boot-state__icon is-spinning">${icon('loader')}</span>
      <h1 class="auth__title">${cloud.phase === 'loading' ? 'Завантажую дані…' : 'Підключаюся…'}</h1>
      <p class="auth__sub">Спільна база самоврядування</p></div>`);
    return;
  }
  if (cloud.phase === 'error') {
    authShell(`<h1 class="auth__title">Немає звʼязку</h1><p class="auth__sub">${esc(cloud.error)}</p>`);
    return;
  }
  if (cloud.phase === 'login') {
    document.title = 'Вхід · Student Government';
    authShell(`
      <h1 class="auth__title">Вхід до кабінету</h1>
      <p class="auth__sub">Увійдіть своєю поштою та паролем, який видав арт-менеджер.</p>
      <form class="form" id="cloud-login-form" novalidate>
        <div class="field">
          <label for="l-login">Пошта</label>
          <div class="input-icon">${icon('at-sign')}<input class="input" id="l-login" name="login" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="прізвище.і@${LOGIN_DOMAIN}" value="${esc(cloud.email)}" required></div>
        </div>
        <div class="field">
          <label for="l-password">Пароль</label>
          <div class="input-icon">${icon('lock')}<input class="input input--pass" id="l-password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="icon-btn icon-btn--sm input-action" data-action="toggle-password" aria-label="Показати пароль" title="Показати пароль">${icon('eye')}</button></div>
        </div>
        <label class="checkbox"><input type="checkbox" name="remember"><span aria-hidden="true"></span>Запамʼятати мене на цьому пристрої</label>
        ${fail}
        <button type="submit" class="btn btn--gold btn--lg btn--block">${icon('log-in')}<span>Увійти</span></button>
      </form>
      <p class="auth__foot">${icon('shield-check')}<span>Доступ для членів учнівського самоврядування та адміністрації школи. Після пароля — код 2FA із застосунку-автентифікатора. Забули пароль? Зверніться до арт-менеджера.</span></p>`);
    setTimeout(() => { const el = cloud.email ? $('#l-password') : $('#l-login'); if (el) el.focus(); }, 60);
    return;
  }
  if (cloud.phase === 'mfa') {
    document.title = '2FA · Student Government';
    const m = cloud.mfa;
    authShell(m.enrolling ? `
      <h1 class="auth__title">Підключіть 2FA</h1>
      <p class="auth__sub">Без другого фактора вхід неможливий. Відскануйте QR-код у Google Authenticator, Microsoft Authenticator або 2FAS і введіть 6-значний код.</p>
      <div class="twofa-qr"><img src="${esc(m.qr)}" alt="QR-код для застосунку-автентифікатора" width="192" height="192"></div>
      <p class="twofa-secret">Не сканується? Введіть ключ вручну:<br><code>${esc(groupSecret(m.secret))}</code></p>
      ${cloudOtpForm(fail)}` : `
      <h1 class="auth__title">Код підтвердження</h1>
      <p class="auth__sub">Відкрийте застосунок-автентифікатор і введіть 6-значний код для <b>${esc(cloud.email)}</b>.</p>
      ${cloudOtpForm(fail)}`);
    setTimeout(() => { const el = $('#otp-code'); if (el) el.focus(); }, 60);
    return;
  }
  if (cloud.phase === 'pick') {
    const mine = cloudMyAccounts();
    authShell(`
      <h1 class="auth__title">Оберіть посаду</h1>
      <p class="auth__sub">Ви обіймаєте кілька посад. Перемкнутися можна будь-коли в меню.</p>
      <div class="quick-login__grid post-picker">${mine.map((m) => `
        <button type="button" class="quick-login__item" data-action="cloud-pick" data-id="${m.id}">${avatar(m, 'sm')}
          <span class="quick-login__text"><b>${esc(m.position)}</b><small>${esc(m.name)}</small></span></button>`).join('')}</div>`);
  }
}

const cloudOtpForm = (fail) => `
  <form class="form" id="cloud-otp-form" novalidate>
    <div class="field">
      <label for="otp-code">Код 2FA</label>
      <div class="input-icon">${icon('smartphone')}<input class="input otp-input" id="otp-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" required></div>
    </div>
    ${fail}
    <button type="submit" class="btn btn--gold btn--lg btn--block">${icon('shield-check')}<span>Підтвердити</span></button>
  </form>
  <p class="auth__foot">${icon('info')}<span>Втратили телефон? Попросіть арт-менеджера скинути 2FA. <button type="button" class="link-btn" data-action="cloud-signout">Інший акаунт</button></span></p>`;

async function cloudHandleLogin(form) {
  const login = String(form.elements.login.value || '').trim().toLowerCase();
  const password = String(form.elements.password.value || '');
  if (!login || !password) { cloudShowError('Введіть пошту і пароль'); return; }
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    try { localStorage.setItem(CLOUD_REMEMBER_KEY, form.elements.remember.checked ? '1' : '0'); } catch { /* ignore */ }
    const { data, error } = await cloudClient().auth.signInWithPassword({ email: login, password });
    if (error) { cloudShowError(cloudErrorText(error)); form.elements.password.value = ''; form.elements.password.focus(); return; }
    cloud.email = data.user.email || login;
    cloud.error = '';
    await cloudAfterPassword();
  } finally {
    if (document.contains(btn)) btn.disabled = false;
  }
}

async function cloudVerifyOtp(form) {
  const code = String(form.elements.code.value || '').replace(/\D/g, '');
  if (code.length !== 6) { cloudShowError('Введіть 6 цифр коду'); return; }
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    const { error } = await cloudClient().auth.mfa.challengeAndVerify({ factorId: cloud.mfa.factorId, code });
    if (error) { cloudShowError(cloudErrorText(error)); form.elements.code.value = ''; form.elements.code.focus(); return; }
    const enrolled = cloud.mfa.enrolling;
    cloud.mfa = null;
    cloud.error = '';
    await cloudEnter();
    if (enrolled) toast('2FA підключено. Надалі після пароля вводьте код із застосунку.');
  } finally {
    if (document.contains(btn)) btn.disabled = false;
  }
}

function cloudShowError(message) {
  const box = $('#login-error');
  if (!box) return;
  box.textContent = message;
  box.hidden = false;
}

function cloudPick(id) {
  const target = cloudMyAccounts().find((m) => m.id === id);
  if (!target) return;
  saveSession(target.id, cloudStorage.target() === localStorage);
  resetViewState();
  cloud.phase = 'ready';
  history.replaceState(null, '', '#dashboard');
  render();
  toast(`Вітаємо, ${target.name}!`);
}

/* ---------- Акаунти: створення, паролі, 2FA (через функції бази) ---------- */

function showIssuedPassword(email, password, title = 'Пароль для нового акаунта') {
  const body = `
    <p class="settings-text">Передайте ці дані людині особисто (не в загальний чат). Пароль показується <b>лише зараз</b> — у базі зберігається тільки його хеш.</p>

    </div>

    <div class="modal__footer">
