async function cloudSaveAccount(minister, values, flags, modal) {
  try {
    if (!minister) {
      const res = await cloudRpc('admin_create_account', {
        p: { id: uid('m'), login: values.login, name: values.name, position: values.position, color: values.color, role: values.role, post: values.post || null, director: Boolean(values.director) },
      });
      logActivity('minister', `Створено акаунт: ${values.position} — ${values.name}`, res && res.id);
      closeModal(modal);
      await cloudLoadAllSafe();
      commit(res && res.password ? '' : 'Посаду привʼязано до наявного входу цієї людини');
      if (res && res.password) showIssuedPassword(values.login, res.password);
      return;
    }
    if (values.login !== minister.login) await cloudRpc('admin_change_login', { p_account: minister.id, p_login: values.login });
    const { login, ...rest } = values;
    Object.assign(minister, rest);
    if (values.role !== 'minister') delete minister.post;
    if (!minister.photo) delete minister.photo;
    if (!minister.photoConsent) delete minister.photoConsent;
    logActivity('minister', `Оновлено акаунт: ${values.position} — ${values.name}`, minister.id);
    closeModal(modal);
    commit('Акаунт збережено');
    if (flags.resetTotp) {
      await cloudRpc('admin_reset_mfa', { p_account: minister.id });
      toast('2FA скинуто — людина підключить її заново під час наступного входу', 'info');
    }
    if (flags.resetPassword) {
      const pw = await cloudRpc('admin_reset_password', { p_account: minister.id });
      showIssuedPassword(values.login, pw, 'Новий пароль');
    }
    if (values.login !== minister.login) await cloudLoadAllSafe();
  } catch (err) {
    toast(cloudErrorText(err), 'error');
    await cloudLoadAllSafe();
    render();
  }
}

async function cloudDeleteAccount(minister) {
  try {
    await cloudRpc('admin_delete_account', { p_account: minister.id });
    logActivity('delete', `Видалено посаду «${minister.position}»`, minister.id);
    await cloudLoadAllSafe();
    if (location.hash === `#${ministerRoute(minister.id)}`) navigate('ministers'); else render();
    toast('Акаунт видалено');
  } catch (err) {
    toast(cloudErrorText(err), 'error');
  }
}

async function cloudChangePassword(form) {
  const user = currentUser();
  const current = String(form.elements.current.value || '');
  const next = String(form.elements.next.value || '');
  const confirm = String(form.elements.confirm.value || '');
  const errors = {};
  const policy = passwordPolicyError(next, user);
  if (!current) errors.current = 'Введіть поточний пароль';
  if (policy) errors.next = policy;
  else if (next === current) errors.next = 'Новий пароль має відрізнятися від поточного';
  if (!errors.next && next !== confirm) errors.confirm = 'Паролі не збігаються';
  setFieldErrors(form, errors);
  if (Object.keys(errors).length) return;
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    // перевіряємо поточний пароль окремим клієнтом, щоб не зачепити робочу сесію
    const probe = window.supabase.createClient(CLOUD_CFG.supabaseUrl.replace(/\/$/, ''), CLOUD_CFG.supabaseKey, { auth: { persistSession: false, autoRefreshToken: false } });
    const check = await probe.auth.signInWithPassword({ email: cloud.email, password: current });
    if (check.error) { setFieldErrors(form, { current: 'Поточний пароль невірний' }); return; }
    await probe.auth.signOut().catch(() => {});
    const { error } = await cloudClient().auth.updateUser({ password: next });
    if (error) { setFieldErrors(form, { next: cloudErrorText(error) }); return; }
    form.reset();
    logActivity('minister', 'Змінено пароль', user.id);
    commit('Пароль змінено');
  } finally {
    if (document.contains(btn)) btn.disabled = false;
  }
}

/* STUDENT VOICE у кабінеті: ідеї з таблиці ideas */
async function cloudVoiceCall(request) {
  if (request.action === 'login') return { ok: true, token: 'cloud', expiresIn: 86400 };
  if (request.action === 'logout') return { ok: true };
  const toIdea = (r) => ({
    id: r.id, date: (r.created_at || '').replace('T', ' ').slice(0, 16), title: r.title, category: r.category, description: r.description,
    problem: r.problem, how: r.how, resources: r.resources, author: r.author, klass: r.klass, anonymous: r.anonymous,
    moderation: r.moderation, review: r.review, minister: r.minister, comment: r.comment, flags: r.flags, updated: (r.updated_at || '').replace('T', ' ').slice(0, 16),
  });
  if (request.action === 'list') {
    const { data, error } = await cloudClient().from('ideas').select('*').order('created_at', { ascending: false }).limit(3000);
    if (error) return { ok: false, error: cloudErrorText(error) };
    return { ok: true, ideas: data.map(toIdea) };
  }
  if (request.action === 'update') {
    const { data, error } = await cloudClient().from('ideas').update(request.changes).eq('id', request.id).select('*');
    if (error) return { ok: false, error: cloudErrorText(error) };
    if (!data || !data.length) return { ok: false, error: 'Немає прав змінювати цю ідею' };
    return { ok: true, idea: toIdea(data[0]) };
  }
  return { ok: false, error: 'Невідома дія' };
}

    ['m_culture', 'Конкурс осінньої фотографії', -3, 'progress',
      'Оголосити умови конкурсу.\nЗібрати роботи учасників.\nОрганізувати голосування та виставку.'],

    ['m_ecosport', 'Турнір з міні-футболу між класами', 9, 'progress',
      'Зібрати заявки від класів.\nСкласти турнірну сітку.\nДомовитися про спортзал і суддівство.'],
    ['m_volunteer', 'Благодійний ярмарок', 12, 'planned',
      'Визначити мету збору.\nРозподілити столи між класами.\nПідготувати оголошення та скриньку для коштів.'],
    ['m_edu', 'Тиждень англійської мови', 16, 'planned',
      'Скласти програму на 5 днів.\nЗалучити вчителів англійської.\nПідготувати квіз і нагороди.'],
    ['m_pm', 'Оновлення положення про учнівське самоврядування', 23, 'planned',
      'Зібрати зауваження до чинного положення.\nПідготувати проєкт змін.\nВинести на голосування кабінету.'],

  return applyTaskExtras(rows.map(([ministerId, title, offset, status, plan], i) => {

    return {

      title,

      status,
      plan,

      demo: true,

  }).map((task) => (task.title === 'Новорічний концерт'
    ? { ...task, tzRequired: true, tzRequestedBy: 'm_president' }
    : task)).concat(cosplayDemoTask('m_culture')));
}

/** Демо-сповіщення: ТЗ «Cosplay Fest» надіслано арт-менеджерам, а для концерту ТЗ ще чекають. */
function seedNotifications(tasks) {
  const list = [];
  const cosplay = tasks.find((t) => t.title === 'Cosplay Fest' && t.demo);
  if (cosplay) {
    list.push({
      id: uid('n'), type: 'tz-submitted', taskId: cosplay.id, text: 'Прикріплено ТЗ до «Cosplay Fest»',
      ts: Date.now() - 40 * 60000, to: ['m_art_lev', 'm_art_valeria'], readBy: [],
      actorId: cosplay.ministerId, by: 'Міністр культури — Грушицька Б.',
    });
  }
  const concert = tasks.find((t) => t.title === 'Новорічний концерт' && t.demo && t.tzRequired);
  if (concert && concert.ministerId) {
    list.push({
      id: uid('n'), type: 'tz-requested', taskId: concert.id, text: 'Потрібно прикріпити ТЗ до «Новорічний концерт»',
      ts: Date.now() - 3 * 3600000, to: [concert.ministerId], readBy: [],
      actorId: 'm_president', by: 'Президент — Шаловінський Я.',
    });
  }
  const fair = tasks.find((t) => t.title === 'Благодійний ярмарок' && t.demo && t.approval && t.approval.status === 'pending');
  if (fair) {
    list.push({
      id: uid('n'), type: 'approval-request', taskId: fair.id, text: 'Потрібне погодження: «Благодійний ярмарок»',
      ts: Date.now() - 20 * 3600000, to: ['m_school_director', 'm_school_pysarets', 'm_school_rakhmanova', 'm_art_lev', 'm_art_valeria'], readBy: [],
      actorId: 'm_volunteer', by: 'Міністр волонтерства та благодійності — Надєїна М.',
    });
  }
  return list;
}

function createSeedState(settings = defaultSettings()) {
  const tasks = seedTasks();
  return normalizeState({
    version: DATA_VERSION,
    settings,
    ministers: applyTeams([...seedManagers(), ...seedSchool(), ...seedMinisters()]),
    tasks,
    notifications: seedNotifications(tasks),
    drafts: seedDrafts(),
    plans: seedPlans(),
    reports: seedReports(),
    seedVersion: SEED_VERSION,
    activity: [{
      id: uid('a'),
      type: 'system',
      text: 'Завантажено демонстраційні дані. Замініть їх реальними завданнями кабінету.',
      ts: Date.now(),
    }],
    demoBannerHidden: false,
  });
}

/** Перевіряє та «очищує» дані (з LocalStorage або імпортованого файлу). */
function normalizeState(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.tasks) || !Array.isArray(raw.ministers)) return null;

  const usedLogins = new Set();
  const loginOwner = new Map(); // логін → імʼя: спільний логін дозволено лише для тієї самої людини
  const seedVer = Number(raw.seedVersion) || 1;
  const ministers = raw.ministers
    .filter((m) => m && typeof m.name === 'string' && typeof m.position === 'string' && m.name.trim())
    .map((m, i) => {
      const position = m.position.trim().slice(0, 120);
      let login = typeof m.login === 'string' ? m.login.trim().toLowerCase() : '';
      const upd = seedVer < 6 && LOGIN_UPDATES_V6[m.id];
      if (upd && login === upd[0]) login = upd[1];
      const nameKey = m.name.trim().toLowerCase();
      if (!isValidEmail(login) || (usedLogins.has(login) && loginOwner.get(login) !== nameKey)) login = suggestLogin(position, usedLogins);
      usedLogins.add(login);
      loginOwner.set(login, nameKey);
      return {
        id: String(m.id || uid('m')),
        name: m.name.trim().slice(0, 80),
        position,
        color: /^#[0-9a-f]{6}$/i.test(m.color) ? m.color : PALETTE[i % PALETTE.length],
        login,
        ...accountRole(m, position),
        demo: m.demo === true,
        ...(Array.isArray(m.team) && m.role !== 'manager' && m.role !== 'school' ? { team: normalizeTeam(m.team) } : {}),
        ...(typeof m.photo === 'string' && m.photo.length < 400000 && PHOTO_PATTERN.test(m.photo) ? { photo: m.photo } : {}),
        ...(isValidPasswordRecord(m.passwordHash) ? { passwordHash: m.passwordHash } : {}),
        ...(m.totp && typeof m.totp === 'object' && /^[A-Z2-7]{32}$/.test(m.totp.secret)
          ? { totp: { secret: m.totp.secret, enabledAt: Number(m.totp.enabledAt) || Date.now(), lastStep: Number(m.totp.lastStep) || 0 } } : {}),
        ...(m.photoConsent && typeof m.photoConsent === 'object' && Number(m.photoConsent.ts)
          ? { photoConsent: { by: String(m.photoConsent.by || ''), ts: Number(m.photoConsent.ts) } } : {}),
      };
    });

  // Міграція: у даних зі старішої версії ще немає демо-акаунтів арт-менеджерів
  const seedVersion = Number(raw.seedVersion) || 1;
  if (seedVersion < 2) {
    const ids = new Set(ministers.map((m) => m.id));
    seedManagers()
      .filter((m) => !ids.has(m.id) && !usedLogins.has(m.login))
      .reverse()
      .forEach((m) => { ministers.unshift(m); usedLogins.add(m.login); });
  }

  // Посади з одним логіном — одна людина: пароль і 2FA спільні (беремо з першої посади)
  ministers.forEach((m) => {
    const first = ministers.find((x) => x.login === m.login);
    if (first === m) return;
    if (first.passwordHash) m.passwordHash = first.passwordHash; else delete m.passwordHash;
    if (first.totp) m.totp = { ...first.totp }; else delete m.totp;
  });

  // Міграція v5 (статут): акаунти адміністрації школи та імена посад за статутом
  if (seedVersion < 5) {
    const ids = new Set(ministers.map((m) => m.id));
    seedSchool()
      .filter((m) => !ids.has(m.id) && !usedLogins.has(m.login))
      .forEach((m) => { ministers.push({ ...m, ...accountRole(m, m.position), demo: false }); usedLogins.add(m.login); });
    const fixes = { 'Надєіна М.': 'Надєїна М.', 'Грущицька Б.': 'Грушицька Б.' };
    ministers.forEach((m) => { if (fixes[m.name]) m.name = fixes[m.name]; });
    applyTeams(ministers.filter((m) => m.role === 'minister'));
  }

  const ministerIds = new Set(ministers.map((m) => m.id));

  const tasks = raw.tasks
    .filter((t) => t && typeof t.title === 'string' && t.title.trim() && isValidISO(t.date))
    .map((t) => {
      const status = EDITABLE_STATUSES.includes(t.status) ? t.status : 'planned';
      const createdAt = Number(t.createdAt) || Date.now();
      return {
        id: String(t.id || uid('t')),
        title: t.title.trim().slice(0, 200),
        ministerId: ministerIds.has(t.ministerId) || t.ministerId === ALL_ID ? t.ministerId : null,
        date: t.date,
        status,
        plan: typeof t.plan === 'string' ? t.plan.slice(0, 4000) : '',
        docLink: typeof t.docLink === 'string' && isSafeUrl(t.docLink) ? t.docLink : '',
        ...(normalizeAttachment(t.attachment) ? { attachment: normalizeAttachment(t.attachment) } : {}),
        tzRequired: t.tzRequired === true,
        tzRequestedBy: typeof t.tzRequestedBy === 'string' ? t.tzRequestedBy : null,
        createdBy: typeof t.createdBy === 'string' && ministerIds.has(t.createdBy) ? t.createdBy : null,
        initiative: t.initiative === true,
        helpers: (Array.isArray(t.helpers) ? t.helpers : []).filter((id, i, arr) => ministerIds.has(id) && id !== t.ministerId && arr.indexOf(id) === i).slice(0, 10),
        approval: normalizeApproval(t.approval, ministerIds),
        demo: Boolean(t.demo),
        createdAt,
        updatedAt: Number(t.updatedAt) || createdAt,
        completedAt: status === 'done' ? (Number(t.completedAt) || Number(t.updatedAt) || createdAt) : null,
      };
    });

  // Міграція: демо-івент «Cosplay Fest» з прикладом PDF-ТЗ
  if (seedVersion < 3 && !tasks.some((t) => t.title === 'Cosplay Fest')) {
    const owner = ministerIds.has('m_culture') ? 'm_culture' : (ministers.find((m) => m.role !== 'manager') || {}).id || null;
    tasks.push(cosplayDemoTask(owner));
    const concert = tasks.find((t) => t.title === 'Новорічний концерт' && t.demo && !t.attachment && !t.docLink);
    if (concert) Object.assign(concert, { tzRequired: true, tzRequestedBy: ministerIds.has('m_president') ? 'm_president' : null });
  }

  const settings = defaultSettings();
  if (raw.settings && typeof raw.settings === 'object') {
    Object.keys(settings).forEach((key) => {
      if (typeof settings[key] === 'boolean') {
        if (typeof raw.settings[key] === 'boolean') settings[key] = raw.settings[key];
      } else if (key === 'voiceUrl') {
        if (isVoiceUrl(raw.settings.voiceUrl)) settings.voiceUrl = raw.settings.voiceUrl.trim();
      } else if (typeof raw.settings[key] === 'string' && raw.settings[key].trim()) {
        settings[key] = raw.settings[key].trim().slice(0, 120);
      }
    });
  }

  const activity = Array.isArray(raw.activity)
    ? raw.activity
      .filter((a) => a && typeof a.text === 'string')
      .slice(0, 150)
      .map((a) => ({
        id: String(a.id || uid('a')),
        type: ACTIVITY_META[a.type] ? a.type : 'system',
        text: a.text.slice(0, 300),
        ts: Number(a.ts) || Date.now(),
        by: typeof a.by === 'string' ? a.by.slice(0, 80) : '',
        actorId: typeof a.actorId === 'string' ? a.actorId : null,
        ownerId: typeof a.ownerId === 'string' ? a.ownerId : null,
      }))
    : [];

  if (seedVersion < 5) applyTaskExtras(tasks);

  const cabinetIds = new Set(ministers.filter((m) => m.role === 'minister').map((m) => m.id));
  const plans = (Array.isArray(raw.plans) ? raw.plans : seedVersion < 5 ? seedPlans() : [])
    .filter((x) => x && cabinetIds.has(x.ownerId) && /^\d{4}-q[1-4]$/.test(x.period) && PLAN_STATUS[x.status] && x.status !== 'none')
    .slice(0, 1000)
    .map((x) => ({
      id: String(x.id || uid('p')), ownerId: x.ownerId, period: x.period,
      text: typeof x.text === 'string' ? x.text.slice(0, 4000) : '', status: x.status,
      comment: typeof x.comment === 'string' ? x.comment.slice(0, 1000) : '',
      reviewedBy: typeof x.reviewedBy === 'string' ? x.reviewedBy : null, reviewedAt: Number(x.reviewedAt) || null,
      submittedAt: Number(x.submittedAt) || null, updatedAt: Number(x.updatedAt) || Date.now(), demo: Boolean(x.demo),
    }));
  const reports = (Array.isArray(raw.reports) ? raw.reports : seedVersion < 5 ? seedReports() : [])
    .filter((x) => x && cabinetIds.has(x.ownerId) && /^\d{4}-\d{2}$/.test(x.month) && REPORT_STATUS[x.status] && x.status !== 'none')
    .slice(0, 3000)
    .map((x) => ({
      id: String(x.id || uid('r')), ownerId: x.ownerId, month: x.month,
      done: typeof x.done === 'string' ? x.done.slice(0, 3000) : '',
      problems: typeof x.problems === 'string' ? x.problems.slice(0, 3000) : '',
      next: typeof x.next === 'string' ? x.next.slice(0, 3000) : '',
      status: x.status, comment: typeof x.comment === 'string' ? x.comment.slice(0, 1000) : '',
      reviewedBy: typeof x.reviewedBy === 'string' ? x.reviewedBy : null, reviewedAt: Number(x.reviewedAt) || null,
      submittedAt: Number(x.submittedAt) || null, updatedAt: Number(x.updatedAt) || Date.now(), demo: Boolean(x.demo),
    }));

  const taskIds = new Set(tasks.map((t) => t.id));
  const accountIds = new Set(ministers.map((m) => m.id));
  const refIds = { plan: new Set(plans.map((x) => x.id)), report: new Set(reports.map((x) => x.id)) };
  const validRef = (r) => Boolean(r && typeof r === 'object' && refIds[r.kind] && refIds[r.kind].has(r.id));
  const notifications = (Array.isArray(raw.notifications) ? raw.notifications : [])
    .filter((n) => n && typeof n.text === 'string' && (taskIds.has(n.taskId) || validRef(n.ref)))
    .slice(0, 200)
    .map((n) => ({
      id: String(n.id || uid('n')),
      type: NOTIF_META[n.type] ? n.type : 'tz-submitted',
      taskId: taskIds.has(n.taskId) ? n.taskId : null,
      ...(validRef(n.ref) ? { ref: { kind: n.ref.kind, id: n.ref.id } } : {}),
      text: n.text.slice(0, 300),
      ts: Number(n.ts) || Date.now(),
      to: (Array.isArray(n.to) ? n.to : []).filter((id) => accountIds.has(id)),
      readBy: (Array.isArray(n.readBy) ? n.readBy : []).filter((id) => typeof id === 'string'),
      actorId: typeof n.actorId === 'string' ? n.actorId : null,
      by: typeof n.by === 'string' ? n.by.slice(0, 120) : '',
    }));
  if (seedVersion < 3 && !notifications.length) {
    seedNotifications(tasks).forEach((n) => {
      n.to = n.to.filter((id) => accountIds.has(id));
      if (n.to.length) notifications.push(n);
    });
  }

  const drafts = (Array.isArray(raw.drafts) ? raw.drafts : [])
    .filter((d) => d && typeof d.title === 'string' && d.title.trim() && accountIds.has(d.ownerId))
    .slice(0, 500)
    .map((d) => ({
      id: String(d.id || uid('d')),
      ownerId: d.ownerId,
      title: d.title.trim().slice(0, 200),
      text: typeof d.text === 'string' ? d.text.slice(0, 4000) : '',
      wishDate: isValidISO(d.wishDate) ? d.wishDate : '',
      demo: Boolean(d.demo),
      createdAt: Number(d.createdAt) || Date.now(),
      updatedAt: Number(d.updatedAt) || Number(d.createdAt) || Date.now(),
    }));
  // Міграція v4: демо-чернетки та зустріч з адміністрацією для всього кабінету
  if (seedVersion < 4) {
    if (!drafts.length) seedDrafts().filter((d) => accountIds.has(d.ownerId)).forEach((d) => drafts.push(d));
    const meeting = tasks.find((t) => t.demo && t.title === 'Зустріч з адміністрацією школи');
    if (meeting) meeting.ministerId = ALL_ID;
  }

  return {
    version: DATA_VERSION,
    seedVersion: Math.max(seedVersion, SEED_VERSION),
    settings, ministers, tasks, activity, notifications, drafts, plans, reports,
    demoBannerHidden: Boolean(raw.demoBannerHidden),
  };
}

/** Роль акаунта: арт-менеджер, адміністрація школи або посада кабінету (Президент, Премʼєр, міністр). */
function accountRole(m, position) {
  if (m.role === 'manager') return { role: 'manager', isAdmin: true };
  if (m.role === 'school') return { role: 'school', isAdmin: false, ...(m.director === true ? { director: true } : {}) };
  let post = ['president', 'premier', 'minister'].includes(m.post) ? m.post : null;
  if (!post) post = /^президент/i.test(position) ? 'president' : /прем/i.test(position) ? 'premier' : 'minister';
  return { role: 'minister', post, isAdmin: post !== 'minister' };
}

function normalizeTeam(list) {
  return list
    .filter((p) => p && typeof p.name === 'string' && p.name.trim())
    .slice(0, 40)
    .map((p) => ({
      id: String(p.id || uid('s')),
      name: p.name.trim().slice(0, 60),
      klass: typeof p.klass === 'string' ? p.klass.trim().slice(0, 10) : '',
      role: typeof p.role === 'string' ? p.role.trim().slice(0, 60) : '',
      demo: Boolean(p.demo),
    }));
}

function normalizeApproval(a, ids) {
  if (!a || typeof a !== 'object' || !APPROVAL_STATUS[a.status]) return null;
  const who = (id) => (typeof id === 'string' && ids.has(id) ? id : null);
  return {
    status: a.status,
    requestedBy: who(a.requestedBy), requestedAt: Number(a.requestedAt) || Date.now(),
    decidedBy: a.status === 'pending' ? null : who(a.decidedBy), decidedAt: a.status === 'pending' ? null : Number(a.decidedAt) || null,
    comment: typeof a.comment === 'string' ? a.comment.slice(0, 1000) : '',
  };
}

const NOTIF_META = {
  'tz-submitted':      { icon: 'file-check',      tone: 'done' },
  'tz-requested':      { icon: 'file-warning',    tone: 'gold' },
  'approval-request':  { icon: 'stamp',           tone: 'gold' },
  'approval-decision': { icon: 'gavel',           tone: 'progress' },
  'plan-submitted':    { icon: 'map',             tone: 'gold' },
  'plan-reviewed':     { icon: 'badge-check',     tone: 'done' },

  'report-reviewed':   { icon: 'badge-check',     tone: 'done' },

};

function normalizeAttachment(a) {
  if (a && typeof a === 'object' && !a.data && typeof a.path === 'string' && /^[A-Za-z0-9_-]{2,60}\/[A-Za-z0-9_-]{2,60}\.pdf$/.test(a.path)) {
    return { name: typeof a.name === 'string' && a.name.trim() ? a.name.trim().slice(0, 120) : 'TZ.pdf', size: Number(a.size) || 0, path: a.path };
  }
  if (!a || typeof a !== 'object' || typeof a.data !== 'string') return null;
  if (a.data.length > ATTACH_MAX_CHARS || !PDF_PATTERN.test(a.data)) return null;
  const name = typeof a.name === 'string' && a.name.trim() ? a.name.trim().slice(0, 120) : 'TZ.pdf';
  return { name, size: Number(a.size) || Math.round(a.data.length * 0.75), data: a.data };
}

function readStorage(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}

function loadState() {
  if (CLOUD) return emptyCloudState(); // робоча версія: дані приходять із бази після входу
  const raw = readStorage(STORAGE_KEY);
  if (raw) {
    try {
      const parsed = normalizeState(JSON.parse(raw));
      if (parsed) return parsed;
    } catch (err) {
      console.warn('Пошкоджені дані в LocalStorage, завантажено демо-дані.', err);
    }
  }
  return createSeedState();
}

function saveState(silent = false) {
  if (CLOUD) { cloudQueueSync(); return true; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch (err) {
    console.error(err);
    if (!silent) toast('Не вдалося зберегти дані в браузері. Перевірте вільне місце або вимкніть режим інкогніто.', 'error');
    return false;
  }
}

/** Налаштування інтерфейсу зберігаються окремо для кожного облікового запису. */
function loadPrefs() {
  try {
    const parsed = JSON.parse(readStorage(PREFS_KEY) || '{}');
    return parsed && parsed.users && typeof parsed.users === 'object' ? parsed : { users: {} };
  } catch {
    return { users: {} };
  }
}

function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch { /* не критично */ }
}

function userPref(key, fallback) {
  const user = currentUser();
  const own = user && prefs.users[user.id];
  return own && own[key] !== undefined ? own[key] : fallback;
}

function setUserPref(key, value) {
  const user = currentUser();
  if (!user) return;
  prefs.users[user.id] = { ...(prefs.users[user.id] || {}), [key]: value };
  savePrefs();
}

/* ---------- 4. Вхід і права доступу ---------- */

function loadSession() {
  try {
    const remembered = localStorage.getItem(SESSION_KEY);
    const raw = remembered || sessionStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed.ministerId !== 'string') return null;
    // «Запамʼятати мене» діє 14 днів від входу, потім треба увійти знову
    if (remembered && !(Number(parsed.ts) && Date.now() - parsed.ts < SESSION_REMEMBER_MS)) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return { ministerId: parsed.ministerId, remember: Boolean(remembered) };
  } catch {
    return null;
  }
}

function clearSession() {
  try {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
  } catch { /* ignore */ }
}

function saveSession(ministerId, remember) {
  clearSession();
  try {
    (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify({ ministerId, ts: Date.now() }));
  } catch { /* сесія діятиме до перезавантаження */ }
  session = { ministerId, remember: Boolean(remember) };
  lastActivity = Date.now();
}

/* Автоматичний вихід після 30 хв бездіяльності, якщо не обрано «Запамʼятати мене» */
let lastActivity = Date.now();
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((type) => {

});

function currentUser() {

/*
 * Ролі за статутом АІК A+:
 *   арт-менеджер        — керує самоврядуванням (усі права, акаунти, фото, дані);
 *   адміністрація школи — бачить усе, погоджує масштабні заходи, приймає звіти;
 *   Президент           — очолює кабінет: усі завдання, затвердження планів, звіти, посади кабінету;
 *   Премʼєр-міністр     — координує міністерства: завдання й терміни всіх, крім Президента;
 *   міністр             — веде своє міністерство: завдання, план, звіт, команду, чернетки.
 */
const isAdmin = () => Boolean(currentUser() && currentUser().isAdmin);
const isManager = (account) => Boolean(account && account.role === 'manager');
const isSchool = (account) => Boolean(account && account.role === 'school');
/** Не посада кабінету: арт-менеджер або адміністрація школи. */
const isStaff = (account) => isManager(account) || isSchool(account);
const postOf = (account) => (account && !isStaff(account) ? account.post || 'minister' : null);
const isPresident = (account) => postOf(account) === 'president';
const isPremier = (account) => postOf(account) === 'premier';

/** Посади кабінету міністрів (без арт-менеджерів і адміністрації). */
const cabinetMembers = () => state.ministers.filter((m) => !isStaff(m));
const managers = () => state.ministers.filter(isManager);
const schoolStaff = () => state.ministers.filter(isSchool);

/** Єдина перевірка прав. target — завдання, звіт або акаунт, якщо дія стосується конкретного запису. */
function can(action, target = null, user = currentUser()) {
  if (!user) return false;
  const mgr = isManager(user);
  const school = isSchool(user);
  const pres = isPresident(user);
  const prem = isPremier(user);
  switch (action) {
    case 'see-cabinet':
    case 'see-all-reports':
    case 'see-ministers':
    case 'assign-any': return mgr || school || pres || prem;
    case 'require-tz': return mgr || pres;
    case 'approve': return mgr || school;
    case 'review-plan': return mgr || pres;
    case 'review-report': return (mgr || school || pres) && !(target && target.ownerId === user.id);
    case 'edit-team': return Boolean(target) && !isStaff(target) && target.id === user.id; // лише сам міністр
    case 'manage-data': return mgr || pres;
    default: return false;
  }
}

/** Кому користувач може призначати завдання. */
function assignableFor(user = currentUser()) {
  if (!user) return [];
  if (isManager(user) || isSchool(user) || isPresident(user)) return cabinetMembers();
  if (isPremier(user)) return cabinetMembers().filter((m) => !isPresident(m));
  return [user];
}

/** Арт-менеджер керує всіма акаунтами; Президент — посадами кабінету. */
function canManageAccount(account) {
  const user = currentUser();
  if (!user || !account) return false;
  if (isManager(user)) return true;
  return isPresident(user) && !isStaff(account);
}

function roleLabel(account) {
  if (isManager(account)) return 'арт-менеджер';
  if (isSchool(account)) return account.director ? 'директор школи' : 'адміністрація школи';
  if (isPresident(account)) return 'Президент';
  if (isPremier(account)) return 'Премʼєр-міністр';
  return 'міністр';
}

/** Хто змінює завдання: див. матрицю прав у розділі «Статут». */
function canEditTask(task, user = currentUser()) {
  if (!user || !task) return false;
  if (isManager(user) || isPresident(user)) return true;
  if (isSchool(user)) return task.createdBy === user.id;
  if (isPremier(user)) {
    const owner = getMinister(task.ministerId);
    return !(owner && isPresident(owner)) || task.createdBy === user.id;
  }
  return task.ministerId === user.id;
}

/**
 * Особистий простір: кожен бачить лише свої завдання, календар, аналітику та історію.
 * Президент і Премʼєр можуть перемкнутися на огляд усього кабінету.
 */
function scope() {
  const user = currentUser();
  if (isStaff(user)) return 'cabinet'; // арт-менеджер і адміністрація завжди бачать усе самоврядування
  if (!user || !user.isAdmin) return 'own';
  return userPref('scope', 'own') === 'cabinet' ? 'cabinet' : 'own';
}

const isCabinetView = () => scope() === 'cabinet';

/** Завдання стосується посади: вона відповідальна, це завдання для всіх або вона допомагає. */
const involves = (task, account) => Boolean(isAssignedTo(task, account) || (account && (task.helpers || []).includes(account.id)));

function visibleTasks() {
  const user = currentUser();
  if (!user) return [];
  return isCabinetView() ? state.tasks : state.tasks.filter((t) => involves(t, user));
}

function visibleActivity() {
  const user = currentUser();

  if (isCabinetView()) return state.activity;

const hasTz = (t) => Boolean(t.attachment || t.docLink);
/** ТЗ обовʼязкове, але ще не прикріплене. */

function notify(type, task, text, recipients, ref = null) {

  if (!to.length) return 0;
  state.notifications.unshift({
    id: uid('n'), type, taskId: task ? task.id : null, ...(ref ? { ref } : {}), text, ts: Date.now(), to, readBy: [],
    actorId: user ? user.id : null, by: user ? `${user.position} — ${user.name}` : '',
  });
  if (state.notifications.length > 200) state.notifications.length = 200;

}

function myNotifications() {
  const user = currentUser();
  if (!user) return [];
  return state.notifications.filter((n) => n.to.includes(user.id) && (n.taskId ? getTask(n.taskId) : refTarget(n.ref)));
}

function refTarget(ref) {
  if (!ref) return null;
  if (ref.kind === 'plan') return state.plans.find((x) => x.id === ref.id) || null;
  if (ref.kind === 'report') return state.reports.find((x) => x.id === ref.id) || null;
  return null;
}

const isUnread = (n) => !n.readBy.includes(currentUser().id);
const unreadCount = () => myNotifications().filter(isUnread).length;

function markRead(ids) {
  const user = currentUser();
  let changed = false;
  state.notifications.forEach((n) => {
    if (ids.includes(n.id) && n.to.includes(user.id) && !n.readBy.includes(user.id)) {
      n.readBy.push(user.id);
      changed = true;
    }
  });
  if (changed) saveState();
  return changed;
}

function pruneNotifications() {
  const ids = new Set(state.tasks.map((t) => t.id));
  state.notifications = state.notifications.filter((n) => (n.taskId ? ids.has(n.taskId) : refTarget(n.ref)));
}

function requireTaskAccess(task) {

  return false;
}

/* ---------- 5. Обчислення ---------- */

const getTask = (id) => state.tasks.find((t) => t.id === id);
const getMinister = (id) => state.ministers.find((m) => m.id === id) || null;
/** Відповідальний для показу: конкретна посада або «Усі міністри». */
const getAssignee = (id) => (id === ALL_ID ? ALL_ASSIGNEE : getMinister(id));
/** Чи стосується завдання цієї посади (власне або для всього кабінету). */
const isAssignedTo = (task, account) => Boolean(account && (task.ministerId === account.id || (task.ministerId === ALL_ID && !isStaff(account))));

/** Фактичний статус: незавершене завдання з минулим дедлайном — «Прострочено». */
function effectiveStatus(task) {
  if (task.status === 'done') return 'done';
  if (task.date < todayISO()) return 'overdue';
  return task.status;
}

function computeStats(list) {
  const s = { total: list.length, done: 0, progress: 0, planned: 0, overdue: 0 };
  list.forEach((t) => { s[effectiveStatus(t)] += 1; });
  s.percent = s.total ? Math.round((s.done / s.total) * 100) : 0;
  return s;
}

const ministerTasks = (id) => state.tasks.filter((t) => t.ministerId === id || t.ministerId === ALL_ID);

function ministerRanking() {
  return cabinetMembers()
    .map((m) => ({ m, s: computeStats(ministerTasks(m.id)) }))
    .sort((a, b) => (Number(b.s.total > 0) - Number(a.s.total > 0))
      || (b.s.percent - a.s.percent)
      || (b.s.done - a.s.done)
      || (a.s.overdue - b.s.overdue));
}

function sortTasks(list, mode = 'date-asc') {
  const arr = [...list];
  if (mode === 'date-desc') arr.sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  else if (mode === 'created') arr.sort((a, b) => b.createdAt - a.createdAt);
  else if (mode === 'status') arr.sort((a, b) => STATUS_ORDER[effectiveStatus(a)] - STATUS_ORDER[effectiveStatus(b)] || a.date.localeCompare(b.date));
  else arr.sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
  return arr;
}

function getFilteredTasks() {
  const q = ui.search.trim().toLowerCase();
  const me = currentUser();
  const list = visibleTasks().filter((t) => {
    if (ui.filterMinister === 'mine' && !isAssignedTo(t, me)) return false;
    if (ui.filterMinister === 'none' && t.ministerId) return false;
    if (!['all', 'none', 'mine'].includes(ui.filterMinister) && t.ministerId !== ui.filterMinister) return false;
    // ui.filterMinister === ALL_ID показує лише завдання для всього кабінету — умова вище вже це робить
    if (ui.filterStatus === 'needs-tz') {
      if (!needsTz(t)) return false;
    } else if (ui.filterStatus !== 'all' && effectiveStatus(t) !== ui.filterStatus) return false;
    if (q) {
      const m = getAssignee(t.ministerId);
      const haystack = [t.title, t.plan, m && m.name, m && m.position, t.attachment && t.attachment.name].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
  return sortTasks(list, ui.sort);
}

/** Помісячна динаміка: дедлайни, виконані та прострочені завдання. */
function monthlyDynamics() {
  const tasks = visibleTasks();
  const now = new Date();
  const months = [];
  for (let i = -4; i <= 1; i += 1) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    const label = `${MONTHS_SHORT[d.getMonth()]}${d.getFullYear() !== now.getFullYear() ? ` ’${String(d.getFullYear()).slice(2)}` : ''}`;
    months.push({ key, label });
  }
  return {
    labels: months.map((m) => m.label),
    deadlines: months.map((m) => tasks.filter((t) => t.date.startsWith(m.key)).length),
    done: months.map((m) => tasks.filter((t) => t.completedAt && toISO(new Date(t.completedAt)).startsWith(m.key)).length),
    overdue: months.map((m) => tasks.filter((t) => effectiveStatus(t) === 'overdue' && t.date.startsWith(m.key)).length),
  };
}

/** Читає фото, обрізає до квадрата (для портретів — трохи вище центру) і стискає в JPEG. */
function processPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) {
      reject(new Error('Оберіть файл зображення — JPG, PNG або WebP'));
      return;
    }
    if (file.size > PHOTO_MAX_FILE) {
      reject(new Error('Файл завеликий — максимум 15 МБ'));
      return;
    }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      const side = Math.min(w, h);
      const sx = (w - side) / 2;
      const sy = h > w ? (h - side) * 0.3 : (h - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = PHOTO_SIZE;
      canvas.height = PHOTO_SIZE;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#17283D'; // фон для прозорих PNG
      ctx.fillRect(0, 0, PHOTO_SIZE, PHOTO_SIZE);
      ctx.drawImage(img, sx, sy, side, side, 0, 0, PHOTO_SIZE, PHOTO_SIZE);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.84));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Не вдалося відкрити зображення. Спробуйте JPG або PNG (формат HEIC з iPhone браузер може не підтримувати).'));
    };
    img.src = url;
  });
}

async function setAccountPhoto(id, file) {
  if (!isManager(currentUser())) {
    toast('Фото на аватарку може додавати лише арт-менеджер', 'error');
    return;
  }
  const account = getMinister(id);
  if (!account) return;
  try {
    const previous = account.photo;
    account.photo = await processPhoto(file);
    account.photoConsent = { by: currentUser().id, ts: Date.now() };
    if (!saveState()) {
      if (previous) account.photo = previous;
      else delete account.photo;
      return;
    }
    logActivity('minister', `${previous ? 'Оновлено' : 'Додано'} фото (згоду підтверджено): ${account.position} — ${account.name}`, account.id);
    commit(previous ? 'Фото оновлено' : 'Фото додано');
  } catch (err) {
    toast(err.message, 'error');
  }
}

function statusBadge(task, interactive = false) {
  const st = effectiveStatus(task);
  const meta = STATUSES[st];
  if (!interactive || !canEditTask(task)) {
    return `<span class="badge st--${st}">${icon(meta.icon)}${meta.label}</span>`;
  }
  return `
    <button type="button" class="badge st--${st}" data-action="status-menu" data-id="${task.id}"
      aria-haspopup="menu" title="Змінити статус">
      ${icon(meta.icon)}${meta.label}<i data-lucide="chevron-down" class="badge__chev"></i>
    </button>`;
}

const tzTag = (t) => (needsTz(t)
  ? `<span class="tag-tz" title="ТЗ обовʼязкове, але ще не прикріплене">${icon('file-warning')}Потрібне ТЗ</span>`
  : '');

const demoTag = () => `<span class="tag-demo" title="Демонстраційний запис — не реальне завдання">${icon('flask-conical')}Демо</span>`;

function taskActions(task) {
  if (!canEditTask(task)) {
    return `<span class="lock-icon" title="Лише перегляд — права див. у розділі «Статут»">${icon('lock')}</span>`;
  }
  const done = task.status === 'done';
  return `
    <div class="row-actions">
      <button type="button" class="icon-btn icon-btn--sm icon-btn--success" data-action="toggle-done" data-id="${task.id}"
        title="${done ? 'Повернути в роботу' : 'Позначити виконаним'}" aria-label="${done ? 'Повернути в роботу' : 'Позначити виконаним'}">
        ${icon(done ? 'rotate-ccw' : 'check')}
      </button>
      <button type="button" class="icon-btn icon-btn--sm" data-action="edit-task" data-id="${task.id}" title="Редагувати" aria-label="Редагувати">
        ${icon('pencil')}
      </button>
      <button type="button" class="icon-btn icon-btn--sm icon-btn--danger" data-action="delete-task" data-id="${task.id}" title="Видалити" aria-label="Видалити">
        ${icon('trash-2')}
      </button>
    </div>`;
}

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} Б`;
  if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} КБ`;
  return `${(bytes / 1024 / 1024).toFixed(1).replace('.', ',')} МБ`;
}

/** Короткі посилання на ТЗ у таблиці та картках. */
function tzLinks(t) {
  if (!t.docLink && !t.attachment) return '';
  return `
    <div class="doc-links">
      ${t.docLink ? `<a class="doc-link" href="${esc(t.docLink)}" target="_blank" rel="noopener noreferrer" data-action="open-link" title="Посилання на Google Docs (ТЗ)">${icon('file-text')}ТЗ (Google Docs)</a>` : ''}
      ${t.attachment ? `<button type="button" class="doc-link" data-action="view-pdf" data-id="${t.id}" title="${esc(t.attachment.name)}">${icon('file-type')}ТЗ (PDF)</button>` : ''}
    </div>`;
}

function emptyState({ iconName = 'inbox', title, text = '', action = '', small = false }) {
  return `
    <div class="empty ${small ? 'empty--sm' : ''}">
      <div class="empty__icon">${icon(iconName)}</div>
      <p class="empty__title">${title}</p>
      ${text ? `<p class="empty__text">${text}</p>` : ''}
      ${action}
    </div>`;
}

function cardHead(iconName, title, right = '') {
  return `
    <header class="card__head">
      <h2 class="card__title"><span class="card__icon">${icon(iconName)}</span>${title}</h2>
      ${right}
    </header>`;
}

function pageHead(title, sub, actions = '') {
  return `
    <header class="page-head">
      <div>
        <h1 class="page-title">${title}</h1>
        ${sub ? `<p class="page-sub">${sub}</p>` : ''}
      </div>
      ${actions ? `<div class="page-actions">${actions}</div>` : ''}
    </header>`;
}

function statCard({ iconName, value, label, hint, tone, status = null, minister = null }) {
  const clickable = status !== null;
  const tag = clickable ? 'button' : 'div';
  const attrs = clickable
    ? `type="button" data-action="goto-tasks" data-status="${status}"${minister ? ` data-minister="${minister}"` : ''} title="Відкрити список завдань"`
    : '';
  return `
    <${tag} class="card stat-card tone-${tone}" ${attrs}>
      <span class="stat-card__icon">${icon(iconName)}</span>
      <span class="stat-card__body">
        <span class="stat-card__value" style="display:block">${value}</span>
        <span class="stat-card__label" style="display:block">${label}</span>
        <span class="stat-card__hint" style="display:block">${hint}</span>
      </span>
    </${tag}>`;
}

function ring(percent, size = 152, stroke = 12) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - percent / 100);
  return `
    <svg class="ring" viewBox="0 0 ${size} ${size}" role="img" aria-label="Виконано ${percent}%">
      <circle class="ring__track" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"></circle>
      <circle class="ring__value" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"
        stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${c.toFixed(2)}" data-offset="${offset.toFixed(2)}"
        transform="rotate(-90 ${size / 2} ${size / 2})" ${percent === 0 ? 'stroke-opacity="0"' : ''}></circle>
    </svg>`;
}

function progressCard(s, title = 'Прогрес кабінету', note = 'Розраховується автоматично: виконані завдання ÷ усі завдання.') {
  const segments = ['done', 'progress', 'planned', 'overdue']
    .filter((k) => s[k] > 0)
    .map((k) => `<span class="st--${k}" style="flex-grow:${s[k]}" title="${STATUSES[k].label}: ${s[k]}"></span>`)
    .join('');
  return `
    <article class="card progress-card">
      ${cardHead('target', title)}
      <div class="progress-card__body">
        <div class="ring-wrap">
          ${ring(s.percent)}
          <div class="ring-label"><b>${s.percent}%</b><span>виконано</span></div>
        </div>
        <ul class="legend-list">
          ${['done', 'progress', 'planned', 'overdue'].map((k) => `
            <li><span class="dot st--${k}"></span><span>${STATUSES[k].label}</span><b>${s[k]}</b></li>`).join('')}
        </ul>
      </div>
      <div class="stack-bar" aria-hidden="true">${segments}</div>
      <p class="card__note">${note}</p>
    </article>`;
}

  const sortOptions = [
    ['date-asc', 'Дата: спочатку ближчі'],

      <label class="search">

/* ---------- Розділ «Бажання учнів» (STUDENT VOICE) ---------- */

const VOICE_TOKEN_KEY = 'sg-dashboard:voice:v1';
const VOICE_CATEGORIES = {
  'Шкільні заходи': 'party-popper', 'Комфорт та інфраструктура': 'armchair', 'Освіта та розвиток': 'graduation-cap',
  'IT та технології': 'cpu', 'Спорт': 'dumbbell', 'Волонтерство та благодійність': 'heart-handshake', 'Екологія': 'leaf', 'Інше': 'sparkles',
};
const VOICE_MODERATION = {
  'Нова': { tone: 'progress', icon: 'sparkles' },
  'Потребує модерації': { tone: 'warn', icon: 'shield-alert' },
  'Схвалена': { tone: 'done', icon: 'circle-check' },
  'Відхилена': { tone: 'overdue', icon: 'circle-x' },
};
const VOICE_REVIEW = {
  'Очікує розгляду': 'planned', 'На розгляді': 'progress', 'Прийнята до реалізації': 'gold', 'У процесі реалізації': 'warn', 'Реалізована': 'done',
};

const voice = { ideas: null, loading: false, error: '', search: '', fMod: 'all', fReview: 'all', fCat: 'all', loadedAt: 0 };

function isVoiceUrl(value) {
  return typeof value === 'string' && /^https:\/\/script\.google\.com\/(?:a\/macros\/[A-Za-z0-9.-]+|macros)\/s\/[A-Za-z0-9_-]{10,}\/exec$/.test(value.trim());
}

const hasGasRun = () => typeof google !== 'undefined' && google.script && google.script.run;
/** Чи може ця копія кабінету звертатися до таблиці. */
const voiceReachable = () => CLOUD || hasGasRun() || (Boolean(state.settings.voiceUrl) && !inArtifact());

function voiceToken() {
  if (CLOUD) return currentUser() ? 'cloud' : '';
  try {
    const saved = JSON.parse(localStorage.getItem(VOICE_TOKEN_KEY) || 'null');
    if (saved && saved.token && saved.exp > Date.now()) return saved.token;
  } catch { /* ignore */ }
  return '';
}

function saveVoiceToken(token, ttlSec) {
  try { localStorage.setItem(VOICE_TOKEN_KEY, JSON.stringify({ token, exp: Date.now() + (ttlSec - 60) * 1000 })); } catch { /* ignore */ }
}

function clearVoiceToken() {
  try { localStorage.removeItem(VOICE_TOKEN_KEY); } catch { /* ignore */ }
  Object.assign(voice, { ideas: null, error: '', search: '', fMod: 'all', fReview: 'all', fCat: 'all', loadedAt: 0 });
}

function voiceCall(request) {
  if (CLOUD) return cloudVoiceCall(request);
  if (hasGasRun()) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((text) => { try { resolve(JSON.parse(text)); } catch (err) { reject(err); } })
        .withFailureHandler(reject)
        .api(JSON.stringify(request));
    });
  }
  if (inArtifact()) return Promise.reject(new Error('artifact'));
  if (!state.settings.voiceUrl) return Promise.reject(new Error('not-configured'));
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 20000);
  return fetch(state.settings.voiceUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // простий запит — без CORS-preflight
    body: JSON.stringify(request),
    redirect: 'follow',
    credentials: 'omit',
    signal: controller.signal,
  }).then((r) => r.json()).finally(() => clearTimeout(timer));
}

function voiceErrorText(err) {
  if (err && err.message === 'artifact') return 'У версії на claude.ai звʼязок із Google Таблицею заблоковано правилами безпеки claude.ai.';
  return 'Не вдалося звʼязатися з таблицею. Перевірте інтернет і адресу веб-застосунку.';
}

function loadWishes(showToast) {
  if (voice.loading || !voiceToken()) return;
  voice.loading = true;
  voice.error = '';
  if (parseRoute().name === 'wishes') renderWishList();
  voiceCall({ action: 'list', token: voiceToken() })
    .then((res) => {
      if (res && res.auth === false) {
        clearVoiceToken();
        voice.error = res.error;
        return;
      }
      if (!res || !res.ok) throw new Error(res && res.error ? res.error : 'bad');
      voice.ideas = Array.isArray(res.ideas) ? res.ideas : [];
      voice.loadedAt = Date.now();
      if (showToast) toast('Список ідей оновлено');
    })
    .catch((err) => { voice.error = err.message && !['bad', 'artifact', 'not-configured', 'Failed to fetch'].includes(err.message) ? err.message : voiceErrorText(err); })
    .finally(() => {
      voice.loading = false;
      if (!currentUser()) return;
      updateChrome(parseRoute().name);
      if (parseRoute().name === 'wishes') render();
    });
}

function voiceLogout() {
  const token = voiceToken();
  if (token) voiceCall({ action: 'logout', token }).catch(() => {});
  clearVoiceToken();
  render();
  toast('Від’єднано від STUDENT VOICE', 'info');
}

function voiceStats(list) {
  return {
    total: list.length,
    fresh: list.filter((i) => i.moderation === 'Нова' || i.moderation === 'Потребує модерації').length,
    flagged: list.filter((i) => i.moderation === 'Потребує модерації').length,
    reviewing: list.filter((i) => i.review === 'На розгляді').length,
    accepted: list.filter((i) => i.review === 'Прийнята до реалізації' || i.review === 'У процесі реалізації').length,
    done: list.filter((i) => i.review === 'Реалізована').length,
  };
}

const voiceBadge = (label, tone, ic) => `<span class="badge vtone-${tone}">${ic ? icon(ic) : ''}${esc(label)}</span>`;
const modBadge = (m) => voiceBadge(m, (VOICE_MODERATION[m] || VOICE_MODERATION['Нова']).tone, (VOICE_MODERATION[m] || VOICE_MODERATION['Нова']).icon);
const reviewBadge = (r) => voiceBadge(r, VOICE_REVIEW[r] || 'planned', 'flag');

    return `${head()}<div class="card">${emptyState({

  }

        <form class="form voice-form" id="voice-key-form" novalidate>
          <div class="field ${voice.error ? 'has-error' : ''}" data-field="key">

              <button type="button" class="icon-btn icon-btn--sm input-action" data-action="toggle-password" aria-label="Показати ключ" title="Показати ключ">${icon('eye')}</button></div>
            <p class="field__error">${voice.error ? esc(voice.error) : ''}</p>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn btn--gold">${icon('log-in')}<span>Увійти</span></button>
            ${can('manage-data') && !hasGasRun() ? `<button type="button" class="btn btn--ghost" data-action="voice-change-url">${icon('link')}<span>Змінити адресу</span></button>` : ''}
          </div>
        </form>

  }

  return `${head(`

      <button type="button" class="btn btn--ghost" data-action="voice-disconnect">${icon('log-out')}<span>Відʼєднатися</span></button>`)}
    <div id="wish-results"></div>`;
}

function filteredWishes() {
  const q = voice.search.trim().toLowerCase();
  return (voice.ideas || []).filter((i) => {
    if (voice.fMod !== 'all' && i.moderation !== voice.fMod) return false;
    if (voice.fReview !== 'all' && i.review !== voice.fReview) return false;
    if (voice.fCat !== 'all' && i.category !== voice.fCat) return false;
    if (q && ![i.id, i.title, i.description, i.problem, i.how, i.author, i.klass, i.minister].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

  }

  const opt = (values, current, label) => [`<option value="all">${label}</option>`, ...values.map((v) => `<option value="${esc(v)}" ${current === v ? 'selected' : ''}>${esc(v)}</option>`)].join('');

      ${statCard({ iconName: 'search', value: st.reviewing, label: 'На розгляді', hint: 'обговорюються', tone: 'planned' })}
      ${statCard({ iconName: 'flag', value: st.accepted, label: 'Прийнятих', hint: 'до реалізації', tone: 'gold' })}

    <div class="card toolbar">
      <label class="search">${icon('search')}<span class="sr-only">Пошук ідей</span>

function afterWishesRender() {
  renderWishList();
  if (voiceToken() && voiceReachable() && !voice.ideas && !voice.loading) loadWishes(false);
  const urlForm = $('#voice-url-form');
  if (urlForm) {
    urlForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!requireAdmin()) return;
      const value = String(new FormData(urlForm).get('voiceUrl') || '').trim();
      if (!isVoiceUrl(value)) {
        setFieldErrors(urlForm, { voiceUrl: 'Вставте адресу у форматі https://script.google.com/macros/s/…/exec' });
        return;
      }
      state.settings.voiceUrl = value;
      logActivity('data', 'Підключено STUDENT VOICE');
      commit('Адресу збережено. Тепер введіть ключ кабінету.');
    });
  }
  const keyForm = $('#voice-key-form');
  if (keyForm) {
    keyForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const key = String(new FormData(keyForm).get('key') || '');
      if (!key) { setFieldErrors(keyForm, { key: 'Введіть ключ' }); return; }
      const btn = keyForm.querySelector('button[type="submit"]');
      btn.disabled = true;
      voiceCall({ action: 'login', key })
        .then((res) => {
          if (!res || !res.ok) { setFieldErrors(keyForm, { key: (res && res.error) || 'Невірний ключ' }); return; }
          saveVoiceToken(res.token, Number(res.expiresIn) || 21600);
          voice.error = '';
          voice.ideas = null;
          render();
          toast('Підключено до STUDENT VOICE');
        })
        .catch((err) => setFieldErrors(keyForm, { key: voiceErrorText(err) }))
        .finally(() => { if (document.contains(btn)) btn.disabled = false; });
    });
  }
}

/** Хто що може змінювати: адміністратори — усе, відповідальний міністр — розгляд і коментар. */
function wishPermissions(idea) {
  const user = currentUser();
  const responsible = Boolean(idea.minister && !isStaff(user) && idea.minister.startsWith(user.position));
  return { all: user.isAdmin, review: user.isAdmin || responsible, comment: user.isAdmin || responsible };
}

function ministerLabel(m) {
  return `${m.position} (${m.name})`;
}

function openWish(id) {
  const idea = (voice.ideas || []).find((i) => i.id === id);
  if (!idea) return;
  const can = wishPermissions(idea);
  const field = (label, value) => (value ? `<div><h4 class="detail__label">${label}</h4><div class="detail__plan">${esc(value)}</div></div>` : '');
  const ministers = cabinetMembers();
  const ministerOptions = ['<option value="">— Не призначено —</option>',
    ...ministers.map((m) => `<option value="${esc(ministerLabel(m))}" ${idea.minister === ministerLabel(m) ? 'selected' : ''}>${esc(ministerLabel(m))}</option>`),
    idea.minister && !ministers.some((m) => ministerLabel(m) === idea.minister) ? `<option value="${esc(idea.minister)}" selected>${esc(idea.minister)}</option>` : '',
  ].join('');
  const sel = (name, values, current, enabled) => `<select class="select" name="${name}" ${enabled ? '' : 'disabled'}>${values.map((v) => `<option value="${esc(v)}" ${v === current ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;

  const body = `
    <div class="detail__badges">${modBadge(idea.moderation)}${reviewBadge(idea.review)}<span class="wish__id">${esc(idea.id)}</span></div>
    <h3 class="detail__title">${esc(idea.title)}</h3>
    <div class="detail__meta">
      <div class="meta-box"><p class="meta-box__label">Категорія</p><p class="meta-box__value">${esc(idea.category)}</p><p class="meta-box__sub">Подано ${esc(idea.date)}</p></div>
      <div class="meta-box"><p class="meta-box__label">Автор</p><p class="meta-box__value">${idea.anonymous || !idea.author ? 'Анонімно' : esc(idea.author)}</p><p class="meta-box__sub">${idea.klass ? `Клас ${esc(idea.klass)}` : 'Клас не вказано'}</p></div>
    </div>
    ${idea.flags ? `<p class="form-note form-note--tz">${icon('shield-alert')}<span><b>Автоперевірка:</b> ${esc(idea.flags)}. Перегляньте текст перед схваленням — сама система нічого не відхиляє.</span></p>` : ''}
    <div class="wish-fields">
      ${field('Опис ідеї', idea.description)}
      ${field('Яку проблему вирішує', idea.problem)}
      ${field('Як реалізувати', idea.how)}
      ${field('Що потрібно', idea.resources)}
    </div>

    <form class="form wish-form" id="wish-form" novalidate>
      <h4 class="detail__label">Рішення кабінету</h4>
      <div class="form-grid">
        <div class="field"><label>Модерація</label>${sel('moderation', Object.keys(VOICE_MODERATION), idea.moderation, can.all)}
          <p class="field__hint">На сайті STUDENT VOICE видно лише «Схвалені».</p></div>
        <div class="field"><label>Розгляд</label>${sel('review', Object.keys(VOICE_REVIEW), idea.review, can.review)}</div>
      </div>
      <div class="field"><label>Відповідальний міністр</label><select class="select" name="minister" ${can.all ? '' : 'disabled'}>${ministerOptions}</select></div>
      <div class="field"><label for="w-comment">Коментар кабінету (внутрішній)</label>
        <textarea class="input" id="w-comment" name="comment" maxlength="1000" rows="3" ${can.comment ? '' : 'disabled'} placeholder="Видно лише кабінету в таблиці й тут">${esc(idea.comment)}</textarea></div>
      <p class="field__error" data-wish-error></p>
      <div class="modal__footer modal__footer--split">
        <button type="button" class="btn btn--ghost" data-role="wish-task">${icon('list-plus')}<span>Створити завдання</span></button>
        ${can.review || can.comment ? `<button type="submit" class="btn btn--gold">${icon('save')}<span>Зберегти в таблицю</span></button>` : '<span class="muted" style="font-size:13px">Змінювати можуть адміністратори та відповідальний міністр</span>'}
      </div>
    </form>`;
  const modal = openModal({ title: 'Ідея учня', iconName: 'megaphone', body });
  const form = $('#wish-form', modal);
  $('[data-role="wish-task"]', form).addEventListener('click', () => {
    const owner = cabinetMembers().find((m) => idea.minister && idea.minister.startsWith(m.position));
    closeModal(modal);
    const plan = [`Ідея учня зі STUDENT VOICE (${idea.id}).`, idea.description, idea.how ? `Як реалізувати: ${idea.how}` : '', idea.resources ? `Що потрібно: ${idea.resources}` : '']
      .filter(Boolean).join('\n');
    openTaskForm(null, { title: idea.title, plan, initiative: true, ministerId: owner && assignableFor().some((m) => m.id === owner.id) ? owner.id : '' });
  });
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const changes = {};
    if (can.all) {
      if (fd.get('moderation') !== idea.moderation) changes.moderation = fd.get('moderation');
      if (fd.get('minister') !== idea.minister) changes.minister = fd.get('minister');
    }
    if (can.review && fd.get('review') !== idea.review) changes.review = fd.get('review');
    if (can.comment && String(fd.get('comment') || '').trim() !== idea.comment) changes.comment = String(fd.get('comment') || '').trim();
    const errBox = $('[data-wish-error]', form);
    if (!Object.keys(changes).length) { closeModal(modal); return; }
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    voiceCall({ action: 'update', token: voiceToken(), id: idea.id, changes })
      .then((res) => {
        if (res && res.auth === false) { clearVoiceToken(); closeModal(modal); render(); toast(res.error, 'error'); return; }
        if (!res || !res.ok) { errBox.textContent = (res && res.error) || 'Не вдалося зберегти'; return; }
        Object.assign(idea, res.idea);
        logActivity('status', `STUDENT VOICE ${idea.id}: ${Object.keys(changes).map((k) => ({ moderation: 'модерація', review: 'розгляд', minister: 'відповідальний', comment: 'коментар' }[k])).join(', ')} оновлено`);
        closeModal(modal);
        commit(CLOUD ? 'Збережено' : 'Збережено в таблицю «Пропозиції учнів»');
      })
      .catch((err) => { errBox.textContent = voiceErrorText(err); })
      .finally(() => { if (document.contains(btn)) btn.disabled = false; });
  });
}

    e.preventDefault();
    const fd = new FormData(e.target);

      title: String(fd.get('title') || '').trim(),
      text: String(fd.get('text') || '').trim(),
      wishDate: String(fd.get('wishDate') || ''),
    };
    const errors = {};
    if (!values.title) errors.title = 'Назвіть ідею';
    if (values.wishDate && !isValidISO(values.wishDate)) errors.wishDate = 'Вкажіть коректну дату';

}

async function deleteDraft(id) {
  const user = currentUser();
  const draft = state.drafts.find((d) => d.id === id && d.ownerId === user.id);
  if (!draft) return;
  const ok = await confirmDialog({ title: 'Видалити ідею?', text: `Чернетку <b>«${esc(draft.title)}»</b> буде видалено.`, confirmLabel: 'Видалити' });
  if (!ok) return;
  state.drafts = state.drafts.filter((d) => d.id !== id);
  commit('Чернетку видалено');
}

function draftToTask(id) {
  const user = currentUser();
  const draft = state.drafts.find((d) => d.id === id && d.ownerId === user.id);
  if (!draft) return;
  openTaskForm(null, {
    title: draft.title,
    plan: draft.text,
    date: draft.wishDate && draft.wishDate >= todayISO() ? draft.wishDate : '',
    ministerId: isStaff(user) ? '' : user.id,
    initiative: !isStaff(user),
    fromDraft: draft.id,
  });
}

/* ---------- 9. Сторінка «Календар» ---------- */

function renderCalendar() {
  const base = ui.calMonth;
  const year = base.getFullYear();
  const month = base.getMonth();
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = (first.getDay() + 6) % 7; // тиждень з понеділка
  const weeks = Math.ceil((startOffset + daysInMonth) / 7);
  const start = addDays(first, -startOffset);
  const today = todayISO();

  const byDate = {};
  visibleTasks().forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });
  Object.values(byDate).forEach((list) => list.sort((a, b) => STATUS_ORDER[effectiveStatus(a)] - STATUS_ORDER[effectiveStatus(b)]));

  const cells = [];
  for (let i = 0; i < weeks * 7; i += 1) {
    const d = addDays(start, i);
    const iso = toISO(d);
    const list = byDate[iso] || [];
    const classes = [
      'cal-cell',
      d.getMonth() !== month ? 'is-other' : '',
      iso === today ? 'is-today' : '',
      iso === ui.calSelected ? 'is-selected' : '',
    ].filter(Boolean).join(' ');
    const label = `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${list.length ? `, завдань: ${list.length}` : ''}`;
    cells.push(`
      <div class="${classes}" data-action="cal-day" data-date="${iso}" tabindex="0" role="gridcell" aria-label="${label}">
        <span class="cal-num">${d.getDate()}</span>
        ${list.slice(0, 3).map((t) => `
          <button type="button" class="cal-chip st--${effectiveStatus(t)}" data-action="view-task" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>`).join('')}
        ${list.length > 3 ? `<span class="cal-more">+${list.length - 3} ще</span>` : ''}
        ${list.length ? `<span class="cal-dots" aria-hidden="true">${list.slice(0, 4).map((t) => `<span class="dot st--${effectiveStatus(t)}"></span>`).join('')}</span>` : ''}
      </div>`);
  }

  const selected = ui.calSelected;
  const selectedTasks = selected ? (byDate[selected] || []) : [];
  const selectedTitle = selected
    ? `${capitalize(WEEKDAYS[parseISO(selected).getDay()])}, ${formatDate(selected)}`
    : 'Оберіть день';

  const dayPanel = `
    <article class="card day-panel">
      ${cardHead('calendar-days', esc(selectedTitle), selected ? `<button type="button" class="btn btn--ghost btn--sm" data-action="new-task" data-date="${selected}">${icon('plus')}<span>Додати на цей день</span></button>` : '')}
      ${selectedTasks.length
        ? `<div class="task-grid">${selectedTasks.map(taskCard).join('')}</div>`
        : emptyState({ iconName: 'calendar-plus', title: 'На цей день завдань немає', text: 'Натисніть на будь-який день у календарі, щоб переглянути його завдання.', small: true })}
    </article>`;

  return `
    ${pageHead('Календар', isCabinetView() ? 'Дедлайни завдань усього кабінету по днях' : 'Ваші дедлайни по днях', `
      <button type="button" class="btn btn--gold" data-action="new-task"${selected ? ` data-date="${selected}"` : ''}>${icon('plus')}<span>Створити завдання</span></button>`)}

    <div class="cal-head">
      <div class="cal-nav">
        <button type="button" class="icon-btn" data-action="cal-prev" aria-label="Попередній місяць">${icon('chevron-left')}</button>
        <h2 class="cal-title" aria-live="polite">${MONTHS[month]} ${year}</h2>
        <button type="button" class="icon-btn" data-action="cal-next" aria-label="Наступний місяць">${icon('chevron-right')}</button>
        <button type="button" class="btn btn--ghost btn--sm" data-action="cal-today">Сьогодні</button>
      </div>
      <ul class="legend">
        ${Object.entries(STATUSES).map(([k, v]) => `<li><span class="dot st--${k}"></span>${v.label}</li>`).join('')}
      </ul>
    </div>

    <div class="card calendar" role="grid" aria-label="Календар завдань">
      <div class="cal-weekdays" role="row">${WEEKDAYS_SHORT.map((d) => `<span role="columnheader">${d}</span>`).join('')}</div>
      <div class="cal-grid">${cells.join('')}</div>
    </div>

    ${dayPanel}`;
}

function roleTag(m) {

  if (isSchool(m)) return `<span class="tag-school">${icon('school')}${m.director ? 'Директор' : 'Адміністрація'}</span>`;

function destroyCharts() {
  charts.forEach((c) => c.destroy());
  charts = [];
}

function setChartDefaults() {
  Chart.defaults.color = '#A9B6C8';
  Chart.defaults.font.family = "'Manrope', system-ui, sans-serif";
  Chart.defaults.font.weight = '600';
  Chart.defaults.borderColor = 'rgba(36, 59, 85, 0.6)';
}

const chartTooltip = {
  backgroundColor: '#0E1826',
  borderColor: '#243B55',
  borderWidth: 1,
  titleColor: '#F4F6F9',
  bodyColor: '#A9B6C8',
  padding: 12,
  cornerRadius: 10,
  boxPadding: 5,
  usePointStyle: true,
  titleFont: { weight: '700' },
};

const chartLegend = {
  position: 'bottom',
  labels: { usePointStyle: true, pointStyle: 'circle', boxWidth: 8, boxHeight: 8, padding: 16 },
};

function wrapLabel(text, max = 24) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach((w) => {
    if ((`${line} ${w}`).trim().length > max && line) {
      lines.push(line);
      line = w;
    } else {
      line = `${line} ${w}`.trim();
    }
  });
  if (line) lines.push(line);
  return lines;
}

function buildAnalyticsCharts() {
  const boxes = $$('.chart-box');
  if (!boxes.length) return;
  if (!window.Chart) {
    boxes.forEach((b) => {
      b.innerHTML = '<div class="chart-fallback">Не вдалося завантажити бібліотеку графіків. Перевірте підключення до інтернету та оновіть сторінку.</div>';
    });
    return;
  }

  const s = computeStats(visibleTasks());
  const keys = ['done', 'progress', 'planned', 'overdue'];

  /* 1. Розподіл за статусами (кільцева діаграма з відсотком у центрі) */
  const centerText = {
    id: 'centerText',
    afterDraw(chart) {
      const { ctx, chartArea } = chart;
      const x = (chartArea.left + chartArea.right) / 2;
      const y = (chartArea.top + chartArea.bottom) / 2;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#F4F6F9';
      ctx.font = "800 28px 'Manrope', sans-serif";
      ctx.fillText(`${s.percent}%`, x, y - 8);
      ctx.fillStyle = '#74879F';
      ctx.font = "600 12px 'Manrope', sans-serif";
      ctx.fillText('виконано', x, y + 16);
      ctx.restore();
    },
  };

  charts.push(new Chart($('#chart-status'), {
    type: 'doughnut',
    data: {
      labels: keys.map((k) => STATUSES[k].label),
      datasets: [{
        data: keys.map((k) => s[k]),
        backgroundColor: keys.map((k) => STATUSES[k].color),
        borderColor: '#17283D',
        borderWidth: 3,
        hoverOffset: 8,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '72%',
      plugins: {
        legend: chartLegend,
        tooltip: {
          ...chartTooltip,
          callbacks: {
            label: (ctx) => {
              const pct = s.total ? Math.round((ctx.parsed / s.total) * 100) : 0;
              return ` ${ctx.label}: ${ctx.parsed} (${pct}%)`;
            },
          },
        },
      },
    },
    plugins: [centerText],
  }));

  /* 2. Динаміка по місяцях */
  const dyn = monthlyDynamics();
  const canvas = $('#chart-dynamics');
  const ctx = canvas.getContext('2d');
  const goldFill = ctx.createLinearGradient(0, 0, 0, 280);
  goldFill.addColorStop(0, 'rgba(214, 182, 110, 0.32)');
  goldFill.addColorStop(1, 'rgba(214, 182, 110, 0)');
  const blueFill = ctx.createLinearGradient(0, 0, 0, 280);
  blueFill.addColorStop(0, 'rgba(110, 168, 230, 0.18)');
  blueFill.addColorStop(1, 'rgba(110, 168, 230, 0)');

  const lineDataset = (label, data, color, fill, extra = {}) => ({
    label,
    data,
    borderColor: color,
    backgroundColor: fill,
    pointBackgroundColor: color,
    pointBorderColor: '#17283D',
    pointBorderWidth: 2,
    pointRadius: 4,
    pointHoverRadius: 6,
    borderWidth: 2.5,
    tension: 0.38,
    cubicInterpolationMode: 'monotone',
    fill: Boolean(fill) && fill !== 'transparent',
    ...extra,
  });

  charts.push(new Chart(canvas, {
    type: 'line',
    data: {
      labels: dyn.labels,
      datasets: [
        lineDataset('Дедлайни', dyn.deadlines, '#6EA8E6', blueFill),
        lineDataset('Виконано', dyn.done, '#D6B66E', goldFill),
        lineDataset('Прострочено', dyn.overdue, '#EF6B6B', 'transparent', { borderDash: [6, 5], pointRadius: 3 }),
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: 'rgba(36, 59, 85, 0.5)' }, border: { display: false } },
        x: { grid: { display: false }, border: { display: false } },
      },
      plugins: { legend: chartLegend, tooltip: chartTooltip },
    },
  }));

  /* 3. Активність міністрів (горизонтальна складена діаграма) — лише в огляді кабінету */
  if (!$('#chart-ministers')) return;
  const ranking = ministerRanking();
  charts.push(new Chart($('#chart-ministers'), {
    type: 'bar',
    data: {
      labels: ranking.map(({ m }) => wrapLabel(m.position)),
      datasets: keys.map((k) => ({
        label: STATUSES[k].label,
        data: ranking.map(({ s: ms }) => ms[k]),
        backgroundColor: STATUSES[k].color,
        borderRadius: 6,
        borderSkipped: false,
        barThickness: 18,
      })),
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      onClick: (evt, elements) => {
        if (elements.length) navigate(ministerRoute(ranking[elements[0].index].m.id));
      },
      onHover: (evt, elements) => {
        evt.native.target.style.cursor = elements.length ? 'pointer' : 'default';
      },
      scales: {
        x: { stacked: true, beginAtZero: true, ticks: { precision: 0 }, grid: { color: 'rgba(36, 59, 85, 0.5)' }, border: { display: false } },
        y: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { color: '#C9D3E0', font: { size: 12 } } },
      },
      plugins: {
        legend: chartLegend,
        tooltip: {
          ...chartTooltip,
          callbacks: {
            title: (items) => {
              const { m } = ranking[items[0].dataIndex];
              return `${m.position} · ${m.name}`;
            },
          },
        },
      },
    },
  }));
}

/** Порядок у швидкому вході: Президент, Прем'єр, міністри, адміністрація школи, арт-менеджери. */
function quickLoginAccounts() {
  const rank = (m) => {
    if (isManager(m)) return 4;
    if (isSchool(m)) return m.director ? 2 : 3;
    if (isPresident(m)) return 0;
    if (isPremier(m)) return 1;
    return 1.5;
  };
  return [...state.ministers].sort((a, b) => rank(a) - rank(b));
}

/** Що може роль — коротко, для налаштувань і швидкого входу. */
function roleSummary(user) {
  if (isManager(user)) return 'Керує самоврядуванням: бачить усе, призначає й змінює будь-які завдання, погоджує заходи, керує всіма акаунтами, фото та даними.';
  if (isSchool(user)) return `${user.director ? 'Директор школи' : 'Адміністрація школи'}: бачить роботу всього самоврядування, погоджує масштабні заходи, приймає щомісячні звіти, може ставити завдання кабінету.`;
  if (isPresident(user)) return 'Очолює самоврядування: керує всіма завданнями, затверджує плани міністерств, приймає звіти, вимагає ТЗ, керує посадами кабінету.';
  if (isPremier(user)) return 'Координує щоденну роботу міністерств: бачить увесь кабінет, призначає завдання й контролює терміни (крім завдань Президента), звітує Президенту.';
  return 'Веде своє міністерство: власні завдання, план на чверть, щомісячний звіт, ініціативи, команду учнів і чернетки.';
}

function quickLogin(id) {
  const account = getMinister(id);
  if (!account || !state.settings.quickLogin) return;
  const form = $('#login-form');
  // Акаунт із власним паролем або 2FA: лише підставляємо логін, далі — пароль і код
  if (account.passwordHash || account.totp) {
    form.elements.login.value = account.login;
    form.elements.password.value = '';
    form.elements.password.focus();
    showLoginError(account.totp ? 'Цей акаунт захищено 2FA — введіть пароль, а потім код із застосунку' : 'Цей акаунт має власний пароль — введіть його, щоб увійти');
    return;
  }
  saveSession(account.id, form.elements.remember.checked);
  resetViewState();
  history.replaceState(null, '', '#dashboard');
  render();
  toast(`Вітаємо, ${account.name}!`);
}
